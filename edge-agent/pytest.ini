[pytest]
# Run from edge-agent/. pythonpath=. makes the opsgrid_agent package importable
# without installing it. The existing stdlib unittest suites are discovered and
# run by pytest unchanged.
testpaths = tests
pythonpath = .
python_files = test_*.py

# DDIL fault-injection scenarios (FS-753). Registered so an unknown-marker warning cannot
# hide a typo'd `@pytest.mark.ddil`, which would silently exclude a scenario from the
# nightly run while looking marked.
markers =
    ddil: Denied/Degraded/Intermittent/Limited-bandwidth scenarios. Run nightly:
        `pytest -m ddil`. Excluded from the default run only because they are slower,
        not because they are optional.
