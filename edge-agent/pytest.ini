[pytest]
# Run from edge-agent/. pythonpath=. makes the opsgrid_agent package importable
# without installing it. The existing stdlib unittest suites are discovered and
# run by pytest unchanged.
testpaths = tests
pythonpath = .
python_files = test_*.py

# DDIL fault-injection scenarios (FS-753). Registered so an unknown-marker warning cannot
# hide a typo'd `@pytest.mark.ddil`, which would silently exclude a scenario from the
# nightly run while looking marked.
markers =
    ddil: Denied/Degraded/Intermittent/Limited-bandwidth scenarios. Run nightly:
        `pytest -m ddil`. Excluded from the default run only because they are slower,
        not because they are optional.

# FS-754. The marker comment above claimed these were excluded from the default run and
# nothing implemented it, so `pytest -q` in the per-PR job ran them anyway — harmless at
# nine fast scenarios, then S2 added a 400,000-row backlog and the job grew by two minutes
# for coverage the nightly `-m ddil` job already provides. A CLI `-m` overrides this, which
# is exactly how the nightly job selects them.
#
# What is NOT excluded: `test_priority_tiers_match_the_backend.py` is unmarked on purpose.
# Tier drift between the two copies of the table is a per-PR concern; a 400,000-row drain
# measurement is not.
addopts = -m "not ddil"
