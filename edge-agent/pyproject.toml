[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsgrid-agent"
dynamic = ["version", "dependencies"]
description = "OmniusGrid edge agent: industrial protocol collectors with store-and-forward buffering and an mTLS cloud uplink"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[tool.setuptools.dynamic]
version = {attr = "opsgrid_agent.__version__"}
# Single source of truth: requirements.txt (also used by the Dockerfile).
dependencies = { file = "requirements.txt" }

[project.scripts]
opsgrid-agent = "opsgrid_agent.main:run"

[tool.setuptools.packages.find]
include = ["opsgrid_agent*"]
exclude = ["tests*"]
