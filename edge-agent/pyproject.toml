[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsgrid-agent"
version = "1.0.0"
description = "OmniusGrid edge agent: industrial protocol collectors with store-and-forward buffering and an mTLS cloud uplink"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# Single source of truth: requirements.txt (also used by the Dockerfile). Two
# hand-maintained lists WILL drift — an earlier draft of this file already
# disagreed with requirements.txt on the aiokafka major version and omitted
# hard imports (httpx, watchdog), which crash-looped the bare-metal install.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }

[project.scripts]
opsgrid-agent = "opsgrid_agent.main:run"

[tool.setuptools.packages.find]
include = ["opsgrid_agent*"]
