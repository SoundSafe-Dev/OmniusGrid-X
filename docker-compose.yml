version: '3.8'

services:
  # Message Broker - Redpanda (Kafka API compatible)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.5
    container_name: omniusgrid-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - omniusgrid-network
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database - PostgreSQL with TimescaleDB
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: omniusgrid-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: omniusgrid
      POSTGRES_PASSWORD: omniusgrid_dev_password
      POSTGRES_DB: omniusgrid
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - omniusgrid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniusgrid"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniusgrid-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://omniusgrid:omniusgrid_dev_password@timescaledb:5432/omniusgrid
      REDPANDA_URL: redpanda:29092
      JWT_SECRET_KEY: dev_secret_key_change_in_production
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      timescaledb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - omniusgrid-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Ingestion Workers - Process data from Redpanda to TimescaleDB
  ingestion-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniusgrid-ingestion
    environment:
      DATABASE_URL: postgresql://omniusgrid:omniusgrid_dev_password@timescaledb:5432/omniusgrid
      REDPANDA_URL: redpanda:29092
      WORKER_MODE: ingestion
    volumes:
      - ./backend:/app
    depends_on:
      timescaledb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - omniusgrid-network
    command: python -m app.workers.ingestion

  # Frontend - React Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omniusgrid-frontend
    restart: unless-stopped
    ports:
      - "9999:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      REACT_APP_API_URL: http://localhost:8002
      REACT_APP_WS_URL: ws://localhost:8002
    depends_on:
      backend:
        condition: service_started
    networks:
      - omniusgrid-network

  # Local NTP Server - for clock synchronization
  ntp:
    image: alpine:latest
    container_name: omniusgrid-ntp
    cap_add:
      - SYS_TIME
    command: |
      sh -c "apk add --no-cache chrony && chronyd -d -F 1"
    ports:
      - "123:123/udp"
    environment:
      - NTP_SERVERS=time.nist.gov,time.cloudflare.com
    networks:
      - omniusgrid-network

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: omniusgrid-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--alertmanager.url=http://alertmanager:9093'
    networks:
      - omniusgrid-network

  # Alertmanager - Alert routing
  alertmanager:
    image: prom/alertmanager:latest
    container_name: omniusgrid-alertmanager
    volumes:
      - ./infra/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - omniusgrid-network

  # Grafana - Visualization + Loki logs
  grafana:
    image: grafana/grafana:latest
    container_name: omniusgrid-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=omniusgrid_admin
      - GF_INSTALL_PLUGINS=grafana-lokiexplore-app
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    networks:
      - omniusgrid-network

  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: omniusgrid-loki
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - omniusgrid-network

  # Promtail - Log collector (ships to Loki)
  promtail:
    image: grafana/promtail:latest
    container_name: omniusgrid-promtail
    volumes:
      - ./infra/loki/promtail.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - omniusgrid-network

  # Redis - Caching and session store
  redis:
    image: redis:7-alpine
    container_name: omniusgrid-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - omniusgrid-network

  # Edge Agent Simulator (for testing)
  edge-agent-sim:
    build:
      context: ./edge-agent
      dockerfile: Dockerfile
    container_name: omniusgrid-edge-sim
    environment:
      REDPANDA_URL: redpanda:29092
      ORGANIZATION_ID: dev-org
      AGENT_ID: simulator-001
      BUFFER_RETENTION_HOURS: 24
    volumes:
      - edge-agent-data:/var/lib/omniusgrid-agent
      - ./edge-agent:/app
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - omniusgrid-network
    profiles:
      - simulator

volumes:
  redpanda-data:
  timescaledb-data:
  redis-data:
  edge-agent-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:

networks:
  omniusgrid-network:
    driver: bridge
