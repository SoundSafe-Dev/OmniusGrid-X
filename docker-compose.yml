services:
  # Message Broker - Redpanda (Kafka API compatible)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.5
    container_name: omniusgrid-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - omniusgrid-network
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database - PostgreSQL with TimescaleDB
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: omniusgrid-timescaledb
    restart: unless-stopped
    # FS-895. log_min_duration_statement matches the k8s config (base/timescaledb-
    # statefulset.yaml, database-ha/cluster.yaml) so a slow query is visible in local
    # logs the same way it would be in any deployed environment.
    command: postgres -c shared_preload_libraries=timescaledb,pg_stat_statements -c log_min_duration_statement=1000
    environment:
      POSTGRES_USER: omniusgrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniusgrid_dev_password}
      POSTGRES_DB: omniusgrid
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      # NOTE: the ./database/migrations initdb mount is GONE (Hudson's schema
      # bug): raw psql ran the whole chain with ON_ERROR_STOP (timescale files
      # need migrate.py's per-statement autocommit), never recorded
      # schema_migrations, and then the backend's create_all built a SECOND
      # source of truth on top. The one-shot `migrate` service below is now the
      # only schema builder; create_all no-ops against it.
    networks:
      - omniusgrid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniusgrid"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API - FastAPI
  # One-shot schema builder: the SAME migration runner prod uses. Everything
  # DB-dependent waits for it to complete successfully.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://omniusgrid:${POSTGRES_PASSWORD:-omniusgrid_dev_password}@timescaledb:5432/omniusgrid
    volumes:
      - ./database/migrations:/migrations:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    command: python scripts/migrate.py --dir /migrations
    restart: "no"
    networks:
      - omniusgrid-network

  backend:
    build:
      # Repo-root context: backend/Dockerfile bakes in database/migrations
      # for the k8s migration Job (see backend/Dockerfile header).
      context: .
      dockerfile: backend/Dockerfile
    container_name: omniusgrid-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://omniusgrid:${POSTGRES_PASSWORD:-omniusgrid_dev_password}@timescaledb:5432/omniusgrid
      REDPANDA_URL: redpanda:29092
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_secret_key_change_in_production}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ALLOW_OPEN_REGISTRATION: "false"
      USER_INVITE_PUBLIC_BASE_URL: ${USER_INVITE_PUBLIC_BASE_URL:-http://localhost:3000}
      USER_INVITE_EXPIRE_HOURS: ${USER_INVITE_EXPIRE_HOURS:-72}
      SIGNED_URL_SECRET_KEY: ${SIGNED_URL_SECRET_KEY:-dev_signed_link_secret_change_in_production}
      SIGNED_URL_ALGORITHM: HS256
      SIGNED_URL_ISSUER: omniusgrid-signed-links
      SIGNED_URL_AUDIENCE: omniusgrid-report-download
      SIGNED_URL_ACCEPT_LEGACY_EXPORT_TOKENS: ${SIGNED_URL_ACCEPT_LEGACY_EXPORT_TOKENS:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Dedicated workers (export-worker, compliance-reports-worker,
      # ota-rollout-worker) own scheduler dispatch in compose, so the API must
      # NOT also run them (avoids two pollers racing the same queues).
      SCHEDULERS_IN_API: ${SCHEDULERS_IN_API:-false}
      REDIS_URL: redis://redis:6379/0
      # Tracing. The otel-collector and jaeger services below sit behind the
      # `tracing` profile, but the backend never set OTEL_ENABLED — so `make
      # tracing` brought up a collector and a Jaeger UI that received nothing,
      # with no indication of why. Off by default because the profile is opt-in;
      # the make target sets it to true.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: omniusgrid-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      EXPORT_STORAGE_PATH: /var/lib/omniusgrid/exports
      OTA_STORAGE_PATH: /var/lib/omniusgrid/ota
      OTA_SIGNING_PRIVATE_KEY_PATH: ${OTA_SIGNING_PRIVATE_KEY_PATH:-}
      OTA_SIGNING_PUBLIC_KEY: ${OTA_SIGNING_PUBLIC_KEY:-}
      OTA_AGENT_ARTIFACT_MAX_BYTES: ${OTA_AGENT_ARTIFACT_MAX_BYTES:-67108864}
      OTA_AGENT_ARTIFACT_MAX_UNCOMPRESSED_BYTES: ${OTA_AGENT_ARTIFACT_MAX_UNCOMPRESSED_BYTES:-268435456}
      EXPORT_PUBLIC_BASE_URL: http://localhost:8002
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-reports@omniusgrid.local}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_START_TLS: ${SMTP_START_TLS:-true}
      COMPLIANCE_REPORT_EMAIL_ENABLED: ${COMPLIANCE_REPORT_EMAIL_ENABLED:-false}
      COMPLIANCE_REPORT_SCHEDULER_ENABLED: ${COMPLIANCE_REPORT_SCHEDULER_ENABLED:-true}
      COMPLIANCE_REPORT_SCHEDULER_INTERVAL_SECONDS: ${COMPLIANCE_REPORT_SCHEDULER_INTERVAL_SECONDS:-30}
      OTA_ROLLOUT_DISPATCH_ENABLED: ${OTA_ROLLOUT_DISPATCH_ENABLED:-true}
      OTA_ROLLOUT_DISPATCH_INTERVAL_SECONDS: ${OTA_ROLLOUT_DISPATCH_INTERVAL_SECONDS:-30}
      # --- RAG pipeline wiring (service names resolve on omniusgrid-network) ---
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://seaweedfs:8333
      RAG_INFERENCE_URL: http://rag-inference:8000
      # Ingestion embeds RAG_EMBED_BATCH chunks per rag-inference request. On a
      # CPU-only inference box that is ~2.7s per dense chunk, so the default 32
      # lets a single request run ~60s+ and 500 with a ReadTimeout. Keep each
      # request small so it stays well under the timeout regardless of doc size
      # (GPU deployments can raise this back up). Timeout ceiling raised too as a
      # backstop. See backend/tests/rag_eval — this was found by the eval suite.
      RAG_EMBED_BATCH: ${RAG_EMBED_BATCH:-8}
      RAG_INFERENCE_TIMEOUT: ${RAG_INFERENCE_TIMEOUT:-180}
      # LLM runs NATIVELY on the host (Ollama w/ Metal on Mac, ROCm on Linux) and
      # is reached via host.docker.internal - Docker can't GPU-accelerate a
      # container on Mac, so the LLM stays outside the container by design.
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: ${LLM_MODEL:-gemma2:2b}
      # Overridable so an eval run can pin temperature to 0 for reproducible
      # synthesis grading (the eval judges the LLM's output, so run-to-run
      # variance is a flake source; 0 minimizes it).
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      VISION_MODEL_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - export-data:/var/lib/omniusgrid/exports
      - ota-data:/var/lib/omniusgrid/ota
    depends_on:
      migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      # service_started, NOT service_healthy (Hudson's startup bug): `rpk
      # cluster health` can lag minutes on cold boots, and with
      # SCHEDULERS_IN_API=false the API touches no Kafka at startup (workers own
      # dispatch/ingest) — so a slow Redpanda must not block the whole API (and
      # with it the RAG endpoints). The ingestion/OTA workers, which DO talk to
      # Kafka at boot, keep their service_healthy gates.
      redpanda:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - omniusgrid-network
    # host-gateway makes host.docker.internal resolve on Linux/WSL2 too (it is
    # automatic on Docker Desktop for Mac, harmless to declare).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Ingestion Workers - Process data from Redpanda to TimescaleDB
  ingestion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: omniusgrid-ingestion
    # Was the ONLY worker without a restart policy — the one carrying continuous
    # telemetry was also the one that stayed down after a crash.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://omniusgrid:${POSTGRES_PASSWORD:-omniusgrid_dev_password}@timescaledb:5432/omniusgrid
      REDPANDA_URL: redpanda:29092
      WORKER_MODE: ingestion
      WORKER_HEALTH_PORT: "9109"
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - omniusgrid-network
    # The workers exposed no health signal at all until FS-213, so compose had no
    # way to tell a wedged consumer from a working one. /healthz is heartbeat-based:
    # it fails when the loop stops, not merely when the process dies.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9109/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: python -m app.workers.ingestion

  # Durable scheduled export generation and company SMTP delivery
  export-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: omniusgrid-export-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://omniusgrid:${POSTGRES_PASSWORD:-omniusgrid_dev_password}@timescaledb:5432/omniusgrid
      REDPANDA_URL: redpanda:29092
      REDPANDA_EXPORT_TOPIC: opsgrid.exports
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_secret_key_change_in_production}
      SIGNED_URL_SECRET_KEY: ${SIGNED_URL_SECRET_KEY:-dev_signed_link_secret_change_in_production}
      SIGNED_URL_ALGORITHM: HS256
      SIGNED_URL_ISSUER: omniusgrid-signed-links
      SIGNED_URL_AUDIENCE: omniusgrid-report-download
      SIGNED_URL_ACCEPT_LEGACY_EXPORT_TOKENS: ${SIGNED_URL_ACCEPT_LEGACY_EXPORT_TOKENS:-true}
      EXPORT_STORAGE_PATH: /var/lib/omniusgrid/exports
      EXPORT_PUBLIC_BASE_URL: http://localhost:8002
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-reports@omniusgrid.local}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_START_TLS: ${SMTP_START_TLS:-true}
      WORKER_HEALTH_PORT: "9109"
    volumes:
      - ./backend:/app
      - export-data:/var/lib/omniusgrid/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - omniusgrid-network
    # The workers exposed no health signal at all until FS-213, so compose had no
    # way to tell a wedged consumer from a working one. /healthz is heartbeat-based:
    # it fails when the loop stops, not merely when the process dies.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9109/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: python -m app.workers.export_delivery

  # Async compliance report generation and email delivery
  compliance-reports-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: omniusgrid-compliance-reports-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://omniusgrid:${POSTGRES_PASSWORD:-omniusgrid_dev_password}@timescaledb:5432/omniusgrid
      REDPANDA_URL: redpanda:29092
      REDPANDA_COMPLIANCE_REPORTS_TOPIC: opsgrid.compliance-reports
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_secret_key_change_in_production}
      SIGNED_URL_SECRET_KEY: ${SIGNED_URL_SECRET_KEY:-dev_signed_link_secret_change_in_production}
      SIGNED_URL_ALGORITHM: HS256
      SIGNED_URL_ISSUER: omniusgrid-signed-links
      SIGNED_URL_AUDIENCE: omniusgrid-report-download
      SIGNED_URL_ACCEPT_LEGACY_EXPORT_TOKENS: ${SIGNED_URL_ACCEPT_LEGACY_EXPORT_TOKENS:-true}
      EXPORT_STORAGE_PATH: /var/lib/omniusgrid/exports
      EXPORT_PUBLIC_BASE_URL: http://localhost:8002
      COMPLIANCE_REPORT_EMAIL_ENABLED: ${COMPLIANCE_REPORT_EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-reports@omniusgrid.local}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_START_TLS: ${SMTP_START_TLS:-true}
      WORKER_HEALTH_PORT: "9109"
    volumes:
      - ./backend:/app
      - export-data:/var/lib/omniusgrid/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - omniusgrid-network
    # The workers exposed no health signal at all until FS-213, so compose had no
    # way to tell a wedged consumer from a working one. /healthz is heartbeat-based:
    # it fails when the loop stops, not merely when the process dies.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9109/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: python -m app.workers.compliance_reports

  # OTA staged rollout orchestration and health-gated rollback
  ota-rollout-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: omniusgrid-ota-rollout-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://omniusgrid:${POSTGRES_PASSWORD:-omniusgrid_dev_password}@timescaledb:5432/omniusgrid
      REDPANDA_URL: redpanda:29092
      REDPANDA_COMMAND_TOPIC: ${REDPANDA_COMMAND_TOPIC:-opsgrid.commands}
      REDPANDA_COMMAND_ACK_TOPIC: ${REDPANDA_COMMAND_ACK_TOPIC:-opsgrid.commands.acks}
      REDPANDA_COMMAND_DLQ_TOPIC: ${REDPANDA_COMMAND_DLQ_TOPIC:-opsgrid.commands.dlq}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_secret_key_change_in_production}
      SIGNED_URL_SECRET_KEY: ${SIGNED_URL_SECRET_KEY:-dev_signed_link_secret_change_in_production}
      SIGNED_URL_ALGORITHM: HS256
      SIGNED_URL_ISSUER: omniusgrid-signed-links
      SIGNED_URL_AUDIENCE: omniusgrid-report-download
      EXPORT_PUBLIC_BASE_URL: ${EXPORT_PUBLIC_BASE_URL:-http://backend:8000}
      SCHEDULERS_IN_API: "false"
      OTA_ROLLOUT_DISPATCH_ENABLED: ${OTA_ROLLOUT_DISPATCH_ENABLED:-true}
      OTA_ROLLOUT_DISPATCH_INTERVAL_SECONDS: ${OTA_ROLLOUT_DISPATCH_INTERVAL_SECONDS:-30}
      OTA_ROLLOUT_DEFAULT_COMMAND_TIMEOUT_SECONDS: ${OTA_ROLLOUT_DEFAULT_COMMAND_TIMEOUT_SECONDS:-120}
      OTA_AGENT_UPDATE_COMMAND_TIMEOUT_SECONDS: ${OTA_AGENT_UPDATE_COMMAND_TIMEOUT_SECONDS:-600}
      OTA_ROLLOUT_DEFAULT_HEALTH_TIMEOUT_SECONDS: ${OTA_ROLLOUT_DEFAULT_HEALTH_TIMEOUT_SECONDS:-300}
      OTA_ROLLOUT_DEFAULT_MIN_SUCCESS_RATIO: ${OTA_ROLLOUT_DEFAULT_MIN_SUCCESS_RATIO:-1.0}
      WORKER_HEALTH_PORT: "9109"
    volumes:
      - ./backend:/app
      - export-data:/var/lib/omniusgrid/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - omniusgrid-network
    # The workers exposed no health signal at all until FS-213, so compose had no
    # way to tell a wedged consumer from a working one. /healthz is heartbeat-based:
    # it fails when the loop stops, not merely when the process dies.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9109/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: python -m app.workers.ota_rollouts

  # Drains the rag_documents queue: claims 'queued' rows and indexes them.
  # Profiled with the rest of the RAG stack because it depends on seaweedfs,
  # qdrant and rag-inference. Deliberately has NO redpanda dependency - the
  # rag_documents row is the queue (FOR UPDATE SKIP LOCKED), so there is no
  # outbox dispatcher to run and this is safe to scale past one replica.
  rag-indexing-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: omniusgrid-rag-indexing-worker
    restart: unless-stopped
    profiles: ["rag"]
    environment:
      DATABASE_URL: postgresql://omniusgrid:${POSTGRES_PASSWORD:-omniusgrid_dev_password}@timescaledb:5432/omniusgrid
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_secret_key_change_in_production}
      SCHEDULERS_IN_API: "false"
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://seaweedfs:8333
      RAG_INFERENCE_URL: http://rag-inference:8000
      # Set to a second rag-inference replica's URL to stop bulk indexing from
      # competing with live query embeddings for CPU. Empty = share one service
      # (fine on a single box; the weights are ~5GB per replica).
      RAG_INFERENCE_INGEST_URL: ${RAG_INFERENCE_INGEST_URL:-}
      RAG_EMBED_BATCH: ${RAG_EMBED_BATCH:-8}
      RAG_INFERENCE_TIMEOUT: ${RAG_INFERENCE_TIMEOUT:-180}
      RAG_INDEX_WORKER_ENABLED: ${RAG_INDEX_WORKER_ENABLED:-true}
      RAG_INDEX_POLL_INTERVAL_SECONDS: ${RAG_INDEX_POLL_INTERVAL_SECONDS:-5}
      RAG_INDEX_MAX_ATTEMPTS: ${RAG_INDEX_MAX_ATTEMPTS:-3}
      RAG_INDEX_STALE_INDEXING_SECONDS: ${RAG_INDEX_STALE_INDEXING_SECONDS:-900}
      VISION_MODEL_ENABLED: "false"
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      qdrant:
        condition: service_started
      # rag-inference's healthcheck has a 600s start_period because first
      # boot downloads several GB of model weights. Without waiting on
      # service_healthy here, documents queued at startup would exhaust
      # RAG_INDEX_MAX_ATTEMPTS (the worker polls every 5s) and be marked
      # permanently failed long before inference is actually ready.
      rag-inference:
        condition: service_healthy
    networks:
      - omniusgrid-network
    command: python -m app.workers.rag_indexing

  # Frontend - React Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omniusgrid-frontend
    restart: unless-stopped
    ports:
      - "9999:9999"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_WS_URL: ws://localhost:8000
    depends_on:
      backend:
        condition: service_started
    networks:
      - omniusgrid-network

  # Local NTP Server - for clock synchronization
  ntp:
    image: alpine:latest
    container_name: omniusgrid-ntp
    cap_add:
      - SYS_TIME
    command: |
      sh -c "apk add --no-cache chrony && chronyd -d -F 1"
    ports:
      - "123:123/udp"
    environment:
      - NTP_SERVERS=time.nist.gov,time.cloudflare.com
    networks:
      - omniusgrid-network

  # postgres_exporter - database metrics (FS-779)
  #
  # `SlowDatabaseQueries` referenced `postgresql_stat_activity_max_tx_duration`, which
  # no exporter has ever produced, in a stack where no postgres exporter was deployed
  # either. Two independent reasons the rule could not fire, and it had a passing
  # promtool test throughout — promtool hand-writes its input series.
  #
  # Queries are declared in infra/prometheus/postgres_queries.yaml so the metric names
  # are a fact about this repository rather than about an upstream default collector
  # set that changes between major versions.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: omniusgrid-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-omniusgrid}:${POSTGRES_PASSWORD:-omniusgrid}@timescaledb:5432/${POSTGRES_DB:-omniusgrid}?sslmode=disable
      - PG_EXPORTER_EXTEND_QUERY_PATH=/etc/postgres_exporter/queries.yaml
    volumes:
      - ./infra/prometheus/postgres_queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    ports:
      - "9187:9187"
    depends_on:
      - timescaledb
    networks:
      - omniusgrid-network

  # node-exporter - host metrics (FS-776/777)
  #
  # `DiskSpaceCritical` (CRITICAL) and `HighMemoryUsage` (HIGH) both read `node_*` and
  # there was no node-exporter in ANY environment, so the two alerts guarding the
  # resource exhaustion that ends this system were inert everywhere. Deployed rather
  # than deleted: FS-817 shows audit_logs growing without a retention policy, and disk
  # exhaustion is the documented way that becomes an outage.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: omniusgrid-node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - omniusgrid-network

  # Blackbox exporter - synthetic probes (FS-769)
  #
  # Runs in its own container ON PURPOSE. Every other availability signal in this
  # stack is exported by the process being measured, so a dead backend produces no
  # series at all rather than a series reading zero — and a ratio over a missing
  # series simply stops, which is why both SLO burn-rate alerts were silent through
  # a total outage (infra/prometheus/tests/slo_outage_test.yml).
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: omniusgrid-blackbox
    volumes:
      - ./infra/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    ports:
      - "9115:9115"
    networks:
      - omniusgrid-network

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: omniusgrid-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - ./infra/prometheus/slo_rules.yml:/etc/prometheus/slo_rules.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # FS-859. No retention flag meant Prometheus's own default of 15d, against the
      # 28-day SLO window in slo_rules.yml — so the error budget here was computed from
      # roughly half the period it claims to cover, and silently, because `avg_over_time`
      # averages the samples that exist rather than failing on the ones that do not.
      - '--storage.tsdb.retention.time=35d'
      # FS-516. `--alertmanager.url` was REMOVED in Prometheus 2.0. An unknown flag is
      # fatal at startup, so the compose Prometheus exited immediately — which means
      # nobody running the stack locally has ever had metrics, alerts or the SLO rules,
      # and the four gates that assert those rules are well-formed were checking a file
      # no running Prometheus had ever loaded. It was also redundant:
      # infra/prometheus/prometheus.yml:8-12 configures the alertmanager the current way.
    networks:
      - omniusgrid-network

  # Alertmanager - Alert routing
  alertmanager:
    image: prom/alertmanager:latest
    container_name: omniusgrid-alertmanager
    volumes:
      - ./infra/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      # FS-787. Secrets are file refs; Alertmanager does not expand ${ENV} and REFUSES
      # TO START on the invalid URL that a literal `${SLACK_WEBHOOK_URL}` produces — so
      # this container has never come up. Local defaults point at localhost, which makes
      # delivery fail visibly instead of silently and keeps a dev stack unable to page.
      - ./infra/prometheus/alertmanager-secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - omniusgrid-network

  # Grafana - Visualization + Loki logs
  grafana:
    image: grafana/grafana:latest
    container_name: omniusgrid-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-omniusgrid_admin}
      - GF_INSTALL_PLUGINS=grafana-lokiexplore-app
      # FS-978. The TimescaleDB datasource reads `$POSTGRES_PASSWORD` at provisioning load
      # instead of carrying a committed password. Without this line the substitution
      # resolves to an empty string and the datasource fails to connect -- which is exactly
      # the state it was already in for a different reason, so it must be passed here or
      # the fix is cosmetic. Same default as the timescaledb service itself.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-omniusgrid_dev_password}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    networks:
      - omniusgrid-network

  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: omniusgrid-loki
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - omniusgrid-network

  # Promtail - Log collector (ships to Loki)
  promtail:
    image: grafana/promtail:latest
    container_name: omniusgrid-promtail
    volumes:
      - ./infra/loki/promtail.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - omniusgrid-network

  # Redis - Caching and session store
  redis:
    image: redis:7-alpine
    container_name: omniusgrid-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - omniusgrid-network

  # ======================================================================
  # RAG pipeline services (profile: "rag" - opt-in, not started by default)
  #   Lean RAG stack:  docker compose up qdrant seaweedfs rag-inference backend
  #   Full stack+RAG:  docker compose --profile rag up
  # ======================================================================

  # Vector store - Qdrant (hybrid dense + sparse). Prod uses Qdrant Hybrid
  # Cloud; locally we self-host the identical engine (same code, only QDRANT_URL
  # differs). No GPU needed.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: omniusgrid-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST/HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - omniusgrid-network
    profiles: ["rag"]

  # Document/blob store - SeaweedFS S3 gateway (S3-compatible). All-in-one
  # server (master+volume+filer+s3) for local dev. Identity comes from the same
  # s3config.json used in prod. No GPU needed.
  seaweedfs:
    image: chrislusf/seaweedfs:3.68
    container_name: omniusgrid-seaweedfs
    restart: unless-stopped
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # master UI (optional)
      - "8888:8888"   # filer (optional)
    command: "server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3config.json -s3.port=8333 -ip.bind=0.0.0.0"
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/s3config.json:/etc/seaweedfs/s3config.json:ro
    networks:
      - omniusgrid-network
    profiles: ["rag"]

  # Embeddings + reranker - BGE-M3 + BGE-Reranker-v2-m3 (FlagEmbedding).
  # CPU-first: fp16 auto-disabled without CUDA. First boot downloads ~5GB of
  # weights into the rag-models volume (cached across restarts). Host port 8001
  # avoids clashing with the backend on 8000; internal port stays 8000.
  rag-inference:
    build:
      context: ./rag-inference
      dockerfile: Dockerfile
    container_name: omniusgrid-rag-inference
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      EMBEDDING_MODEL: BAAI/bge-m3
      RERANKER_MODEL: BAAI/bge-reranker-v2-m3
      USE_FP16: "false"   # CPU in Docker on Mac; set true only on CUDA
    volumes:
      - rag-models:/models
    networks:
      - omniusgrid-network
    profiles: ["rag"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 600s   # first boot downloads model weights
      retries: 5

  # Edge Agent Simulator (for testing)
  edge-agent-sim:
    build:
      context: ./edge-agent
      dockerfile: Dockerfile
    container_name: omniusgrid-edge-sim
    environment:
      REDPANDA_URL: redpanda:29092
      ORGANIZATION_ID: dev-org
      AGENT_ID: simulator-001
      AGENT_STATUS_TOPIC: ${AGENT_STATUS_TOPIC:-opsgrid.agent-status}
      REDPANDA_COMMAND_TOPIC: ${REDPANDA_COMMAND_TOPIC:-opsgrid.commands}
      REDPANDA_COMMAND_ACK_TOPIC: ${REDPANDA_COMMAND_ACK_TOPIC:-opsgrid.commands.acks}
      REDPANDA_COMMAND_DLQ_TOPIC: ${REDPANDA_COMMAND_DLQ_TOPIC:-opsgrid.commands.dlq}
      OTA_SIGNING_PUBLIC_KEY: ${OTA_SIGNING_PUBLIC_KEY:-}
      OPSGRID_RUNTIME_ROOT: /var/lib/opsgrid-agent/runtime
      OPSGRID_BOOT_READY_TIMEOUT_SECONDS: ${OPSGRID_BOOT_READY_TIMEOUT_SECONDS:-90}
      BUFFER_RETENTION_HOURS: 24
      METRICS_PORT: 9108
      # FS-518. Without COLLECTORS the agent logs `no_collectors_configured` and produces
      # no telemetry at all — so the service named "simulator" simulated nothing, and the
      # scrape job pointed at it (FS-517) reported an agent with no readings as healthy.
      #
      # `simulate` is the explicit source both synthetic-capable collectors understand, so
      # this stays honest under EDGE_REQUIRE_EXPLICIT_SOURCES (FS-508): the values are
      # stamped synthetic on the way out rather than passing as hardware.
      COLLECTORS: >-
        [{"asset_id": "sim-press-001", "collector_type": "audio", "enabled": true,
          "config": {"source": "simulate", "asset_id": "sim-press-001",
                     "sample_rate": 16000, "frame_seconds": 1.0, "poll_interval": 10}}]
    ports:
      - "9108:9108"   # Prometheus /metrics
    volumes:
      - edge-agent-data:/var/lib/opsgrid-agent
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      omniusgrid-network:
        # Alias so the prometheus 'edge-agent' scrape target resolves to this service.
        aliases:
          - edge-agent
    profiles:
      - simulator

  # --- Distributed tracing (task 14) --------------------------------------
  # OTel Collector receives OTLP spans from the backend and forwards to Jaeger.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: omniusgrid-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger
    networks:
      - omniusgrid-network
    profiles:
      - tracing

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: omniusgrid-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
    networks:
      - omniusgrid-network
    profiles:
      - tracing

volumes:
  redpanda-data:
  timescaledb-data:
  redis-data:
  export-data:
  ota-data:
  edge-agent-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  qdrant-data:
  seaweedfs-data:
  rag-models:      # HF weight cache - avoids re-downloading BGE (~5GB) on recreate

networks:
  omniusgrid-network:
    driver: bridge
