# The authority list — every practice a control in this catalogue may claim to satisfy.
#
# WHAT THIS FILE IS FOR. It is the DENOMINATOR. `test_every_control_is_registered.py`
# measures the catalogue against this list, so "we cover 110 of 110" is a checkable
# statement rather than a claim. Nothing may `satisfies:` an id that is not here, and every
# id here must be claimed by at least one control — including by a control whose status is
# `absent`, which is how the POA&M starts out honest instead of empty.
#
# THE TITLES ARE WORKING SUMMARIES, NOT QUOTATIONS. The authoritative text is NIST SP
# 800-171 Rev 2 (and Rev 3 where an assessment specifies it); this file paraphrases each
# practice so a reader can navigate without the publication open. Do not quote these back to
# an assessor as the requirement — cite the publication. Recorded here because a paraphrase
# presented as a quotation is exactly the kind of unevidenced claim that got two compliance
# documents deleted in FS-745.
#
# Family counts are load-bearing: the guard asserts them, so a practice cannot be quietly
# dropped or invented.

