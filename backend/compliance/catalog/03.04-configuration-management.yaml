# 3.4 Configuration Management — 9 practices.
#
# Strong where it is automated (23 blocking CI jobs, manifest gates that resolve envFrom the
# way a kubelet does), weak where it needs a decision nobody has made (baseline definition,
# software execution policy).

controls:
  - id: OG-CM-001
    title: Configuration is defined in version control and enforced at deploy time
    satisfies:
      - 800-171:03.04.01
      - 800-171:03.04.02
      - 800-53r5:CM-2
      - 800-53r5:CM-6
      - ISO27001:A.8.9
      - SOC2:CC8.1
    status:
      commercial-cloud: partial
      gov-cloud: partial
      on-prem: partial
      air-gapped: partial
    implemented_by:
      - infrastructure/k8s
      - app/core/config.py
      - app/core/startup_checks.py
    proved_by:
      - tests/test_config_validation.py
    evidence:
      - ci/k8s-manifests.log
      - kubeconform/all.json
    owner: platform-infra
    remediation:
      due: "2027-02-28"
      note: >-
        Every deployed setting is a manifest in git, and `check_backend_security_config.py`
        asserts the security-relevant ones actually reach the container — resolving `envFrom`
        the way the kubelet does, which exists because `validate_settings()` was once never
        armed: `ENVIRONMENT` appeared in zero manifests, so the production branch never ran.
        PARTIAL because there is no declared BASELINE — no golden configuration to compare a
        running system against, and no drift detection. Inventory is likewise implicit in the
        manifests rather than maintained as an artifact.

  - id: OG-CM-002
    title: Changes are tracked, reviewed and approved before they take effect
    satisfies:
      - 800-171:03.04.03
      - 800-171:03.04.04
      - 800-171:03.04.05
      - 800-53r5:CM-3
      - 800-53r5:CM-5
      - ISO27001:A.8.32
      - SOC2:CC8.1
    status:
      commercial-cloud: partial
      gov-cloud: partial
      on-prem: partial
      air-gapped: partial
    implemented_by:
      - .github/workflows/quality-gates.yml
      - .github/workflows/ci-cd.yml
      - docs/runbooks/branch-protection.md
    proved_by:
      - tests/test_ci_gate_count_is_accurate.py
    evidence:
      - ci/quality-gates.log
    owner: platform-infra
    remediation:
      due: "2026-12-31"
      note: >-
        23 blocking CI jobs gate every change and the count is itself asserted so it cannot
        go stale.
        RAISED 2026-08-18 (FS-763): **branch protection is now ENABLED on `main` on both
        remotes** — `allow_force_pushes: false`, `allow_deletions: false`,
        `enforce_admins: true`, one required approving review. That is what 3.4.5 (enforce
        access restrictions associated with change) actually asks for, and it is the line
        that would have stopped the 2026-08-15 force-push of all 17 branches.
        STILL PARTIAL, for three specific reasons rather than as a hedge. **Required status
        checks are not configured**: `main` reports zero check runs, so requiring a context
        that never arrives would make the branch permanently unmergeable — the 23 jobs gate
        pull requests, they do not yet gate `main` as a protection rule. **The integration
        branch is unprotected**, deliberately, because four lanes push to it directly and
        enabling it without notice stops their work. And **four accounts hold repository
        admin**, any of which can disable the protection just set, so least-privilege review
        is outstanding.
        What changed about the incident: the actor IS now identified — repository events show
        14 branches force-pushed in 36 seconds by `SoundSafe-Dev`, mirrored to both remotes,
        which is machine-driven and consistent with the local automation lead rather than an
        external attacker. The credential still needs rotating, which is a web-session action
        no script can perform.

  - id: OG-CM-003
    title: Least functionality — nonessential functions are restricted or disabled
    satisfies:
      - 800-171:03.04.06
      - 800-171:03.04.07
      - 800-53r5:CM-7
      - ISO27001:A.8.19
    status:
      commercial-cloud: partial
      gov-cloud: partial
      on-prem: partial
      air-gapped: partial
    implemented_by:
      - app/core/config.py
      - infrastructure/k8s/base/namespace.yaml
    proved_by:
      - tests/test_config_validation.py
    evidence:
      - ci/k8s-manifests.log
    owner: platform-infra
    remediation:
      due: "2027-01-31"
      note: >-
        Pod Security Admission runs `restricted`, containers drop ALL capabilities with a
        read-only root filesystem and no privilege escalation, and `validate_settings()`
        refuses a production start with the dev-token bypass, open registration, wildcard
        CORS or simulated telematics enabled. PARTIAL because the DEFAULTS still invert the
        principle — `ALLOW_DEV_TOKEN` defaults True and is caught only by the production
        gate — and because the backend runtime image still carries `gcc` and `libpq-dev`
        from the build.

  - id: OG-CM-004
    title: Software execution policy and control of user-installed software
    satisfies:
      - 800-171:03.04.08
      - 800-171:03.04.09
      - 800-53r5:CM-7(4)
      - 800-53r5:CM-11
    status:
      commercial-cloud: partial
      gov-cloud: partial
      on-prem: partial
      air-gapped: partial
    implemented_by:
      - backend/requirements.txt
      - .github/workflows/quality-gates.yml
    proved_by:
      - tests/test_build_configs_are_not_executable_payloads.py
    evidence:
      - trivy/fs.sarif
      - sbom/backend.cdx.json
    owner: platform-infra
    remediation:
      due: "2027-02-28"
      note: >-
        Dependencies are pinned with justifications, `pip-audit`, `npm audit` and a Trivy
        filesystem scan block the build, and a repo-hygiene gate refuses tracked key material
        or dependency directories. Two real gaps: **no image signing** (nothing verifies what
        runs is what CI built — cosign is absent) and **no base-image digest pinning** (every
        image uses a mutable tag). After a supply-chain compromise in this repository's own
        history, both are pointed questions rather than theoretical ones. Admission control
        that could enforce either is also absent — no Kyverno, no Gatekeeper.
