[pytest]
# Self-contained rootdir: keeps these LIVE integration tests isolated from the
# repo's unit-test conftest (which spins up a testcontainers TimescaleDB). Run:
#   python -m pytest backend/tests/rag_eval
addopts = -v --tb=short -p no:cacheprovider
python_files = test_*.py
python_functions = test_*
markers =
    mechanics: per-format ingestion mechanics
    retrieval: retrieval-only precision
    synthesis: retrieval + LLM synthesis correctness
    negative: out-of-corpus / scope — must not fabricate
    hybrid: dense+sparse retrieval — each half contributes
    isolation: tenant isolation (same-org co-tenancy + cross-org)
    lifecycle: idempotent re-ingest + delete
    robustness: malformed / boundary inputs + guardrails
    metrics: recall@k / MRR retrieval metrics
    corpus: multi-document retrieval discrimination (cites the right document)
