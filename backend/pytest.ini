[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# tests/rag_eval is a LIVE-stack integration suite with its own pytest.ini and a
# self-contained rootdir (it hits a running RAG stack over HTTP). It must not be
# pulled into the default unit-test run: without a live stack its fixtures error
# rather than skip (126 errors), which would break this suite and the ci-cd
# backend job. Run it explicitly against a live stack:
#   python -m pytest backend/tests/rag_eval
# Setting norecursedirs REPLACES pytest's defaults, so the default ignores
# (dotdirs incl. .hypothesis, node_modules, venv, build, dist) must be repeated
# or pytest starts trying to collect them.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} rag_eval
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
