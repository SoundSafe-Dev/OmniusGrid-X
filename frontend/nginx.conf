# Production nginx config for the OmniusGrid web app (FS-39).
# Serves the built SPA with client-side-routing fallback and proxies the API +
# WebSocket to the backend service (BACKEND_ORIGIN is templated at start by
# nginx's envsubst entrypoint, default http://backend:8000).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: long cache, immutable (Vite emits content-hashed names).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API + auth + health proxied to the backend.
    location /api/ {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass ${BACKEND_ORIGIN};
    }

    # WebSocket upgrade for realtime updates.
    location /ws {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: every other path renders index.html (client-side router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
