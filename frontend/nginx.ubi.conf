# Top-level nginx config for the UBI9-based production image (FS-761).
#
# WHY OUR OWN RATHER THAN THE VENDOR'S. UBI's `/etc/nginx/nginx.conf` declares its own
# `default_server` on 8080 and includes site config from two places with different
# semantics: `nginx.d/*.conf` at http level, and `nginx.default.d/*.conf` INSIDE that
# default server block. Dropping our `server { ... }` into the second one fails to start —
# "server directive is not allowed here" — and dropping it into the first one starts fine
# and then serves the vendor's default page, because a `default_server` wins over a server
# named `_` for every request that does not match a name.
#
# The second failure is the dangerous one: the image builds, the container runs, the health
# check passes, and the application is not being served. So the vendor file is replaced
# rather than patched — twenty lines we own beats a sed against a file Red Hat may relayout.
#
# `frontend/nginx.conf` — the actual site config, shared with the compose path — is included
# unchanged.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Writable by uid 1001 without root; the vendor defaults point at /var/lib/nginx.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Our site config only. No default_server, so nothing can shadow it.
    include /opt/app-root/etc/nginx.d/*.conf;
}
