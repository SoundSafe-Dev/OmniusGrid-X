---
# Grafana's admin password. Every other monitoring credential (alertmanager-secrets) had
# an ExternalSecret; this one was missed, so the monitoring stack was one secret short of
# starting even where the rest of the documented provisioning had been done.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: omniusgrid
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: omniusgrid-store
    kind: SecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef: { key: omniusgrid/grafana, property: admin-password }
