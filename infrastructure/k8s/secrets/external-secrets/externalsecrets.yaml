# FS-514. The three secrets below were consumed by workloads and provisioned by NEITHER
# path — no ExternalSecret and no entry in the sealed-secrets example. An operator
# following the secrets README provisioned everything documented, every step reported
# success, and the deploy still died on CreateContainerConfigError for a secret nobody
# had listed. The failure is loud; the cause was invisible, because the consuming half
# and the provisioning half live in different trees and nothing compared them.
#
# `tests/k8s/check_every_secret_has_a_source.py` now does.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: omniusgrid
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: omniusgrid-store
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    # The fleet enrollment token. An agent presents this once to exchange it for its
    # mTLS identity; without it no device can enroll.
    - secretKey: edge-bootstrap-token
      remoteRef: { key: omniusgrid/app, property: edge-bootstrap-token }
    # At-rest encryption key for stored ERP vendor credentials. Losing or rotating this
    # without re-encrypting makes every stored connector credential undecryptable.
    - secretKey: erp-encryption-key
      remoteRef: { key: omniusgrid/app, property: erp-encryption-key }
    # HMAC secret for inbound GeoTab webhooks. Absent, the receiver cannot verify a
    # caller and must reject every delivery.
    - secretKey: geotab-webhook-secret
      remoteRef: { key: omniusgrid/app, property: geotab-webhook-secret }
---
