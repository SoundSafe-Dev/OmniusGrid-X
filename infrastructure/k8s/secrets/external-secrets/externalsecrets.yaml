# ExternalSecrets — each one tells ESO to materialize an in-cluster Secret from
# the backing store defined by `omniusgrid-store` (see secretstore.example.yaml).
# The `target.name`/keys match exactly what the workloads already mount, so
# adopting ESO changes nothing in the Deployments/StatefulSets.
#
# `remoteRef.key` values assume a layout of omniusgrid/<name> in the store with
# the listed properties. Adjust the keys to your store's actual paths.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: omniusgrid
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: omniusgrid-store
    kind: SecretStore
  target:
    name: database-credentials
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef: { key: omniusgrid/database, property: url }
    - secretKey: username
      remoteRef: { key: omniusgrid/database, property: username }
    - secretKey: password
      remoteRef: { key: omniusgrid/database, property: password }
    - secretKey: database
      remoteRef: { key: omniusgrid/database, property: database }
---
