---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: s3-credentials
  namespace: omniusgrid
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: omniusgrid-store
    kind: SecretStore
  target:
    name: s3-credentials
    creationPolicy: Owner
    template:
      # s3config.json is derived from the access/secret keys so it stays in sync
      # with a single source of truth in the backing store.
      data:
        access-key: "{{ .accessKey }}"
        secret-key: "{{ .secretKey }}"
        s3config.json: |
          {
            "identities": [
              {
                "name": "omniusgrid",
                "credentials": [
                  { "accessKey": "{{ .accessKey }}", "secretKey": "{{ .secretKey }}" }
                ],
                "actions": ["Admin", "Read", "Write", "List", "Tagging"]
              }
            ]
          }
  data:
    - secretKey: accessKey
      remoteRef: { key: omniusgrid/s3, property: access-key }
    - secretKey: secretKey
      remoteRef: { key: omniusgrid/s3, property: secret-key }
---
