# SecretStore — tells the External Secrets Operator WHERE to read secrets from.
# Pick ONE backend and delete the others (or keep in separate files). The
# ExternalSecrets in externalsecrets.yaml reference `omniusgrid-store` by name,
# so whichever store you keep must use that name.
#
# NOTE: these are examples. The provider credentials (Vault token / AWS IRSA /
# GCP workload identity) themselves must be provisioned out-of-band — that is the
# one bootstrap secret ESO needs, after which nothing else lives in git.
---
# --- HashiCorp Vault (KV v2 at secret/omniusgrid/*) ------------------------
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: omniusgrid-store
  namespace: omniusgrid
spec:
  provider:
    vault:
      server: "https://vault.internal:8200"
      path: "secret"            # KV v2 mount
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "omniusgrid"
          serviceAccountRef:
            name: default
---
