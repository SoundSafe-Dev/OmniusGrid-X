apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# HA TimescaleDB via CloudNativePG. Deployed SEPARATELY from the app base and
# ONLY after the CloudNativePG operator (which provides the postgresql.cnpg.io
# CRDs) is installed in the cluster — see README.md. Adopting this supersedes
# base/timescaledb-statefulset.yaml and the archived legacy-patroni/.
namespace: omniusgrid

resources:
  - secrets.yaml
  - cluster.yaml
  - pooler.yaml

commonLabels:
  app.kubernetes.io/part-of: omniusgrid
  app.kubernetes.io/managed-by: kustomize
