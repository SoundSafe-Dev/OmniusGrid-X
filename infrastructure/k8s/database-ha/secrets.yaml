# DEV/CI-ONLY placeholder credentials for the HA database cluster. Do NOT ship
# these to staging or production — provision the real cnpg-app-credentials and
# cnpg-backup-credentials via Sealed Secrets or the External Secrets Operator:
# see infrastructure/k8s/secrets/.
#
# cnpg-app-credentials  : the application role CloudNativePG creates on bootstrap.
#                         Must match the username/password in the app's
#                         database-credentials Secret (the app still reads that).
# cnpg-backup-credentials: S3 keys the operator uses for WAL archiving + backups.
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-app-credentials
  namespace: omniusgrid
  labels:
    app.kubernetes.io/part-of: omniusgrid
type: kubernetes.io/basic-auth
stringData:
  username: "omniusgrid"
  password: "REPLACE_ME_app_role_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-backup-credentials
  namespace: omniusgrid
  labels:
    app.kubernetes.io/part-of: omniusgrid
type: Opaque
stringData:
  ACCESS_KEY_ID: "omniusgrid"
  ACCESS_SECRET_KEY: "omniusgrid_dev_secret"
