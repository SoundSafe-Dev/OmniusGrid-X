apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging CloudNativePG stack (FS-509).
#
# `database-ha/` hardcodes `namespace: omniusgrid`; the staging deploy applied it
# with `-n omniusgrid-staging`, which kubectl rejects and which failed the step
# under `set -euo pipefail`. Both environments now go through an overlay that
# declares its namespace, so the lint (FS-521) holds them to the same rule
# rather than only noticing the one that is wrong.

resources:
  - ../../../database-ha

namespace: omniusgrid-staging

# FS-811. Same as production: the WAL archive must not live in the cluster it protects.
# Staging carries it too rather than keeping the in-cluster default, because staging is where
# a site-loss recovery gets rehearsed (FS-925) — and a rehearsal against a different archive
# topology from production tests the wrong thing.
patches:
  - path: external-wal-archive.yaml
    target:
      kind: Cluster
      name: omniusgrid-db
      namespace: omniusgrid
