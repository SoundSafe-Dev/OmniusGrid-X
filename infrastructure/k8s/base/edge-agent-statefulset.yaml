apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edge-agent
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: edge-agent
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: omniusgrid
spec:
  # Single collector process per deployment; scale per site, not per replica
  # (multiple replicas would double-collect the same sources).
  replicas: 1
  # Now a StatefulSet (was a Deployment) so the store-and-forward SQLite buffer
  # gets a PVC that SURVIVES pod reschedule. As a Deployment the buffer was an
  # emptyDir, so a reschedule discarded up to BUFFER_RETENTION_HOURS (24h) of
  # offline telemetry — defeating the entire purpose of store-and-forward. The
  # default RollingUpdate strategy terminates the single pod before the
  # replacement starts, so the ReadWriteOnce PVC is never contended.
  serviceName: edge-agent
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-agent
        app.kubernetes.io/component: edge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9108"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge-agent
          image: omniusgrid/edge-agent:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: metrics
              containerPort: 9108
              protocol: TCP

          env:
            - name: REDPANDA_URL
              value: "redpanda:9092"
            - name: ORGANIZATION_ID
              value: "dev-org"
            - name: AGENT_ID
              value: "edge-agent-001"
            - name: BUFFER_PATH
              value: "/var/lib/opsgrid-agent/buffer.db"
            - name: BUFFER_RETENTION_HOURS
              value: "24"
            - name: METRICS_PORT
              value: "9108"
            # Mount a collector config and point COLLECTORS_FILE at it, or set
            # COLLECTORS to a JSON array via a ConfigMap.
            # - name: COLLECTORS_FILE
            #   value: "/etc/opsgrid/collectors.yml"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"

          volumeMounts:
            - name: buffer
              mountPath: /var/lib/opsgrid-agent
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /healthz
              port: 9108
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz
              port: 9108
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        # buffer is a persistent volumeClaimTemplate (below), not emptyDir.
        - name: tmp
          emptyDir: {}

      terminationGracePeriodSeconds: 30

  volumeClaimTemplates:
    - metadata:
        name: buffer
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Sized for the 24h store-and-forward backlog plus WAL/quarantine
            # headroom; the buffer enforces its own 1GB ring-buffer cap in-app.
            storage: 5Gi
