apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: timescaledb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: omniusgrid
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: timescaledb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timescaledb
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: timescaledb
          # FS-821. THE DATABASE ENGINE was floating on a mutable tag. `latest-pg15` is repointed by the
        # publisher whenever they cut a release, so two clusters built a week apart ran
        # different Postgres and TimescaleDB builds, and "roll back to what was running"
        # had no answer. Digest resolved 2026-08-20; the tag is kept for readability and
        # the digest is what Kubernetes enforces.
          image: timescale/timescaledb:latest-pg15@sha256:6343bdc87ca132c6b53acb26113a6bad1821d188fa39975a745f32ddd9757634
          imagePullPolicy: IfNotPresent
          
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          
          # THE CONNECTION CEILING, STATED (FS-839). Nothing set `max_connections`, so it
          # was PostgreSQL's default of 100 — a number chosen by the upstream project, not
          # against this deployment's declared scale. The backend HPA allows 20 replicas
          # and KEDA allows 12 + 8 + 6 workers; at SQLAlchemy's own default pool of 15 per
          # process that is 675 connections asked of 100.
          #
          # Production is shielded by the CNPG pooler (FS-801), which multiplexes. STAGING
          # APPLIES THE SAME KEDA CEILINGS WITH NO POOLER, so staging is where the
          # arithmetic actually lands — and past the limit Postgres refuses the next
          # connection from anybody, so the symptom is the backend and every worker failing
          # together, under the load that caused the scale-out.
          #
          # 200 matches the CNPG cluster (`database-ha/cluster.yaml`) so the two paths do
          # not disagree, and fits the 4Gi limit below at roughly 5-10MB per backend
          # process. `tests/k8s/check_connection_budget.py` holds the arithmetic against
          # the manifests, so raising a replica ceiling without raising this fails CI.
          args:
            - "-c"
            - "max_connections=200"

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: database
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # No docker-entrypoint-initdb.d mount: schema is applied by the
            # db-migrate Job (see migration-job.yaml), matching compose prod.

          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: timescaledb
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: timescaledb
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
