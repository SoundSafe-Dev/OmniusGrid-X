apiVersion: apps/v1
kind: Deployment
metadata:
  name: export-worker
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: export-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: omniusgrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: export-worker
  template:
    metadata:
      annotations:
        # Picked up by the monitoring stack's generic `kubernetes-pods` job, so no
        # per-worker scrape config is needed. Workers exposed NO metrics before
        # FS-213 — adding a scrape target would have scraped nothing.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9109"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: export-worker
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: export-worker
          image: omniusgrid/backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.workers.export_delivery"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # download links are built from this — dev default is localhost;
            # overlays patch the real public hostname
            - name: EXPORT_PUBLIC_BASE_URL
              value: "https://api.omniusgrid.local"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: url
            - name: REDPANDA_URL
              value: "redpanda:9092"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: SIGNED_URL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: signed-url-secret
                  key: secret
            # Local path is a per-pod scratch fast-path only. The durable, shared
            # copy goes to S3 (below) so the backend API — on another pod — can
            # serve the download. The emptyDir volume is therefore just scratch.
            - name: EXPORT_STORAGE_PATH
              value: "/var/lib/omniusgrid/exports"
            - name: EXPORT_USE_S3
              value: "true"
            - name: S3_ENDPOINT_URL
              value: "http://seaweedfs:8333"
            - name: S3_EXPORT_BUCKET
              value: "omniusgrid-exports"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
            - name: WORKER_HEALTH_PORT
              value: "9109"
            # Trace export (FS-226). The collector was deployed but the backend set
            # no OTEL env at all, so it exported nothing even once the network path
            # existed. Enabled here rather than left to an overlay so the default
            # deployment actually traces.
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "omniusgrid-export-delivery"
            - name: LOG_LEVEL
              value: "info"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          # Optional SMTP delivery credentials (SMTP_HOST, SMTP_PORT,
          # SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM_EMAIL, SMTP_USE_TLS,
          # SMTP_START_TLS). Absent secret = email delivery disabled.
          envFrom:
            - secretRef:
                name: smtp-credentials
                optional: true
          ports:
            - name: health
              containerPort: 9109
          # These Deployments carried NO probes because the workers exposed no
          # health signal at all (FS-214). A wedged consumer — process alive, loop
          # dead — ran forever while its queue backed up. /readyz reports startup;
          # /healthz reports the heartbeat (see app/workers/health_server.py).
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: export-data
              mountPath: /var/lib/omniusgrid/exports
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: export-data
          emptyDir: {}
      terminationGracePeriodSeconds: 30
