apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: omniusgrid
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: omniusgrid-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - backend
                topologyKey: kubernetes.io/hostname
      
      containers:
        - name: backend
          image: omniusgrid/backend:latest
          imagePullPolicy: Always
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          
          # Tunables an overlay is meant to control (ENVIRONMENT, DEBUG, LOG_LEVEL,
          # MTLS_ENABLED, GEOTAB_SIMULATED). The generator lives in base/kustomization.yaml
          # and each overlay merges over it.
          #
          # THIS REFERENCE IS THE POINT (FS-386). All three overlays already declared a
          # `backend-config` ConfigMap and NOTHING CONSUMED IT — no envFrom existed
          # anywhere — so `LOG_LEVEL=warn` in production, `MTLS_ENABLED=false` in staging
          # and `DEPLOYMENT_SITE=dr` were rendered into a ConfigMap object and then
          # ignored. Settings written, read by nobody: the manifests described a
          # deployment nobody was running.
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            # PINNED HERE, NOT IN THE CONFIGMAP, SO NO OVERLAY CAN TURN THEM ON (FS-385).
            #
            # `app/core/config.py` defaults ALLOW_DEV_TOKEN and ALLOW_OPEN_REGISTRATION to
            # **true** so a laptop demo works offline, and nothing in these manifests
            # overrode them — so every deployment here accepted the literal string
            # `dev-token` as an admin credential and took unauthenticated registrations.
            #
            # `validate_settings()` exists to catch exactly that and hard-fails at import,
            # but only when ENVIRONMENT == "production", and ENVIRONMENT appeared NOWHERE
            # in these manifests. It evaluated to "development", so all ten of its checks
            # were skipped. The guard was real; nothing had ever armed it. Verified with
            # `kustomize build overlays/production`: zero occurrences of ENVIRONMENT,
            # ALLOW_DEV_TOKEN, GEOTAB_SIMULATED or CORS_ALLOW_ORIGINS before this change.
            #
            # These two stay explicit `env` rather than joining the ConfigMap because
            # `env` beats `envFrom`: there is no legitimate reason for any overlay to
            # enable an admin-auth bypass, so the manifest should not offer the knob.
            - name: ALLOW_DEV_TOKEN
              value: "false"
            - name: ALLOW_OPEN_REGISTRATION
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: url
            - name: REDPANDA_URL
              value: "redpanda:9092"
            - name: SCHEDULERS_IN_API
              value: "false"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: SIGNED_URL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: signed-url-secret
                  key: secret
            # RAG (arrived with the 2026-08-28 merge). Points at the standalone
            # infrastructure/k8s/base/rag/ base, applied separately into its own
            # omniusgrid-rag namespace, so these FQDNs resolve only where that base is
            # also applied. No QDRANT_API_KEY/RAG_INFERENCE_API_KEY yet — single cluster
            # network, same no-auth assumption as the isolated rag base itself.
            #
            # HIS `S3_ENDPOINT_URL` IS DELIBERATELY NOT GRAFTED. It is not RAG-specific:
            # `document_store.py:93` reads the same `settings.S3_ENDPOINT_URL` the export
            # pipeline uses, so repointing it at `seaweedfs.omniusgrid-rag` would have
            # moved EXPORTS onto a host that does not resolve in staging or production,
            # where the rag base is not applied. The default below already reaches an
            # object store that exists in every environment, and RAG is content with it.
            #
            # `MTLS_ENABLED` is likewise not grafted — see the note further down; an
            # explicit `env` entry beats `envFrom` and would break the staging override.
            - name: QDRANT_URL
              value: "http://qdrant.omniusgrid-rag.svc.cluster.local:6333"
            - name: RAG_INFERENCE_URL
              value: "http://rag-inference.omniusgrid-rag.svc.cluster.local:8000"
            # CPU-only inference tuning, as docker-compose sets: rag-inference has no GPU
            # path on k8s either, so the default batch/timeout would ReadTimeout the way
            # the eval suite caught in compose.
            - name: RAG_EMBED_BATCH
              value: "8"
            - name: RAG_INFERENCE_TIMEOUT
              value: "180"
            # The three remaining things validate_settings() demands in production. They
            # are secrets rather than settings, so they follow the same pattern as
            # jwt-secret above; `infrastructure/k8s/secrets/` documents how they are
            # supplied (sealed-secrets or ESO). Without them the backend now refuses to
            # start and says which one is missing — previously it started happily with an
            # unauthenticated GeoTab webhook and an ERP encryption key regenerated on
            # every restart, which silently made previously-encrypted fields unreadable.
            - name: EDGE_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: edge-bootstrap-token
            - name: GEOTAB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: geotab-webhook-secret
            - name: ERP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: erp-encryption-key
            # Object storage for export/compliance artifacts. With multiple pods,
            # a worker generates the file on its pod and the backend serves the
            # download from another — so both must read/write the SAME S3 bucket.
            - name: EXPORT_USE_S3
              value: "true"
            - name: S3_ENDPOINT_URL
              value: "http://seaweedfs:8333"
            - name: S3_EXPORT_BUCKET
              value: "omniusgrid-exports"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
            # MTLS_ENABLED intentionally NOT here — it moved to the backend-config
            # ConfigMap so the staging overlay's `MTLS_ENABLED=false` can actually take
            # effect. An explicit `env` entry beats `envFrom`, which is why it could not
            # stay in both places.
            - name: CA_CERT_PATH
              value: "/etc/tls/ca/ca.crt"
            - name: SERVER_CERT_PATH
              value: "/etc/tls/server/server.crt"
            - name: SERVER_KEY_PATH
              value: "/etc/tls/server/server.key"
            # Trace export (FS-226). The collector was deployed but the backend set
            # no OTEL env at all, so it exported nothing even once the network path
            # existed. Enabled here rather than left to an overlay so the default
            # deployment actually traces.
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "omniusgrid-backend"
            # LOG_LEVEL likewise moved to backend-config, so production's `warn` and
            # staging's `debug` reach the process instead of being shadowed by this.
            - name: ALLOW_OPEN_REGISTRATION
              value: "false"
            - name: USER_INVITE_PUBLIC_BASE_URL
              value: "https://omniusgrid.local"
            - name: USER_INVITE_EXPIRE_HOURS
              value: "72"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: host
                  optional: true
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: username
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: password
                  optional: true
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_FROM_EMAIL
              value: "reports@omniusgrid.local"
            - name: SMTP_USE_TLS
              value: "false"
            - name: SMTP_START_TLS
              value: "true"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls-ca
              mountPath: /etc/tls/ca
              readOnly: true
            - name: tls-server
              mountPath: /etc/tls/server
              readOnly: true
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          
          # FS-850. THE RACE NOBODY SEES BUT EVERY DEPLOY RUNS. When a pod is deleted,
          # kubelet sends SIGTERM and the endpoints controller removes the pod from the
          # Service **in parallel**, with no ordering between them. Endpoint removal then
          # has to propagate to kube-proxy on every node and to the ingress controller,
          # which takes a moment. So the container can begin shutting down while traffic
          # is still being routed to it, and those requests fail.
          #
          # `maxUnavailable: 0` does not prevent this: it governs how many replicas may be
          # missing, not whether a terminating one is still in rotation. The result is a
          # small number of 502s on EVERY rolling deploy — burning error budget on the one
          # activity that is supposed to be safe, and looking like a flaky client rather
          # than a deploy problem because it is spread thin and never reproduces on demand.
          #
          # The fix is to do nothing, on purpose: during preStop the container is still
          # running and still serving, and SIGTERM is not sent until the hook returns. Five
          # seconds is comfortably more than endpoint propagation and comfortably less than
          # the 30s grace period, which still leaves the server time to finish
          # in-flight work after SIGTERM.
          #
          # NOT ADDED TO THE WORKERS, deliberately. They sit behind no Service — they
          # consume from Redpanda — so there is no endpoint to propagate and no race to
          # lose. A preStop there would delay every shutdown by five seconds and prevent
          # nothing.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
      
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tls-ca
          secret:
            secretName: ca-certificate
        - name: tls-server
          secret:
            secretName: backend-tls
      
      # FS-852. See base/priority-classes.yaml for what the three tiers mean.
      priorityClassName: platform-standard
      # FS-851. `topologySpreadConstraints` returned zero hits, so nothing stopped every
      # replica of this workload landing on one node — or, on a multi-AZ cluster, in one
      # zone. Only backend and redpanda had anti-affinity; everything else could be
      # perfectly "highly available" at three replicas and lose all three to a single node
      # drain, which is the ordinary event, not the disaster.
      #
      # `ScheduleAnyway` rather than `DoNotSchedule`: a hard constraint turns a
      # single-node cluster, or one with fewer nodes than replicas, into pods that never
      # schedule at all — trading a rare correlated failure for a guaranteed one. The
      # scheduler honours it when it can.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      terminationGracePeriodSeconds: 30
