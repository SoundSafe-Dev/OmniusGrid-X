apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: omniusgrid
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: omniusgrid-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - backend
                topologyKey: kubernetes.io/hostname
      
      containers:
        - name: backend
          image: omniusgrid/backend:latest
          imagePullPolicy: Always
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: url
            - name: REDPANDA_URL
              value: "redpanda:9092"
            - name: SCHEDULERS_IN_API
              value: "false"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: SIGNED_URL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: signed-url-secret
                  key: secret
            # Object storage for export/compliance artifacts. With multiple pods,
            # a worker generates the file on its pod and the backend serves the
            # download from another — so both must read/write the SAME S3 bucket.
            - name: EXPORT_USE_S3
              value: "true"
            - name: S3_ENDPOINT_URL
              value: "http://seaweedfs:8333"
            - name: S3_EXPORT_BUCKET
              value: "omniusgrid-exports"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
            - name: MTLS_ENABLED
              value: "true"
            - name: CA_CERT_PATH
              value: "/etc/tls/ca/ca.crt"
            - name: SERVER_CERT_PATH
              value: "/etc/tls/server/server.crt"
            - name: SERVER_KEY_PATH
              value: "/etc/tls/server/server.key"
            - name: LOG_LEVEL
              value: "info"
            - name: ALLOW_OPEN_REGISTRATION
              value: "false"
            - name: USER_INVITE_PUBLIC_BASE_URL
              value: "https://omniusgrid.local"
            - name: USER_INVITE_EXPIRE_HOURS
              value: "72"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: host
                  optional: true
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: username
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: password
                  optional: true
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_FROM_EMAIL
              value: "reports@omniusgrid.local"
            - name: SMTP_USE_TLS
              value: "false"
            - name: SMTP_START_TLS
              value: "true"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls-ca
              mountPath: /etc/tls/ca
              readOnly: true
            - name: tls-server
              mountPath: /etc/tls/server
              readOnly: true
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
      
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tls-ca
          secret:
            secretName: ca-certificate
        - name: tls-server
          secret:
            secretName: backend-tls
      
      terminationGracePeriodSeconds: 30
