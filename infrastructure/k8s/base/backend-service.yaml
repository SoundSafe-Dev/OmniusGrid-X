apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omniusgrid-backend
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: backend
automountServiceAccountToken: false
