# PodDisruptionBudgets: cap how many pods a VOLUNTARY disruption (node drain,
# cluster upgrade, autoscaler compaction) can remove at once. Without these, a
# single `kubectl drain` could evict every backend replica or every Redpanda
# broker simultaneously — an availability/durability outage during routine
# maintenance. (PDBs only bound voluntary disruptions; they don't help with node
# crashes — that's what replicas + anti-affinity + RF are for.)
#
# Only multi-replica workloads get a PDB. Single-replica stateful pods
# (timescaledb) are deliberately excluded: a maxUnavailable=0 PDB there would
# block node drains entirely, and minAvailable=1 gives no protection with one
# replica — HA for the DB needs a real replica/failover, tracked separately.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redpanda-pdb
spec:
  # At most one broker down at a time keeps quorum (2 of 3) and keeps RF=3
  # partitions available through a rolling node drain.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
---
# FS-512. The ingestion worker is the live telemetry path and KEDA holds it at a floor of
# 2 (`autoscaling/scaledobjects.yaml:29`), so by this file's own rule — "only multi-replica
# workloads get a PDB" — it should always have had one. It did not, because the rule was
# applied against the Deployment's `replicas` field and the floor that actually governs it
# lives in a different stack, deployed by a different job. Nothing read both.
#
# The other single-replica workloads remain deliberately excluded per the header above:
# export-worker and compliance-reports-worker have `minReplicaCount: 0` and scale to zero,
# where a PDB protects nothing; timescaledb, redis, seaweedfs, jaeger and otel-collector
# are true singletons whose availability needs replication, not a disruption budget.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingestion-worker-pdb
spec:
  # One pod at a time keeps the telemetry stream consuming through a rolling node drain.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-worker
