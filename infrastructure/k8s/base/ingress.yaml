apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omniusgrid-ingress
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/component: gateway
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://omniusgrid.local"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  tls:
    - hosts:
        - omniusgrid.local
        - api.omniusgrid.local
      secretName: omniusgrid-tls
  rules:
    - host: omniusgrid.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.omniusgrid.local
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
            # WebSocket upgrade support
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: omniusgrid
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-ingress
  namespace: omniusgrid
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - protocol: TCP
          port: 8000
    # Prometheus (monitoring stack) scraping the backend /metrics endpoint.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: omniusgrid
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-timescaledb-ingress
  namespace: omniusgrid
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: timescaledb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - backend
                  - ingestion-worker
                  - export-worker
                  - compliance-reports-worker
                  - ota-rollout-worker
                  - db-migrate
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redpanda-ingress
  namespace: omniusgrid
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - backend
                  - ingestion-worker
                  - export-worker
                  - compliance-reports-worker
                  - ota-rollout-worker
                  - edge-agent
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9094   # FS-66 mTLS listener
        - protocol: TCP
          port: 9644
    # KEDA (keda namespace) reads consumer-group lag over the Kafka API to drive
    # worker autoscaling. Without this the scalers can't reach the broker and
    # every ScaledObject silently fails to scale.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 9092
    # Prometheus scraping Redpanda's metrics endpoint.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9644
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ota-rollout-worker-egress
  namespace: omniusgrid
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ota-rollout-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: timescaledb
        # The CloudNativePG HA cluster (database-ha). Listed alongside timescaledb
        # so adopting the HA database does not require editing every egress policy
        # — before that stack is deployed this selector simply matches nothing.
        - podSelector:
            matchLabels:
              cnpg.io/cluster: omniusgrid-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redpanda
      ports:
        - protocol: TCP
          port: 9092
    # Trace export to the OTel collector (FS-226). The collector's own ingress
    # rule is useless without this half — an ingress allow on the destination does
    # not create egress permission on the source. Same lesson as the S3 egress and
    # prometheus -> worker :9109 regressions.
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
---
# FS-116: per-workload egress allow-lists that finish the default-deny egress
# FS-78 established. default-deny-all sets policyTypes: [Ingress, Egress] with
# no egress rules, which fully denies egress on enforcing CNIs. Rather than one
# broad allow-app-egress that grants every workload the same wide egress
# (including outbound 443), each workload below gets only the destinations it
# actually dials. ota-rollout-worker keeps its own policy above. Keep each
# policy's ports in sync with the workload's real dependencies.
#
# backend (API): DNS, TimescaleDB, Redpanda (Kafka + mTLS listener), Redis
# (rate-limit / idempotency / feature-flags / export job store) and outbound
# HTTPS/443 — Keycloak SSO, model registry, Slack/PagerDuty alert webhooks,
# live MyGeotab client, and real object storage all go out over 443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress
  namespace: omniusgrid
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes:
    - Egress
  egress:
    # Cluster DNS resolution (kube-dns in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # TimescaleDB.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: timescaledb
        # The CloudNativePG HA cluster (database-ha). Listed alongside timescaledb
        # so adopting the HA database does not require editing every egress policy
        # — before that stack is deployed this selector simply matches nothing.
        - podSelector:
            matchLabels:
              cnpg.io/cluster: omniusgrid-db
      ports:
        - protocol: TCP
          port: 5432
    # Redpanda (Kafka API + mTLS listener).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redpanda
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9094
    # Redis (rate limiting, idempotency, feature flags, export job store).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # SeaweedFS object store (8333) — serving export/compliance downloads that a
    # worker generated on another pod (EXPORT_USE_S3). Without this the S3
    # download path is denied and falls back to the pod-local file it can't see.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: seaweedfs
      ports:
        - protocol: TCP
          port: 8333
    # Outbound HTTPS to the cloud gateway / external services (no podSelector
    # restriction; egress to any destination on 443).
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # Trace export to the OTel collector (FS-226). The collector's own ingress
    # rule is useless without this half — an ingress allow on the destination does
    # not create egress permission on the source. Same lesson as the S3 egress and
    # prometheus -> worker :9109 regressions.
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
---
