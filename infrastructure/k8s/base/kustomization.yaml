apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omniusgrid

resources:
  - namespace.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - ota-rollout-worker-deployment.yaml
  - frontend-deployment.yaml
  - edge-agent-statefulset.yaml
  - edge-agent-service.yaml
  - ingestion-worker-deployment.yaml
  - export-worker-deployment.yaml
  - compliance-reports-worker-deployment.yaml
  - rag-indexing-worker-deployment.yaml
  - migration-job.yaml
  - db-backup-cronjob.yaml
  # FS-811. Weekly read-only check that the backup bucket is versioned and
  # object-locked. Separate from db-backup on purpose: an unprotected bucket must not
  # stop backups happening, and must not make DatabaseBackupStale fire.
  - backup-immutability-cronjob.yaml
  # FS-812/813/814. The three stateful services that were backed up by nothing:
  # Redis (the feature-flag store of record), SeaweedFS (compliance reports, documents,
  # exports, replicas: 1) and Redpanda's topic CONFIGURATION — not its messages, which
  # consumers persist and edge agents backfill.
  - supporting-backups.yaml
  - timescaledb-statefulset.yaml
  - redpanda-statefulset.yaml
  - redis-statefulset.yaml
  - object-store.yaml
  - pod-disruption-budgets.yaml
  - ingress.yaml
  - otel-collector.yaml

# NOTE: the old timescaledb-init-scripts configMapGenerator (001_init.sql via
# docker-entrypoint-initdb.d) is gone — it referenced a file that never lived
# in base/, initdb only ever ran migration 001, and migrate.py refuses to run
# against an initdb-built schema. The db-migrate Job owns the schema now
# (same model as docker-compose.prod.yml).

# The settings an overlay is meant to tune. Consumed via `envFrom` on the backend
# Deployment; each overlay declares the same generator with `behavior: merge` and
# overrides only the keys it cares about.
#
# ENVIRONMENT DEFAULTS TO production, AND THAT DIRECTION IS DELIBERATE (FS-385).
# `validate_settings()` in app/core/config.py hard-fails at import on an insecure
# production config — insecure JWT, DEBUG on, dev-token bypass, wildcard CORS,
# unauthenticated GeoTab webhook, unset ERP encryption key, simulated telematics — but
# every one of those checks is inside `if ENVIRONMENT.lower() == "production"`. With
# ENVIRONMENT unset the app read "development" and the entire guard was a no-op, which
# is how these manifests came to ship an admin-auth bypass.
#
# So the strict value is the inherited one. A future overlay that forgets to set
# ENVIRONMENT now gets the checks rather than losing them, and the cost of forgetting is
# a pod that refuses to start with a named reason instead of one that starts insecure
# and says nothing. Staging opts down to "staging" explicitly.
configMapGenerator:
  # FS-811. The bucket-immutability script, shared between the weekly CronJob and a human
  # running it locally, so the cluster and the runbook cannot drift apart.
  #
  # It lives INSIDE base/ (scripts/) rather than a tidier infrastructure/backup/ because CI
  # builds base WITHOUT `--load-restrictor LoadRestrictionsNone`, and a generator reading a
  # file above its own kustomization is refused outright. One copy in a slightly odd place
  # beats two copies that drift, or a CI flag loosening the restriction for every other file.
  - name: backup-immutability-script
    files:
      - bucket-immutability.sh=scripts/bucket-immutability.sh
  - name: backend-config
    literals:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=info
      - MTLS_ENABLED=true
      # Random demo telematics. Off by default: served as real fleet data it is
      # indistinguishable from a GPS fix to anything downstream.
      - GEOTAB_SIMULATED=false
      # Required by validate_settings() once ENVIRONMENT=production, and both are
      # settings rather than secrets.
      #
      # CORS_ALLOW_ORIGINS defaults to "*" in the app, which the validator rejects
      # outright — a wildcard is incompatible with credentialed requests anyway, so the
      # app disables credentials whenever it sees one. The value here tracks the hosts in
      # base/ingress.yaml; AN OPERATOR CHANGING THE INGRESS HOST MUST CHANGE THIS TOO, and
      # the symptom of forgetting is every browser request failing CORS after a deploy
      # that otherwise looks healthy.
      - CORS_ALLOW_ORIGINS=https://omniusgrid.local,https://api.omniusgrid.local
      # Unsigned edge requests are replayable.
      - EDGE_REQUIRE_PROOF_OF_POSSESSION=true

commonLabels:
  app.kubernetes.io/part-of: omniusgrid
  app.kubernetes.io/managed-by: kustomize
