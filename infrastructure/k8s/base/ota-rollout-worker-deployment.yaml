apiVersion: apps/v1
kind: Deployment
metadata:
  name: ota-rollout-worker
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: ota-rollout-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: omniusgrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ota-rollout-worker
  template:
    metadata:
      annotations:
        # Picked up by the monitoring stack's generic `kubernetes-pods` job, so no
        # per-worker scrape config is needed. Workers exposed NO metrics before
        # FS-213 — adding a scrape target would have scraped nothing.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9109"
        prometheus.io/path: "/metrics"
        # FS-780. Names the job so `WorkerDown` (up{job="opsgrid-workers"}) matches in
        # Kubernetes as it already did in compose. Without it these pods scrape under
        # job="kubernetes-pods" and the alert was inert in production only.
        prometheus.io/job: "opsgrid-workers"
      labels:
        app.kubernetes.io/name: ota-rollout-worker
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ota-rollout-worker
          image: omniusgrid/backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.workers.ota_rollouts"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # CONNECTION BUDGET (FS-839). A worker is not an API server: it runs one
            # consume/claim loop, so the API's pool would be idle capacity multiplied
            # by the replica ceiling. This one is a singleton dispatcher, sized the same way so the fleet of workers is consistent.
            #
            # 2 + 2 leaves room for the loop plus an overlapping commit without
            # reserving a pool nothing uses. `tests/k8s/check_connection_budget.py`
            # measures every replica ceiling against `max_connections` and fails if
            # this is raised without the database's ceiling moving with it.
            - name: DB_POOL_SIZE
              value: "2"
            - name: DB_MAX_OVERFLOW
              value: "2"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: url
            - name: REDPANDA_URL
              value: "redpanda:9092"
            - name: REDPANDA_COMMAND_TOPIC
              value: "opsgrid.commands"
            - name: REDPANDA_COMMAND_ACK_TOPIC
              value: "opsgrid.commands.acks"
            - name: REDPANDA_COMMAND_DLQ_TOPIC
              value: "opsgrid.commands.dlq"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: SIGNED_URL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: signed-url-secret
                  key: secret
            - name: SIGNED_URL_ALGORITHM
              value: "HS256"
            - name: SIGNED_URL_ISSUER
              value: "omniusgrid-signed-links"
            - name: SIGNED_URL_AUDIENCE
              value: "omniusgrid-report-download"
            - name: EXPORT_PUBLIC_BASE_URL
              value: "https://api.omniusgrid.local"
            - name: SCHEDULERS_IN_API
              value: "false"
            - name: OTA_ROLLOUT_DISPATCH_ENABLED
              value: "true"
            - name: OTA_ROLLOUT_DISPATCH_INTERVAL_SECONDS
              value: "30"
            - name: OTA_ROLLOUT_DEFAULT_COMMAND_TIMEOUT_SECONDS
              value: "120"
            - name: OTA_ROLLOUT_DEFAULT_HEALTH_TIMEOUT_SECONDS
              value: "300"
            - name: OTA_ROLLOUT_DEFAULT_MIN_SUCCESS_RATIO
              value: "1.0"
            - name: WORKER_HEALTH_PORT
              value: "9109"
            # Trace export (FS-226). The collector was deployed but the backend set
            # no OTEL env at all, so it exported nothing even once the network path
            # existed. Enabled here rather than left to an overlay so the default
            # deployment actually traces.
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "omniusgrid-ota-rollouts"
            - name: LOG_LEVEL
              value: "info"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: health
              containerPort: 9109
          # These Deployments carried NO probes because the workers exposed no
          # health signal at all (FS-214). A wedged consumer — process alive, loop
          # dead — ran forever while its queue backed up. /readyz reports startup;
          # /healthz reports the heartbeat (see app/workers/health_server.py).
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
