apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-worker
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: ingestion-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: omniusgrid
spec:
  # FS-512. Was `replicas: 1` — the live telemetry path running as a single pod, so a
  # node drain, an image pull failure or an OOM stopped ingestion outright.
  #
  # It also disagreed with the autoscaler that owns this workload:
  # `autoscaling/scaledobjects.yaml:29` sets `minReplicaCount: 2` with the reason "never
  # scale to zero (cold start would drop the live stream behind), keep a warm floor". So
  # the declared floor was 2 and the deployed floor was 1, and between `kubectl apply`
  # and KEDA's first 15s poll the telemetry path ran at one replica on every deploy.
  # Where KEDA is not installed — which CI explicitly tolerates, gating the autoscaling
  # stack on the CRD existing — it stayed at 1 permanently.
  #
  # KEDA owns the count once it is running; this is the value before it does.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-worker
  template:
    metadata:
      annotations:
        # Picked up by the monitoring stack's generic `kubernetes-pods` job, so no
        # per-worker scrape config is needed. Workers exposed NO metrics before
        # FS-213 — adding a scrape target would have scraped nothing.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9109"
        prometheus.io/path: "/metrics"
        # FS-780. Names the job so `WorkerDown` (up{job="opsgrid-workers"}) matches in
        # Kubernetes as it already did in compose. Without it these pods scrape under
        # job="kubernetes-pods" and the alert was inert in production only.
        prometheus.io/job: "opsgrid-workers"
      labels:
        app.kubernetes.io/name: ingestion-worker
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingestion-worker
          image: omniusgrid/backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.workers.ingestion"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # CONNECTION BUDGET (FS-839). A worker is not an API server: it runs one
            # consume/claim loop, so the API's pool would be idle capacity multiplied
            # by the replica ceiling. Ingestion alone may reach 12 replicas, and at the API's size that is 120 connections from one workload.
            #
            # 2 + 2 leaves room for the loop plus an overlapping commit without
            # reserving a pool nothing uses. `tests/k8s/check_connection_budget.py`
            # measures every replica ceiling against `max_connections` and fails if
            # this is raised without the database's ceiling moving with it.
            - name: DB_POOL_SIZE
              value: "2"
            - name: DB_MAX_OVERFLOW
              value: "2"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: url
            - name: REDPANDA_URL
              value: "redpanda:9092"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: WORKER_MODE
              value: "ingestion"
            - name: WORKER_HEALTH_PORT
              value: "9109"
            # Trace export (FS-226). The collector was deployed but the backend set
            # no OTEL env at all, so it exported nothing even once the network path
            # existed. Enabled here rather than left to an overlay so the default
            # deployment actually traces.
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "omniusgrid-ingestion"
            - name: LOG_LEVEL
              value: "info"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: health
              containerPort: 9109
          # These Deployments carried NO probes because the workers exposed no
          # health signal at all (FS-214). A wedged consumer — process alive, loop
          # dead — ran forever while its queue backed up. /readyz reports startup;
          # /healthz reports the heartbeat (see app/workers/health_server.py).
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: tmp
          emptyDir: {}
      # FS-852. See base/priority-classes.yaml for what the three tiers mean.
      priorityClassName: platform-critical
      # FS-851. `topologySpreadConstraints` returned zero hits, so nothing stopped every
      # replica of this workload landing on one node — or, on a multi-AZ cluster, in one
      # zone. Only backend and redpanda had anti-affinity; everything else could be
      # perfectly "highly available" at three replicas and lose all three to a single node
      # drain, which is the ordinary event, not the disaster.
      #
      # `ScheduleAnyway` rather than `DoNotSchedule`: a hard constraint turns a
      # single-node cluster, or one with fewer nodes than replicas, into pods that never
      # schedule at all — trading a rare correlated failure for a guaranteed one. The
      # scheduler honours it when it can.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ingestion-worker
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ingestion-worker
      terminationGracePeriodSeconds: 30
