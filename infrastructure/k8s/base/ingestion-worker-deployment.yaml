apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-worker
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: ingestion-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: omniusgrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-worker
  template:
    metadata:
      annotations:
        # Picked up by the monitoring stack's generic `kubernetes-pods` job, so no
        # per-worker scrape config is needed. Workers exposed NO metrics before
        # FS-213 — adding a scrape target would have scraped nothing.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9109"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: ingestion-worker
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingestion-worker
          image: omniusgrid/backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.workers.ingestion"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: url
            - name: REDPANDA_URL
              value: "redpanda:9092"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: WORKER_MODE
              value: "ingestion"
            - name: WORKER_HEALTH_PORT
              value: "9109"
            # Trace export (FS-226). The collector was deployed but the backend set
            # no OTEL env at all, so it exported nothing even once the network path
            # existed. Enabled here rather than left to an overlay so the default
            # deployment actually traces.
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "omniusgrid-ingestion"
            - name: LOG_LEVEL
              value: "info"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: health
              containerPort: 9109
          # These Deployments carried NO probes because the workers exposed no
          # health signal at all (FS-214). A wedged consumer — process alive, loop
          # dead — ran forever while its queue backed up. /readyz reports startup;
          # /healthz reports the heartbeat (see app/workers/health_server.py).
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
