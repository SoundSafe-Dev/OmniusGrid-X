# Nightly logical backup of the TimescaleDB database to S3.
#
# WHY LOGICAL AND NOT pgBackRest: the pgBackRest config in infra/pgbackrest/ and
# the DR runbooks describe a WAL-archiving setup with point-in-time recovery,
# but nothing in the deployed stack can execute it — timescale/timescaledb:
# latest-pg15 ships no pgbackrest binary, and no archive_mode/archive_command is
# configured anywhere. A pgBackRest backup requires working WAL archiving, so
# scheduling one here would fail every night while looking like backups exist.
# The only backup CronJob in the repo lives in legacy-patroni/, which CI never
# applies, so staging and production have had NO backups at all.
#
# This is the safety net that closes that gap today. It is a nightly dump, so
# the RPO is up to 24h and there is no PITR. Moving to timescaledb-ha with
# archive_command + pgBackRest restores PITR and is tracked separately; keep
# this running until a restore drill proves that path.
#
# Restore:
#   aws s3 cp s3://$BACKUP_S3_BUCKET/<key> - | pg_restore -d "$DATABASE_URL" --clean --if-exists
# See docs/runbooks/database-backup-restore.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  labels:
    app.kubernetes.io/name: db-backup
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"          # 02:00 daily
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid      # never overlap a long dump with the next run
  startingDeadlineSeconds: 3600  # still run if the controller was down at 02:00
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3      # keep failures around long enough to inspect
  jobTemplate:
    spec:
      backoffLimit: 2
      # Bound the whole attempt so a hung dump cannot silently occupy the slot
      # until the next schedule (Forbid would then skip that run entirely).
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: db-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault

          # Dump first, then upload. Two official images rather than one image
          # with both pg_dump and the AWS CLI baked in; initContainers are the
          # only ordering guarantee a Job gives us.
          initContainers:
            - name: dump
              image: postgres:15-alpine
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGHOST
                  value: timescaledb
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: password
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: database
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  # -Fc (custom format) so pg_restore can do selective/parallel
                  # restores; it is already compressed.
                  pg_dump -Fc --no-owner --no-acl -f /backup/dump.pgc
                  # Fail loudly on an empty/truncated dump rather than uploading
                  # a file that only looks like a backup.
                  test -s /backup/dump.pgc
                  pg_restore --list /backup/dump.pgc > /dev/null
                  echo "dump ok: $(wc -c < /backup/dump.pgc) bytes"
              volumeMounts:
                - name: backup-scratch
                  mountPath: /backup
              resources:
                requests: { cpu: "100m", memory: "256Mi" }
                limits:   { cpu: "1000m", memory: "1Gi" }

          containers:
            - name: upload
              image: amazon/aws-cli:2.17.0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: aws-access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: aws-secret-access-key
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: region
                - name: BACKUP_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: bucket
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  STAMP="$(date -u +%Y/%m/%d/%H%M%S)"
                  KEY="s3://${BACKUP_S3_BUCKET}/postgres/${STAMP}.pgc"
                  aws s3 cp /backup/dump.pgc "$KEY" --sse AES256 --only-show-errors
                  # Read it back: a cp that "succeeds" against a misconfigured
                  # bucket policy must not be reported as a good backup.
                  aws s3 ls "$KEY"
                  echo "uploaded $KEY"
              volumeMounts:
                - name: backup-scratch
                  mountPath: /backup
                  readOnly: true
                - name: aws-cache
                  mountPath: /tmp
              resources:
                requests: { cpu: "50m", memory: "128Mi" }
                limits:   { cpu: "500m", memory: "512Mi" }

          volumes:
            # Node-local scratch. sizeLimit caps a runaway dump so it cannot
            # fill the node's disk and evict other pods; raise it (or move to a
            # PVC) as the database grows.
            - name: backup-scratch
              emptyDir:
                sizeLimit: 20Gi
            - name: aws-cache
              emptyDir:
                sizeLimit: 64Mi
