# Nightly logical backup of the TimescaleDB database to S3.
#
# WHY LOGICAL AND NOT pgBackRest: the pgBackRest config in infra/pgbackrest/ and
# the DR runbooks describe a WAL-archiving setup with point-in-time recovery,
# but nothing in the deployed stack can execute it — timescale/timescaledb:
# latest-pg15 ships no pgbackrest binary, and no archive_mode/archive_command is
# configured anywhere. A pgBackRest backup requires working WAL archiving, so
# scheduling one here would fail every night while looking like backups exist.
# The only backup CronJob in the repo lives in legacy-patroni/, which CI never
# applies, so staging and production have had NO backups at all.
#
# This is the safety net that closes that gap today. It is a nightly dump, so
# the RPO is up to 24h and there is no PITR. Moving to timescaledb-ha with
# archive_command + pgBackRest restores PITR and is tracked separately; keep
# this running until a restore drill proves that path.
#
# Restore:
#   aws s3 cp s3://$BACKUP_S3_BUCKET/<key> - | pg_restore -d "$DATABASE_URL" --clean --if-exists
# See docs/runbooks/database-backup-restore.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  labels:
    app.kubernetes.io/name: db-backup
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"          # 02:00 daily
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid      # never overlap a long dump with the next run
  startingDeadlineSeconds: 3600  # still run if the controller was down at 02:00
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3      # keep failures around long enough to inspect
  jobTemplate:
    spec:
      backoffLimit: 2
      # Bound the whole attempt so a hung dump cannot silently occupy the slot
      # until the next schedule (Forbid would then skip that run entirely).
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: db-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault

          # Dump first, then upload. Two official images rather than one image
          # with both pg_dump and the AWS CLI baked in; initContainers are the
          # only ordering guarantee a Job gives us.
          initContainers:
            - name: dump
              # FS-821. The BACKUP image. `15-alpine` floats, so the pg_dump that writes the archive could
        # change minor version between runs — and a dump written by a newer pg_dump than the
        # pg_restore used to recover it is a restore that fails during an incident.
        # Digest resolved 2026-08-20.
              image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGHOST
                  value: timescaledb
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: password
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: database
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  # -Fc (custom format) so pg_restore can do selective/parallel
                  # restores; it is already compressed.
                  pg_dump -Fc --no-owner --no-acl -f /backup/dump.pgc
                  # Fail loudly on an empty/truncated dump rather than uploading
                  # a file that only looks like a backup.
                  test -s /backup/dump.pgc
                  pg_restore --list /backup/dump.pgc > /dev/null
                  echo "dump ok: $(wc -c < /backup/dump.pgc) bytes"
              volumeMounts:
                - name: backup-scratch
                  mountPath: /backup
              resources:
                requests: { cpu: "100m", memory: "256Mi" }
                limits:   { cpu: "1000m", memory: "1Gi" }

          containers:
            - name: upload
              image: amazon/aws-cli:2.17.0@sha256:643507c10ada7964ca6157b3d799f030b90577643da9955d319a77399ed80d73
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: aws-access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: aws-secret-access-key
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: region
                - name: BACKUP_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: bucket
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail

                  # FS-815. SIZE ANOMALY, checked BEFORE upload.
                  #
                  # The dump container already runs `test -s` and `pg_restore --list`, which
                  # catch an empty or corrupt file. Neither catches the case that actually
                  # happens: a dump that is well-formed, restorable, and a fraction of
                  # yesterday's — a schema dropped by a bad migration, a `--schema` flag left
                  # in, a tenant deleted. That file passes every existing check and is a
                  # backup of a database that has already lost the data.
                  #
                  # Compared against the most recent previous object rather than a fixed
                  # floor: a real database grows, so any constant is either immediately
                  # obsolete or so loose it catches nothing.
                  SIZE=$(wc -c < /backup/dump.pgc)
                  PREV=$(aws s3 ls "s3://${BACKUP_S3_BUCKET}/postgres/" --recursive \
                           | sort | tail -1 | awk '{print $3}')
                  if [ -n "${PREV:-}" ] && [ "$PREV" -gt 0 ] 2>/dev/null; then
                    # 50%: loose enough to survive a large deletion or a retention run,
                    # tight enough that a lost schema shows. Deliberately not tighter —
                    # a backup job that cries wolf gets disabled, and then there are no
                    # backups at all, which is the outcome this whole file exists to avoid.
                    FLOOR=$(( PREV / 2 ))
                    echo "size $SIZE bytes; previous $PREV; floor $FLOOR"
                    if [ "$SIZE" -lt "$FLOOR" ]; then
                      echo "REFUSING: this dump is less than half the previous one." >&2
                      echo "  It is well-formed and restorable — pg_restore --list passed —" >&2
                      echo "  which is why the existing checks let it through. Something has" >&2
                      echo "  removed data from the source, or the dump was taken with a" >&2
                      echo "  narrower scope. Investigate BEFORE this replaces good history." >&2
                      exit 1
                    fi
                  else
                    echo "size $SIZE bytes; no previous object to compare against"
                  fi

                  STAMP="$(date -u +%Y/%m/%d/%H%M%S)"
                  KEY="s3://${BACKUP_S3_BUCKET}/postgres/${STAMP}.pgc"
                  aws s3 cp /backup/dump.pgc "$KEY" --sse AES256 --only-show-errors
                  # Read it back: a cp that "succeeds" against a misconfigured
                  # bucket policy must not be reported as a good backup.
                  aws s3 ls "$KEY"
                  echo "uploaded $KEY ($SIZE bytes)"
              volumeMounts:
                - name: backup-scratch
                  mountPath: /backup
                  readOnly: true
                - name: aws-cache
                  mountPath: /tmp
              resources:
                requests: { cpu: "50m", memory: "128Mi" }
                limits:   { cpu: "500m", memory: "512Mi" }

          volumes:
            # Node-local scratch. sizeLimit caps a runaway dump so it cannot
            # fill the node's disk and evict other pods; raise it (or move to a
            # PVC) as the database grows.
            - name: backup-scratch
              emptyDir:
                sizeLimit: 20Gi
            - name: aws-cache
              emptyDir:
                sizeLimit: 64Mi
