apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-reports-worker
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: compliance-reports-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: omniusgrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: compliance-reports-worker
  template:
    metadata:
      annotations:
        # Picked up by the monitoring stack's generic `kubernetes-pods` job, so no
        # per-worker scrape config is needed. Workers exposed NO metrics before
        # FS-213 — adding a scrape target would have scraped nothing.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9109"
        prometheus.io/path: "/metrics"
        # FS-780. Names the job so `WorkerDown` (up{job="opsgrid-workers"}) matches in
        # Kubernetes as it already did in compose. Without it these pods scrape under
        # job="kubernetes-pods" and the alert was inert in production only.
        prometheus.io/job: "opsgrid-workers"
      labels:
        app.kubernetes.io/name: compliance-reports-worker
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compliance-reports-worker
          image: omniusgrid/backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.workers.compliance_reports"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # download links are built from this — dev default is localhost;
            # overlays patch the real public hostname
            - name: EXPORT_PUBLIC_BASE_URL
              value: "https://api.omniusgrid.local"
            # CONNECTION BUDGET (FS-839). A worker is not an API server: it runs one
            # consume/claim loop, so the API's pool would be idle capacity multiplied
            # by the replica ceiling. Compliance reports may reach 6 replicas; at the API's pool size that is 60 connections from one workload.
            #
            # 2 + 2 leaves room for the loop plus an overlapping commit without
            # reserving a pool nothing uses. `tests/k8s/check_connection_budget.py`
            # measures every replica ceiling against `max_connections` and fails if
            # this is raised without the database's ceiling moving with it.
            - name: DB_POOL_SIZE
              value: "2"
            - name: DB_MAX_OVERFLOW
              value: "2"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: url
            - name: REDPANDA_URL
              value: "redpanda:9092"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: SIGNED_URL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: signed-url-secret
                  key: secret
            # Local path is a per-pod scratch fast-path only. The durable, shared
            # copy goes to S3 (below) so the backend API — on another pod — can
            # serve the download. The emptyDir volume is therefore just scratch.
            - name: EXPORT_STORAGE_PATH
              value: "/var/lib/omniusgrid/exports"
            - name: EXPORT_USE_S3
              value: "true"
            - name: S3_ENDPOINT_URL
              value: "http://seaweedfs:8333"
            - name: S3_EXPORT_BUCKET
              value: "omniusgrid-exports"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
            - name: WORKER_HEALTH_PORT
              value: "9109"
            # Trace export (FS-226). The collector was deployed but the backend set
            # no OTEL env at all, so it exported nothing even once the network path
            # existed. Enabled here rather than left to an overlay so the default
            # deployment actually traces.
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "omniusgrid-compliance-reports"
            - name: LOG_LEVEL
              value: "info"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          # Optional SMTP delivery credentials; also set
          # COMPLIANCE_REPORT_EMAIL_ENABLED=true there to turn on emailing.
          envFrom:
            - secretRef:
                name: smtp-credentials
                optional: true
          ports:
            - name: health
              containerPort: 9109
          # These Deployments carried NO probes because the workers exposed no
          # health signal at all (FS-214). A wedged consumer — process alive, loop
          # dead — ran forever while its queue backed up. /readyz reports startup;
          # /healthz reports the heartbeat (see app/workers/health_server.py).
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: export-data
              mountPath: /var/lib/omniusgrid/exports
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: export-data
          emptyDir: {}
      # FS-852. See base/priority-classes.yaml for what the three tiers mean.
      priorityClassName: platform-batch
      # FS-851. `topologySpreadConstraints` returned zero hits, so nothing stopped every
      # replica of this workload landing on one node — or, on a multi-AZ cluster, in one
      # zone. Only backend and redpanda had anti-affinity; everything else could be
      # perfectly "highly available" at three replicas and lose all three to a single node
      # drain, which is the ordinary event, not the disaster.
      #
      # `ScheduleAnyway` rather than `DoNotSchedule`: a hard constraint turns a
      # single-node cluster, or one with fewer nodes than replicas, into pods that never
      # schedule at all — trading a rare correlated failure for a guaranteed one. The
      # scheduler honours it when it can.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: compliance-reports-worker
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: compliance-reports-worker
      terminationGracePeriodSeconds: 30
