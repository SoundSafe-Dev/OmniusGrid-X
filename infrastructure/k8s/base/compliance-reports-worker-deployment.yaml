apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-reports-worker
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: compliance-reports-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: omniusgrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: compliance-reports-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compliance-reports-worker
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compliance-reports-worker
          image: omniusgrid/backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.workers.compliance_reports"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # download links are built from this — dev default is localhost;
            # overlays patch the real public hostname
            - name: EXPORT_PUBLIC_BASE_URL
              value: "https://api.omniusgrid.local"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: url
            - name: REDPANDA_URL
              value: "redpanda:9092"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: SIGNED_URL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: signed-url-secret
                  key: secret
            # Local path is a per-pod scratch fast-path only. The durable, shared
            # copy goes to S3 (below) so the backend API — on another pod — can
            # serve the download. The emptyDir volume is therefore just scratch.
            - name: EXPORT_STORAGE_PATH
              value: "/var/lib/omniusgrid/exports"
            - name: EXPORT_USE_S3
              value: "true"
            - name: S3_ENDPOINT_URL
              value: "http://seaweedfs:8333"
            - name: S3_EXPORT_BUCKET
              value: "omniusgrid-exports"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
            - name: LOG_LEVEL
              value: "info"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          # Optional SMTP delivery credentials; also set
          # COMPLIANCE_REPORT_EMAIL_ENABLED=true there to turn on emailing.
          envFrom:
            - secretRef:
                name: smtp-credentials
                optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: export-data
              mountPath: /var/lib/omniusgrid/exports
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: export-data
          emptyDir: {}
      terminationGracePeriodSeconds: 30
