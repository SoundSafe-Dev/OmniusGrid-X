apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
  namespace: omniusgrid-rag
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: object-store
data:
  # Mirrors infra/seaweedfs/s3config.json - dev-only credentials, same as
  # docker-compose. Not a Secret: this identity has no access outside the
  # single-network kind test (topology A, no auth needed).
  s3config.json: |
    {
      "identities": [
        {
          "name": "omniusgrid",
          "credentials": [
            { "accessKey": "omniusgrid", "secretKey": "omniusgrid_dev_secret" }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: omniusgrid-rag
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: object-store
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: omniusgrid-rag
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: object-store
    app.kubernetes.io/part-of: omniusgrid-rag
spec:
  replicas: 1
  # All-in-one server owns a single RWO PVC - a rolling update would need two
  # pods holding it at once, so replace instead.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/component: object-store
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.68
          imagePullPolicy: IfNotPresent
          # args (not command!): the image's own ENTRYPOINT is the `weed`
          # binary - unlike compose's `command:` (which appends to
          # ENTRYPOINT), k8s `command:` replaces it, so these must be args.
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.config=/etc/seaweedfs/s3config.json
            - -s3.port=8333
            - -ip.bind=0.0.0.0

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          ports:
            - name: s3
              containerPort: 8333
              protocol: TCP
            - name: master
              containerPort: 9333
              protocol: TCP
            - name: filer
              containerPort: 8888
              protocol: TCP

          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /cluster/status
              port: master
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /cluster/status
              port: master
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
        - name: s3-config
          configMap:
            name: seaweedfs-s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: omniusgrid-rag
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: object-store
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
      protocol: TCP
    - name: master
      port: 9333
      targetPort: 9333
      protocol: TCP
    - name: filer
      port: 8888
      targetPort: 8888
      protocol: TCP
