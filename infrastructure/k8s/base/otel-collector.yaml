# OpenTelemetry Collector + Jaeger for the cluster.
#
# THIS STACK WAS DEPLOYED AND DEAD (FS-226). Three independent reasons, each
# sufficient on its own, and none of them produced an error anywhere:
#
#  1. `base` ships `default-deny-all` with `podSelector: {}`, which covers every
#     pod in the namespace. Neither of these workloads had ANY NetworkPolicy, so
#     nothing could reach the collector, the collector could not reach jaeger, and
#     the UI was unreachable. Policies are now in base/ingress.yaml.
#  2. The backend Deployment set no OTEL env at all, so it exported nothing
#     regardless of whether the collector was reachable. Now wired.
#  3. There were no probes, so a wedged collector stayed in the Service's
#     endpoints and silently blackholed spans. The collector's `health_check`
#     extension is enabled below specifically to give the probes something real
#     to hit — a TCP check on 4317 would pass while the pipeline was broken.
#
# Backend export is controlled by OTEL_ENABLED / OTEL_EXPORTER_OTLP_ENDPOINT
# (app/core/config.py).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: omniusgrid
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      # FS-793. Keeping every span is not a sampling strategy, it is the absence of
      # one, and it fails in the direction nobody notices: under load the collector
      # reaches its memory limit and drops spans ARBITRARILY, so the traces lost are
      # the ones produced during the incident. Mirrors
      # infra/otel/otel-collector-config.yaml; the two are kept in step deliberately
      # so a trace looks the same in both environments.
      tail_sampling:
        decision_wait: 30s
        num_traces: 50000
        expected_new_traces_per_sec: 200
        policies:
          - name: errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: slow
            type: latency
            latency:
              threshold_ms: 2000
          - name: ingestion
            type: string_attribute
            string_attribute:
              key: service.name
              values: ["omniusgrid-ingestion-worker"]
          - name: forced
            type: boolean_attribute
            boolean_attribute:
              key: sampling.force_keep
          - name: baseline
            type: probabilistic
            probabilistic:
              sampling_percentage: 5
      # After the sampler: batching first would make it hold batches rather than
      # whole traces, and it needs whole traces to decide.
      batch: {}
    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
    extensions:
      # Reports pipeline health, not just "the process is listening". This is what
      # the probes below target; without it the only option is a TCP check on the
      # OTLP port, which succeeds while the export pipeline is failing.
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [otlp/jaeger]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: tracing
    app.kubernetes.io/part-of: omniusgrid
spec:
  replicas: 1
  selector:
    matchLabels:
      # `app`, not app.kubernetes.io/name. spec.selector is IMMUTABLE on an
      # existing Deployment, so changing it would require deleting and recreating
      # the workload. The conventional labels are added alongside on the pod
      # template instead, and the NetworkPolicies below select on this one.
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/component: tracing
    spec:
      securityContext:
        runAsNonRoot: true
        # The upstream collector image runs as uid 10001.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # FS-852. Observability is the first thing that should yield under pressure: losing traces
      # degrades diagnosis, losing the ingestion path degrades the product. Never
      # preempts, so it cannot displace the thing it exists to watch.
      priorityClassName: platform-batch
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.109.0@sha256:af0f72b2d2493fc17f06cf3bc136548240cd7ebb2c8b1c8a7be6f3eb03068389
          args: ["--config=/etc/otel/otel-collector-config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          # memory_limiter is configured with limit_percentage, which the collector
          # resolves against its CGROUP limit — so without a memory limit set here
          # the processor has nothing to compute a budget from and the backpressure
          # it exists to apply never engages.
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
# FS-792. A STATEFULSET WITH A VOLUME, not a Deployment with in-memory storage.
#
# `all-in-one` defaults to memory storage, so every trace was lost on restart — and a
# restart is exactly what an incident produces. Yesterday's outage could not be
# investigated today, which makes tracing useful for live debugging only, at the moment
# when nobody has time to look.
#
# Badger on a PVC rather than Elasticsearch or Cassandra: single-node, no extra
# operator, and it turns "gone on restart" into "retained for a week". That is a floor,
# not an endorsement — a multi-replica trace backend is FS-859's neighbour and is
# recorded there rather than implied here.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jaeger
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: tracing
    app.kubernetes.io/part-of: omniusgrid
spec:
  serviceName: jaeger
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/component: tracing
    spec:
      securityContext:
        runAsNonRoot: true
        # jaegertracing/all-in-one runs as uid 10001.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # FS-852. Same tier as the collector that feeds it: observability is the first
      # thing that should yield under pressure. Losing traces degrades diagnosis;
      # losing the ingestion path degrades the product.
      priorityClassName: platform-batch
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60@sha256:4fd2d70fa347d6a47e79fcb06b1c177e6079f92cba88b083153d56263082135e
          securityContext:
            allowPrivilegeEscalation: false
            # NOW read-only. The note here used to say badger "writes to a working
            # directory" so the rootfs had to stay writable, and closed with "a real
            # deployment should move to a persistent backend, at which point the rootfs
            # can be locked down". FS-792 is that change: badger's writes go to the
            # mounted PVC, so nothing needs to write to the image any more.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: "badger"
            # EPHEMERAL=false is the whole point: left at its default, badger writes to a
            # temp directory and the persistence is nominal.
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: BADGER_DIRECTORY_VALUE
              value: "/badger/data"
            - name: BADGER_DIRECTORY_KEY
              value: "/badger/key"
            - name: BADGER_SPAN_STORE_TTL
              value: "168h"
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: admin
              containerPort: 14269
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          # all-in-one exposes its own health endpoint on the admin port; the UI
          # port answers before the collector is accepting spans.
          readinessProbe:
            httpGet:
              path: /
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: admin
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: badger
              mountPath: /badger
  volumeClaimTemplates:
    - metadata:
        name: badger
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
