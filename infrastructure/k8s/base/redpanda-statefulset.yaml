apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: omniusgrid
spec:
  serviceName: redpanda
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/component: messaging
    spec:
      # FS-852. Datastores rank above the interactive tier: an evicted API replica
      # degrades service, an evicted database ends it for everyone. See
      # base/priority-classes.yaml.
      priorityClassName: platform-critical
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      # Spread brokers across nodes so RF=3 actually survives a node loss —
      # otherwise all 3 replicas could land on one node and a single node failure
      # takes the whole cluster. Preferred (not required) so bring-up doesn't
      # block on clusters with fewer than 3 nodes; production should run >=3
      # nodes and can promote this to requiredDuringSchedulingIgnoredDuringExecution.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: redpanda
                topologyKey: kubernetes.io/hostname

      containers:
        - name: redpanda
          # FS-821. THE BROKER, on `:latest`. Every telemetry reading in the platform passes through it,
        # and which build was running during an incident was unanswerable. Digest resolved
        # 2026-08-20.
          image: redpandadata/redpanda:latest@sha256:9a47c1f8d6736f98fa2616f6f0b715c051cb0bdac1a1176e38321bf45a5b572d
          imagePullPolicy: IfNotPresent
          
          # default_topic_replications=3 replicates every topic across all 3
          # brokers. Without it, topics auto-create at the cluster default (RF=1)
          # and losing the broker holding a partition loses that data — 3 brokers
          # would then buy throughput, not durability. (Shell comments can't live
          # inside the backslash-continued command below, so this note is here.)
          command:
            - /bin/sh
            - -c
            - |
              redpanda start \
                --overprovisioned \
                --smp 1 \
                --memory 1G \
                --reserve-memory 200M \
                --node-id ${HOSTNAME##*-} \
                --check=false \
                --set redpanda.default_topic_replications=3 \
                --set redpanda.transaction_coordinator_replication=3 \
                --set redpanda.id_allocator_replication=3 \
                --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:29092,tls://0.0.0.0:9094 \
                --advertise-kafka-addr internal://redpanda-${HOSTNAME##*-}.redpanda.omniusgrid.svc.cluster.local:9092,external://localhost:29092,tls://redpanda-${HOSTNAME##*-}.redpanda.omniusgrid.svc.cluster.local:9094 \
                --set 'redpanda.kafka_api_tls=[{"name":"tls","enabled":true,"cert_file":"/etc/redpanda/tls/broker.crt","key_file":"/etc/redpanda/tls/broker.key","truststore_file":"/etc/redpanda/tls/ca.crt","require_client_auth":true}]' \
                --rpc-addr internal://0.0.0.0:33145 \
                --advertise-rpc-addr internal://redpanda-${HOSTNAME##*-}.redpanda.omniusgrid.svc.cluster.local:33145
          
          ports:
            - name: kafka
              containerPort: 9092
            - name: kafka-tls
              containerPort: 9094
              protocol: TCP
            - name: kafka-external
              containerPort: 29092
              protocol: TCP
            - name: rpc
              containerPort: 33145
              protocol: TCP
            - name: admin
              containerPort: 9644
              protocol: TCP
          
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
            - name: broker-tls
              mountPath: /etc/redpanda/tls
              readOnly: true
          
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  
      volumes:
        # Issued by backend/scripts/issue_broker_cert.py; create with:
        #   kubectl -n omniusgrid create secret generic redpanda-broker-tls \
        #     --from-file=broker.crt --from-file=broker.key --from-file=ca.crt
        - name: broker-tls
          secret:
            secretName: redpanda-broker-tls

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/component: messaging
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: rpc
      port: 33145
      targetPort: 33145
      protocol: TCP
    - name: admin
      port: 9644
      targetPort: 9644
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-external
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/component: messaging
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka-external
      port: 29092
      targetPort: 29092
      nodePort: 30092
      protocol: TCP
