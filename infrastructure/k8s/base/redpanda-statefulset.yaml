apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: omniusgrid
spec:
  serviceName: redpanda
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/component: messaging
    spec:
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: redpanda
          image: redpandadata/redpanda:latest
          imagePullPolicy: IfNotPresent
          
          command:
            - /bin/sh
            - -c
            - |
              redpanda start \
                --overprovisioned \
                --smp 1 \
                --memory 1G \
                --reserve-memory 200M \
                --node-id ${HOSTNAME##*-} \
                --check=false \
                --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:29092,tls://0.0.0.0:9094 \
                --advertise-kafka-addr internal://redpanda-${HOSTNAME##*-}.redpanda.omniusgrid.svc.cluster.local:9092,external://localhost:29092,tls://redpanda-${HOSTNAME##*-}.redpanda.omniusgrid.svc.cluster.local:9094 \
                --set 'redpanda.kafka_api_tls=[{"name":"tls","enabled":true,"cert_file":"/etc/redpanda/tls/broker.crt","key_file":"/etc/redpanda/tls/broker.key","truststore_file":"/etc/redpanda/tls/ca.crt","require_client_auth":true}]' \
                --rpc-addr internal://0.0.0.0:33145 \
                --advertise-rpc-addr internal://redpanda-${HOSTNAME##*-}.redpanda.omniusgrid.svc.cluster.local:33145
          
          ports:
            - name: kafka
              containerPort: 9092
            - name: kafka-tls
              containerPort: 9094
              protocol: TCP
            - name: kafka-external
              containerPort: 29092
              protocol: TCP
            - name: rpc
              containerPort: 33145
              protocol: TCP
            - name: admin
              containerPort: 9644
              protocol: TCP
          
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
            - name: broker-tls
              mountPath: /etc/redpanda/tls
              readOnly: true
          
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  
      volumes:
        # Issued by backend/scripts/issue_broker_cert.py; create with:
        #   kubectl -n omniusgrid create secret generic redpanda-broker-tls \
        #     --from-file=broker.crt --from-file=broker.key --from-file=ca.crt
        - name: broker-tls
          secret:
            secretName: redpanda-broker-tls

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/component: messaging
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: rpc
      port: 33145
      targetPort: 33145
      protocol: TCP
    - name: admin
      port: 9644
      targetPort: 9644
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-external
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/component: messaging
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka-external
      port: 29092
      targetPort: 29092
      nodePort: 30092
      protocol: TCP
