# Prometheus scrape config for the Kubernetes cluster. This is the k8s-native
# counterpart to infra/prometheus/prometheus.yml (which uses docker-compose
# service names): here targets are discovered via the Kubernetes API instead of
# static hostnames, so new pods are scraped automatically.
#
# The ALERT RULES themselves are NOT duplicated here — the kustomization mounts
# the canonical infra/prometheus/alerts.yml and slo_rules.yml as a ConfigMap so
# there is exactly one source of truth for both compose and k8s.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: opsgrid
    environment: kubernetes

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/alerts.yml
  - /etc/prometheus/rules/slo_rules.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # kube-state-metrics — cluster object state (deployments, pods, HPAs, PVCs…)
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics:8080']

  # Backend API — the app's /metrics endpoint (root-mounted). Scrape via the
  # Service so all backend replicas behind it are covered.
  - job_name: 'opsgrid-backend'
    metrics_path: '/metrics'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          # FS-511. This was ['omniusgrid'] alone, so in staging — where the
          # namespace is omniusgrid-staging — every one of these four jobs
          # discovered nothing. Prometheus came up healthy with zero targets,
          # which is the failure that looks most like success: the UI is
          # green, the alert rules are loaded, and nothing can ever fire.
          #
          # Listing both is deliberate rather than templated. Kubernetes SD
          # does not error on a namespace that is absent, it simply yields no
          # targets — so one config is correct in both clusters. A per-env
          # ConfigMap would mean two copies of this file, and the drift
          # between them is a worse failure than a listed namespace that a
          # given cluster happens not to have.
          names: ['omniusgrid', 'omniusgrid-staging']
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        action: keep
        regex: backend
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: http|8000|web
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  # Redpanda broker metrics
  - job_name: 'redpanda'
    metrics_path: '/public_metrics'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          # FS-511. This was ['omniusgrid'] alone, so in staging — where the
          # namespace is omniusgrid-staging — every one of these four jobs
          # discovered nothing. Prometheus came up healthy with zero targets,
          # which is the failure that looks most like success: the UI is
          # green, the alert rules are loaded, and nothing can ever fire.
          #
          # Listing both is deliberate rather than templated. Kubernetes SD
          # does not error on a namespace that is absent, it simply yields no
          # targets — so one config is correct in both clusters. A per-env
          # ConfigMap would mean two copies of this file, and the drift
          # between them is a worse failure than a listed namespace that a
          # given cluster happens not to have.
          names: ['omniusgrid', 'omniusgrid-staging']
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: redpanda
      - source_labels: [__address__]
        action: replace
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}:9644'
        target_label: __address__

  # CloudNativePG — the operator runs a metrics exporter on 9187 of every
  # instance pod (labelled cnpg.io/cluster). Powers the replication-lag and
  # cluster-health alerts/dashboard. No-op until the database-ha stack is applied.
  - job_name: 'cloudnative-pg'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          # FS-511. This was ['omniusgrid'] alone, so in staging — where the
          # namespace is omniusgrid-staging — every one of these four jobs
          # discovered nothing. Prometheus came up healthy with zero targets,
          # which is the failure that looks most like success: the UI is
          # green, the alert rules are loaded, and nothing can ever fire.
          #
          # Listing both is deliberate rather than templated. Kubernetes SD
          # does not error on a namespace that is absent, it simply yields no
          # targets — so one config is correct in both clusters. A per-env
          # ConfigMap would mean two copies of this file, and the drift
          # between them is a worse failure than a listed namespace that a
          # given cluster happens not to have.
          names: ['omniusgrid', 'omniusgrid-staging']
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
        action: keep
        regex: .+
      - source_labels: [__address__]
        action: replace
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}:9187'
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
        target_label: cnpg_cluster
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  # Synthetic probes (FS-769). node-exporter and postgres-exporter are discovered by
  # the generic `kubernetes-pods` job below via their prometheus.io/job annotations;
  # blackbox is different because Prometheus does not scrape the TARGET, it asks the
  # exporter to probe it — hence the relabel dance and a static target list.
  #
  # Two targets on purpose. The in-cluster Service probe answers "is the app alive";
  # the external ingress probe answers "can a customer reach it". They disagree
  # exactly when the ingress, DNS or certificate is the problem, which is the class no
  # in-process metric can see.
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx_insecure]
    scrape_interval: 15s
    static_configs:
      - targets:
          - http://backend:8000/health/ready
        labels: {probe_target: backend_ready}
      - targets:
          - http://backend:8000/health/live
        labels: {probe_target: backend_live}
      - targets:
          - http://frontend:80/
        labels: {probe_target: frontend}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # The exporter's own health. Without it, a dead blackbox-exporter and a healthy
  # system are the same observation: no probe_success series either way.
  # ProbeSignalMissing pages on precisely that.
  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox-exporter:9115']

  # Generic pod discovery: any pod annotated with prometheus.io/scrape: "true"
  # is scraped at its declared prometheus.io/port and prometheus.io/path. Lets a
  # new worker opt into scraping with two annotations and no config change here.
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          # FS-511. This was ['omniusgrid'] alone, so in staging — where the
          # namespace is omniusgrid-staging — every one of these four jobs
          # discovered nothing. Prometheus came up healthy with zero targets,
          # which is the failure that looks most like success: the UI is
          # green, the alert rules are loaded, and nothing can ever fire.
          #
          # Listing both is deliberate rather than templated. Kubernetes SD
          # does not error on a namespace that is absent, it simply yields no
          # targets — so one config is correct in both clusters. A per-env
          # ConfigMap would mean two copies of this file, and the drift
          # between them is a worse failure than a listed namespace that a
          # given cluster happens not to have.
          names: ['omniusgrid', 'omniusgrid-staging']
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: 'true'
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: '([^:]+)(?::\d+)?;(\d+)'
        replacement: '${1}:${2}'
        target_label: __address__
      # FS-780. A pod may DECLARE its job name, and both environments then agree.
      #
      # Without this, every annotated pod in the cluster lands under
      # `job="kubernetes-pods"`, while compose gives the same processes
      # `job="opsgrid-workers"` and `job="opsgrid-edge-agent"` from static_configs.
      # Two alert rules keyed off those job names — `WorkerDown` and
      # `EdgeAgentUnreachable` — therefore matched nothing in Kubernetes and were
      # silently disabled in the only environment that matters, while firing correctly
      # in local development, which is the worst possible place for the difference.
      #
      # Fixing it here rather than widening the two expressions: a regex over
      # `kubernetes-pods` would have swept in the backend and every future annotated
      # pod, so `WorkerDown` would have started firing for things that are not workers.
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_job]
        action: replace
        target_label: job
        regex: (.+)
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
