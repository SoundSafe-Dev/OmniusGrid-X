# Prometheus server: scrapes the backend /metrics, Redpanda, kube-state-metrics
# and any annotated pod; evaluates the canonical alert rules; forwards firing
# alerts to Alertmanager. RBAC grants read-only Kubernetes service discovery.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: omniusgrid
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omniusgrid-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: omniusgrid
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: omniusgrid-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: omniusgrid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omniusgrid-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: omniusgrid
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: omniusgrid
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: omniusgrid
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: monitoring
      annotations:
        # rollout when the scrape config or rules change
        checksum/config: "replace-on-config-change"
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534   # nobody
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            # FS-859. WAS 15d, AGAINST A 28-DAY SLA WINDOW. `slo_rules.yml` computes
            # `job:slo_availability:ratio28d` as `avg_over_time(...[28d])`, and the error
            # budget the contract rests on is derived from it — over a window nearly twice
            # the retention.
            #
            # Prometheus does not error on that. `avg_over_time` skips absent samples and
            # averages what exists, so the first ~13 days of every month were simply not in
            # the number, and the omission FLATTERS: a bad first half of the month is
            # invisible. It is the same class as the FS-770 finding that opened this sprint
            # — a measurement that looks right and is not — reintroduced one layer down.
            #
            # 35d is 28 plus a week of headroom, so a late query or a clock skew still
            # covers the contractual window. `test_the_retention_covers_the_slo_window.py`
            # derives the requirement from the rules rather than restating it, so widening
            # a window without widening retention fails the build.
            - "--storage.tsdb.retention.time=35d"
            - "--web.enable-lifecycle"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Scaled with the retention above: 20Gi held 15 days, so 35 days needs
            # roughly 47. 64Gi leaves room for the series growth that FS-794's cardinality
            # alert watches for — running out of disk is how a metrics store stops
            # recording the outage it exists to record.
            storage: 64Gi
