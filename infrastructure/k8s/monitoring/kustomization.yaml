apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cluster observability stack — Prometheus + Alertmanager + kube-state-metrics +
# Grafana (platform dashboards).
# Deployed SEPARATELY from the app base (monitoring has a different lifecycle and
# pulls in the canonical alert rules from infra/prometheus, which live OUTSIDE
# this directory). Because of that cross-tree file reference, build it with:
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone \
#     infrastructure/k8s/monitoring | kubectl apply -f -
#
# The alert rules are generated straight from infra/prometheus/*.yml so there is
# ONE source of truth shared with the docker-compose Prometheus.
namespace: omniusgrid

resources:
  - prometheus.yaml
  - alertmanager.yaml
  - kube-state-metrics.yaml
  # FS-769/776/777/779. blackbox + node + postgres exporters. Nine alert rules — three
  # of them `critical` — referenced series that no deployment in this repository
  # produced; these are what make the register's claims true.
  - exporters.yaml
  # FS-789/790. Loki + promtail. These shipped for docker-compose only, so every runbook
  # step that says "check the container logs" was unexecutable in the cluster — including
  # the one WorkerCrashLooping links to, whose whole remedy is reading them.
  - logging.yaml
  - grafana.yaml
  - networkpolicies.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus-config.yml
  - name: prometheus-rules
    files:
      - alerts.yml=../../../infra/prometheus/alerts.yml
      - slo_rules.yml=../../../infra/prometheus/slo_rules.yml
  - name: alertmanager-config
    files:
      - alertmanager.yml=alertmanager-config.yml
  # Blackbox probe modules and postgres_exporter's custom queries, both pulled from
  # infra/prometheus so compose and the cluster probe identically and name the same
  # metrics. Same single-source reasoning as the alert rules above.
  - name: blackbox-config
    files:
      - config.yml=../../../infra/prometheus/blackbox.yml
  - name: postgres-exporter-queries
    files:
      - queries.yaml=../../../infra/prometheus/postgres_queries.yaml
  # Loki's config is shared with compose; promtail's is NOT — service discovery is the
  # one part that genuinely differs, and a shared file would ship each environment a
  # discovery block matching nothing.
  - name: loki-config
    files:
      - loki.yml=../../../infra/loki/loki.yml
  - name: promtail-config
    files:
      - promtail.yml=../../../infra/loki/promtail-k8s.yml
  # Grafana provisioning: datasource + dashboard provider (local), and the
  # platform dashboard from the canonical infra/grafana tree (single source).
  - name: grafana-datasources
    files:
      - datasources.yml=grafana-datasource.yml
  - name: grafana-dashboard-provider
    files:
      - provider.yml=grafana-dashboard-provider.yml
  - name: grafana-dashboards
    files:
      - platform-infra.json=../../../infra/grafana/provisioning/dashboards/platform-infra.json

# Hash suffixes stay ON: kustomize rewrites the Deployment/StatefulSet volume
# references to the hashed ConfigMap name, so changing the scrape config or the
# alert rules rolls the pods automatically.

commonLabels:
  app.kubernetes.io/part-of: omniusgrid
  app.kubernetes.io/managed-by: kustomize
