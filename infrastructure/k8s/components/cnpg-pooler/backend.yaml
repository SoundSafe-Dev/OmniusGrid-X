# Repoint the API's DATABASE_URL at the CNPG pooler (FS-801).
#
# THE CONTAINER NAME MUST BE THE REAL ONE. A first version of this component used a single
# shared patch with `name: PLACEHOLDER`, on the assumption that the patch TARGET would
# supply it. It does not — kustomize merges containers by name, found no container called
# PLACEHOLDER, and **added a second, image-less container to every workload** while the
# real container kept pointing at the old `database-credentials` secret.
#
# `kustomize build` exited 0 and `kubeconform` was content. The cutover would have appeared
# to be wired, changed nothing, and left seven Deployments with a container that could
# never start. Caught only by reading the built output rather than the exit code — which is
# rule 273, one layer up: building is not deploying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: CNPG_DB_USER
              valueFrom:
                secretKeyRef:
                  name: omniusgrid-db-app      # generated by the CloudNativePG operator
                  key: username
            - name: CNPG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omniusgrid-db-app
                  key: password
            # `$(VAR)` is expanded by the kubelet from earlier env vars in the SAME container, so
            # the password reaches the URL without ever being written into a manifest. A strategic
            # merge on `env` matches by NAME, so this entry REPLACES base's `valueFrom` one —
            # Kubernetes rejects a container carrying both forms for a single variable, which is
            # what makes the override clean rather than a silent duplicate.
            #
            # The POOLER, not the -rw Service. Going direct works and defeats the point: FS-839
            # measures the backend HPA at 20 replicas plus KEDA workers against max_connections
            # 200, and transaction pooling is what makes that arithmetic survivable.
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(CNPG_DB_USER):$(CNPG_DB_PASSWORD)@omniusgrid-db-pooler-rw:5432/omniusgrid"
              # EXPLICIT NULL, and it is required. Strategic merge combines the two entries
              # FIELD BY FIELD rather than replacing: without this the merged env var carries
              # both `value` and base's `valueFrom`, and the API server rejects it —
              # "may not have more than one field specified". The build succeeds, kubeconform
              # passes, and the apply fails. Found by test_the_cnpg_cutover_is_coherent.py.
              valueFrom: null
