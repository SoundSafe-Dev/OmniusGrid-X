apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omniusgrid

resources:
  - ../../base
  # New objects (two HPAs), not patches — base has no HPA to merge onto.
  - hpa.yaml

namePrefix: prod-

commonLabels:
  environment: production
  version: stable

replicas:
  - name: backend
    count: 5
  - name: frontend
    count: 3

images:
  - name: omniusgrid/backend
    newName: ghcr.io/omniusgrid/backend
    newTag: v1.0.0
  - name: omniusgrid/frontend
    newName: ghcr.io/omniusgrid/frontend
    newTag: v1.0.0

configMapGenerator:
  # `behavior: merge` — base owns this ConfigMap now and the backend consumes it via
  # envFrom. Without the merge kustomize errors on the duplicate id; before the envFrom
  # existed, everything here was rendered and then read by nobody.
  - name: backend-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=warn
      - MTLS_ENABLED=true
      - CACHE_ENABLED=true


# FS-801. THE CNPG CUTOVER. Repoints the backend, the four workers, the migration Job
# and the backup CronJob at the CloudNativePG pooler instead of base's single-replica
# StatefulSet — which is what turns the HA cluster from a manifest into the database the
# application actually uses, and what makes the 15-minute RPO real rather than described.
#
# database-ha/README.md called this a manual step. A manual step in a runbook is a step
# that gets skipped, and the failure is silent in the worst direction: the HA cluster runs,
# WAL archiving works perfectly, and it archives a database nothing is writing to.
#
# PREREQUISITE, and it is hard: the CloudNativePG operator must be installed and
# infrastructure/k8s/database-ha/ applied and migrated BEFORE this overlay is applied.
# Otherwise every pod points at a Service that does not exist. `deploy-production` in
# ci-cd.yml applies database-ha first for this reason, and
# `test_the_cnpg_cutover_is_coherent.py` asserts it still does.
components:
  - ../../components/cnpg-pooler

patches:
  # Explicit targets: the base resources carry namespace omniusgrid, so a bare
  # patchesStrategicMerge id (no namespace) never matches under kustomize v5.
  - path: backend-resources.yaml
    target:
      kind: Deployment
      name: backend
  - path: frontend-resources.yaml
    target:
      kind: Deployment
      name: frontend
  - target:
      kind: Ingress
      name: omniusgrid-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: omniusgrid.local
      - op: replace
        path: /spec/rules/1/host
        value: api.omniusgrid.local
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - omniusgrid.local
          - api.omniusgrid.local

  # Drop the DEV placeholder Secret that base ships so base/ stays applyable on a
  # throwaway cluster. Production must supply the real s3-credentials out-of-band
  # (Sealed Secrets or ESO — see ../../secrets/). Leaving it in meant the prod
  # overlay literally carried `omniusgrid_dev_secret`, and "don't apply the
  # placeholders in prod" was documentation rather than something enforced.
  # tests/k8s/check_placeholder_secrets.py now fails CI if one comes back.
  - target:
      kind: Secret
      name: s3-credentials
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: s3-credentials
