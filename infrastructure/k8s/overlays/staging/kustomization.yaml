apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omniusgrid-staging

resources:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging
  version: latest

replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 2

# Checked-in defaults only. The deploy job overrides both with
# `kustomize edit set image ...:<branch>-<sha>` before applying, so these tags
# are what you get from a manual `kubectl apply -k` and nothing else. They used
# to read `develop`, a branch that has never existed.
images:
  - name: omniusgrid/backend
    newName: ghcr.io/omniusgrid/backend
    newTag: main
  - name: omniusgrid/frontend
    newName: ghcr.io/omniusgrid/frontend
    newTag: main

configMapGenerator:
  # `behavior: merge` — base owns this ConfigMap and the backend consumes it via envFrom.
  # Until that reference existed none of these three reached the process, so staging was
  # running with mTLS ON and log level INFO despite saying otherwise here.
  - name: backend-config
    behavior: merge
    literals:
      # Opting DOWN from base's `production` on purpose: staging is not production, and
      # the strict validator would refuse to start without the full production secret
      # set. The dev-token bypass and open registration are pinned off in the Deployment
      # itself, so this relaxes logging and mTLS — not authentication.
      - ENVIRONMENT=staging
      - LOG_LEVEL=debug
      - MTLS_ENABLED=false
      - DEBUG=true


patches:
  # Explicit target: the base resources carry namespace omniusgrid, so a bare
  # patchesStrategicMerge id (no namespace) never matches under kustomize v5.
  - path: backend-resources.yaml
    target:
      kind: Deployment
      name: backend
  - target:
      kind: Ingress
      name: omniusgrid-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.omniusgrid.local
      - op: replace
        path: /spec/rules/1/host
        value: api-staging.omniusgrid.local
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - staging.omniusgrid.local
          - api-staging.omniusgrid.local
      - op: remove
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
  # Same reasoning as the production overlay: staging is a real deployed
  # environment, so shipping `omniusgrid_dev_secret` there undermines the point of
  # having a staging environment at all. Provision real staging credentials via
  # ../../secrets/. base/ keeps its placeholder so a throwaway cluster still works.
  - target:
      kind: Secret
      name: s3-credentials
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: s3-credentials
