apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# KEDA lag-based autoscaling for the Redpanda consumer workers. Deployed
# SEPARATELY from the app base and ONLY after the KEDA operator (which provides
# the keda.sh CRDs) is installed — see README.md.
namespace: omniusgrid

resources:
  - scaledobjects.yaml

commonLabels:
  app.kubernetes.io/part-of: omniusgrid
  app.kubernetes.io/managed-by: kustomize
