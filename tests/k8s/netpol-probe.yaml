# Probe pods for the NetworkPolicy enforcement test. They carry the REAL workload
# labels so the REAL base NetworkPolicies select them, then the CI job asserts
# allowed vs denied connectivity between them under Calico.
#
#   np-seaweedfs-stub   (seaweedfs)        listens on 8333; `allow-seaweedfs-ingress`
#                                          selects it.
#   np-export-client    (export-worker)    MUST reach seaweedfs:8333 — this is the
#                                          S3 export-upload path (allow-export-worker-egress
#                                          + allow-seaweedfs-ingress). Regression guard.
#   np-ingestion-client (ingestion-worker) MUST NOT reach seaweedfs:8333 — its egress
#                                          omits SeaweedFS and the SeaweedFS ingress
#                                          omits it. Proves policies actually DENY.
#
# IMPORTANT: base/kustomization.yaml sets commonLabels (part-of + managed-by), so
# every generated podSelector matches on all THREE labels. These pods must carry
# all three or the real policies would not select them and the test would be
# vacuous (everything "allowed" because nothing applies).
#
# agnhost is the upstream Kubernetes e2e network-test image: `netexec` serves HTTP,
# `connect` is a scriptable TCP dialer with a meaningful exit code.
apiVersion: v1
kind: Pod
metadata:
  name: np-seaweedfs-stub
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: omniusgrid
    app.kubernetes.io/managed-by: kustomize
spec:
  containers:
    - name: server
      image: registry.k8s.io/e2e-test-images/agnhost:2.47
      args: ["netexec", "--http-port=8333"]
      ports:
        - containerPort: 8333
---
apiVersion: v1
kind: Pod
metadata:
  name: np-export-client
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: export-worker
    app.kubernetes.io/part-of: omniusgrid
    app.kubernetes.io/managed-by: kustomize
spec:
  containers:
    - name: client
      image: registry.k8s.io/e2e-test-images/agnhost:2.47
      args: ["pause"]
---
apiVersion: v1
kind: Pod
metadata:
  name: np-ingestion-client
  namespace: omniusgrid
  labels:
    app.kubernetes.io/name: ingestion-worker
    app.kubernetes.io/part-of: omniusgrid
    app.kubernetes.io/managed-by: kustomize
spec:
  containers:
    - name: client
      image: registry.k8s.io/e2e-test-images/agnhost:2.47
      args: ["pause"]
