# Grafana Provisioning - Dashboard providers (converged: both provisioning trees)
apiVersion: 1

providers:
  - name: 'OpsGrid Dashboards'
    orgId: 1
    folder: 'OpsGrid'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards

  - name: 'OpsGrid'
    orgId: 1
    folder: 'OpsGrid (API)'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
