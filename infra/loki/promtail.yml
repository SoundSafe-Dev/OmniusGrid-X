server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

  # System logs
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog

  # Journal logs (systemd)
  - job_name: journal
    journal:
      max_age: 12h
      labels:
        job: systemd-journal
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'
      - source_labels: ['__journal__hostname']
        target_label: 'hostname'

  # OpsGrid specific log files
  - job_name: opsgrid-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: opsgrid
          service: backend
          __path__: /var/log/opsgrid/*.log

  # Edge agent logs
  - job_name: edge-agent-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: opsgrid-edge
          service: edge-agent
          __path__: /var/log/opsgrid-edge/*.log

# Pipeline stages for parsing
pipeline_stages:
  - json:
      expressions:
        level: level
        msg: message
        timestamp: timestamp
  - labels:
      level:
  - timestamp:
      source: timestamp
      format: RFC3339
