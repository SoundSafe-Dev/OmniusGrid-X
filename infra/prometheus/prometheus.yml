global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: opsgrid
    replica: '{{.ExternalURL}}'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo_rules.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API metrics
  - job_name: 'opsgrid-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  # Edge agent collector metrics (opt-in: set METRICS_PORT on the agent)
  - job_name: 'edge-agent'
    static_configs:
      - targets: ['edge-agent:9108']
  # Edge agent metrics (edge-agent-sim service, simulator profile)
  - job_name: 'opsgrid-edge-agent'
    static_configs:
      - targets: ['edge-agent-sim:9108']
    metrics_path: '/metrics'

  # Redpanda metrics
  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']

  # Background workers (FS-213). These four ran unscraped because they exposed no
  # metrics endpoint at all — adding a job earlier would have created four
  # permanently-DOWN targets, the same masking problem noted below. They now serve
  # /metrics on 9109 (app/workers/health_server.py). Compose has no service
  # discovery, so targets are static and `worker` is set here; in Kubernetes the
  # `kubernetes-pods` job picks the same port up from the pod annotations instead.
  - job_name: 'opsgrid-workers'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ingestion-worker:9109']
        labels: {worker: ingestion}
      - targets: ['export-worker:9109']
        labels: {worker: export_delivery}
      - targets: ['compliance-reports-worker:9109']
        labels: {worker: compliance_reports}
      - targets: ['ota-rollout-worker:9109']
        labels: {worker: ota_rollouts}

  # TimescaleDB / container metrics: add postgres_exporter and cadvisor
  # services before scraping them — the previous raw targets (timescaledb:5432
  # speaks the postgres wire protocol, cadvisor never existed in compose) sat
  # permanently DOWN and masked real target failures.
