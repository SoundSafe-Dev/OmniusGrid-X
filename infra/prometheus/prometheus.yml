global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: opsgrid
    replica: '{{.ExternalURL}}'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo_rules.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API metrics
  - job_name: 'opsgrid-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  # Edge agent collector metrics (opt-in: set METRICS_PORT on the agent)
  - job_name: 'edge-agent'
    static_configs:
      - targets: ['edge-agent:9108']
  # Edge agent metrics (edge-agent-sim service, simulator profile)
  - job_name: 'opsgrid-edge-agent'
    static_configs:
      - targets: ['edge-agent-sim:9100']
    metrics_path: '/metrics'

  # Redpanda metrics
  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']

  # TimescaleDB metrics (via postgres_exporter if available)
  - job_name: 'timescaledb'
    static_configs:
      - targets: ['timescaledb:5432']

  # Node/Container metrics (cadvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'
