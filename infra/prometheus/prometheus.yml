global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: opsgrid
    replica: '{{.ExternalURL}}'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo_rules.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API metrics
  - job_name: 'opsgrid-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  # Edge agent metrics (edge-agent-sim service, simulator profile).
  #
  # FS-517. There were TWO jobs here — 'edge-agent' at `edge-agent:9108` and
  # 'opsgrid-edge-agent' at `edge-agent-sim:9108`. `edge-agent` is a network ALIAS for
  # edge-agent-sim (docker-compose.yml:579-581), so both scraped the same container.
  #
  # That is not merely a redundant job. No alert rule or dashboard panel filters by
  # `job`, so every series existed twice under two different job labels:
  # `sum(edge_agent_up)` on the fleet dashboard counted each agent twice, and
  # `EdgeAgentBufferHigh` would have fired two identical alerts per agent. The fleet
  # size was wrong in the direction that looks like growth.
  - job_name: 'opsgrid-edge-agent'
    static_configs:
      - targets: ['edge-agent-sim:9108']
    metrics_path: '/metrics'

  # Host metrics (FS-776/777). DiskSpaceCritical and HighMemoryUsage read node_* and
  # nothing exported it in any environment; both were inert.
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Database metrics (FS-779). Feeds SlowDatabaseQueries and the connection-headroom
  # series FS-839 sizes the application pool against.
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Synthetic probes (FS-769). The `blackbox-exporter` job below scrapes the exporter's
  # OWN metrics; this job asks it to probe targets. The relabel dance is the standard
  # blackbox pattern: the target address becomes a URL parameter, and the exporter's
  # address becomes the scrape address.
  #
  # These probes are the only availability signal that survives the backend dying. The
  # SLI in slo_rules.yml is built on `probe_success` for exactly that reason.
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx_insecure]
    scrape_interval: 15s
    static_configs:
      - targets:
          - http://backend:8000/health/live
        labels: {probe_target: backend_live}
      - targets:
          - http://backend:8000/health/ready
        labels: {probe_target: backend_ready}
      - targets:
          - http://frontend:80/
        labels: {probe_target: frontend}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # The exporter's own health. Without this, a dead blackbox-exporter looks identical
  # to a healthy system: no probe_success series either way. Paired with the
  # ProbeSignalMissing alert in alerts.yml.
  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox-exporter:9115']

  # Redpanda metrics
  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']

  # Background workers (FS-213). These four ran unscraped because they exposed no
  # metrics endpoint at all — adding a job earlier would have created four
  # permanently-DOWN targets, the same masking problem noted below. They now serve
  # /metrics on 9109 (app/workers/health_server.py). Compose has no service
  # discovery, so targets are static and `worker` is set here; in Kubernetes the
  # `kubernetes-pods` job picks the same port up from the pod annotations instead.
  - job_name: 'opsgrid-workers'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ingestion-worker:9109']
        labels: {worker: ingestion}
      - targets: ['export-worker:9109']
        labels: {worker: export_delivery}
      - targets: ['compliance-reports-worker:9109']
        labels: {worker: compliance_reports}
      - targets: ['ota-rollout-worker:9109']
        labels: {worker: ota_rollouts}

  # TimescaleDB / container metrics: add postgres_exporter and cadvisor
  # services before scraping them — the previous raw targets (timescaledb:5432
  # speaks the postgres wire protocol, cadvisor never existed in compose) sat
  # permanently DOWN and masked real target failures.
