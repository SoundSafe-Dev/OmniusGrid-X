# FS-787. SECRETS ARE FILE REFS, NOT ${ENV} PLACEHOLDERS.
#
# This config previously carried `${SLACK_WEBHOOK_URL}` and `${PAGERDUTY_SERVICE_KEY}`
# as literal strings. Alertmanager does not expand environment variables — and the
# consequence is worse than an unexpanded value, because `${SLACK_WEBHOOK_URL}` is not
# a URL:
#
#     $ amtool check-config infra/prometheus/alertmanager.yml
#     FAILED: unsupported scheme "" for URL
#
# Alertmanager refuses to start on a config it cannot parse. The compose Alertmanager
# has therefore never run, every alert Prometheus produced went undelivered, and
# prometheus.yml:8-12 has been pointing at a container in a restart loop. Same shape as
# FS-516 one file over: a stack that looks configured and has never worked.
#
# `infrastructure/k8s/monitoring/alertmanager-config.yml` got this right from the start
# and says why in its own header; this file now matches it. Local defaults live in
# infra/prometheus/alertmanager-secrets/ and point at localhost, so a development stack
# routes alerts correctly and cannot page anybody.
global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'opsgrid@factory.local'
  smtp_auth_username: ''
  smtp_auth_password: ''

# Route alerts based on severity
templates:
- '/etc/alertmanager/template/*.tmpl'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'
  routes:
    # Critical alerts go to PagerDuty/SMS
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true

    # High severity to Slack #opsgrid-alerts
    - match:
        severity: high
      receiver: 'slack-high'

    # Warning: actionable operational signals (elevated API error rate,
    # unhandled-exception spikes, ingestion lag, notification/error-tracker
    # delivery failing). ~11 alert rules use this severity; without a route they
    # matched nothing and fell through to the general catch-all receiver instead
    # of the alerts channel. Route to the same #opsgrid-alerts as high.
    - match:
        severity: warning
      receiver: 'slack-high'

    # Medium severity to Slack #opsgrid-info
    - match:
        severity: medium
      receiver: 'slack-medium'

    # Low severity - log only (no noise)
    - match:
        severity: low
      receiver: 'null'

    # FS-784. The dead-man's switch. `DeadMansSwitch` fires permanently and on purpose;
    # it must NOT reach a human channel, and it must not fall through to the catch-all,
    # which would post to #opsgrid-general every repeat_interval forever.
    #
    # Its value is entirely in the negative: an external watchdog (a cron on different
    # infrastructure, or a hosted heartbeat service) watches for this notification to
    # STOP. Every other rule in alerts.yml goes quiet when Prometheus dies, which is
    # indistinguishable from a healthy system — this is the one signal whose silence
    # means something.
    #
    # `repeat_interval` is short because the watchdog's own dead-time is bounded by it.
    - match:
        severity: none
      receiver: 'watchdog'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m

receivers:
  - name: 'default'
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        channel: '#opsgrid-general'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  - name: 'null'

  # FS-784. Point this at the external heartbeat URL for the environment (Dead Man's
  # Snitch, Healthchecks.io, or a self-hosted watchdog). Left as a webhook with no URL
  # in the repository because the endpoint is per-environment and secret-bearing; the
  # deploy-time templating that resolves ${SLACK_WEBHOOK_URL} resolves this too.
  - name: 'watchdog'
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/watchdog-heartbeat-url
        send_resolved: false

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key_file: /etc/alertmanager/secrets/pagerduty-service-key
        description: '{{ .CommonAnnotations.summary }}'
        severity: critical

  - name: 'slack-high'
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        channel: '#opsgrid-alerts'
        title: '⚠️ HIGH: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        send_resolved: true

  - name: 'slack-medium'
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        channel: '#opsgrid-info'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: false

inhibit_rules:
  # FS-786. THE PREVIOUS TWO RULES COULD NEVER MATCH.
  #
  #     - source_match: {severity: critical}
  #       target_match: {severity: high}
  #       equal: ['alertname', 'cluster', 'service']
  #
  # `equal: ['alertname']` requires source and target to share an alertname — while the
  # matchers require them to differ in severity. Every rule in alerts.yml hardcodes one
  # severity, and all 70 alertnames are distinct, so no pair of alerts can ever satisfy
  # both conditions. Both rules were structurally dead, and dead inhibition is invisible:
  # it looks exactly like "nothing needed suppressing yet".
  #
  # Inhibition has to key on the SUBJECT the alerts share, not on their name. Each rule
  # below names the specific cause/effect pair and the labels that identify the same
  # thing — which is also why they are enumerated rather than generic: a blanket
  # severity rule cannot express "this outage explains that symptom".

  # A backend that is down explains every symptom measured through the backend.
  - source_matchers: ['alertname="BackendAPIDown"']
    target_matchers: ['alertname=~"APIHighErrorRate|APIErrorRateElevated|APILatencyP95High|SLOErrorBudgetFastBurn|SLOErrorBudgetSlowBurn|BackendMetricsMissing"']

  # So does an unreachable one, from the probe's side.
  - source_matchers: ['alertname="ProbeSignalMissing"']
    target_matchers: ['alertname=~"SLOErrorBudgetFastBurn|SLOErrorBudgetSlowBurn|SLOErrorBudgetLow|SLOErrorBudgetExhausted"']

  # A database that is down explains slow queries, idle transactions and connection
  # pressure. Paging on all four is how an operator learns to ignore the channel.
  - source_matchers: ['alertname="TimescaleDBDown"']
    target_matchers: ['alertname=~"SlowDatabaseQueries|IdleInTransactionBackends|DatabaseConnectionsNearLimit"']

  # A missing instrument explains the silence of everything built on it. Without this,
  # DatabaseMetricsMissing and TimescaleDBDown page together for one cause.
  - source_matchers: ['alertname="DatabaseMetricsMissing"']
    target_matchers: ['alertname=~"TimescaleDBDown|SlowDatabaseQueries|IdleInTransactionBackends|DatabaseConnectionsNearLimit"']

  - source_matchers: ['alertname="HostMetricsMissing"']
    target_matchers: ['alertname=~"DiskSpaceCritical|HighMemoryUsage"']

  # Escalation pairs: the critical tier of a threshold suppresses its warning tier, for
  # the SAME object. `equal` is what makes it the same object — without it, a critical
  # alert on one volume would silence the warning on every other.
  - source_matchers: ['alertname="PersistentVolumeCritical"']
    target_matchers: ['alertname="PersistentVolumeFillingUp"']
    equal: ['namespace', 'persistentvolumeclaim']

  - source_matchers: ['alertname="IngressCertificateExpiringCritical"']
    target_matchers: ['alertname="IngressCertificateExpiringSoon"']
    equal: ['instance']

  - source_matchers: ['alertname="EdgeAgentCertExpiringSoon"']
    target_matchers: ['alertname="EdgeAgentCertExpiryApproaching"']
    equal: ['agent_id']

  # An agent that is not reachable explains its stale buffer and heartbeat gauges.
  - source_matchers: ['alertname="EdgeAgentUnreachable"']
    target_matchers: ['alertname=~"EdgeAgentOffline|EdgeAgentBufferHigh|EdgeBufferStatsStale"']
    equal: ['agent_id']
