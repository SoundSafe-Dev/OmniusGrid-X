global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'opsgrid@factory.local'
  smtp_auth_username: ''
  smtp_auth_password: ''

# Route alerts based on severity
templates:
- '/etc/alertmanager/template/*.tmpl'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'
  routes:
    # Critical alerts go to PagerDuty/SMS
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true

    # High severity to Slack #opsgrid-alerts
    - match:
        severity: high
      receiver: 'slack-high'

    # Warning: actionable operational signals (elevated API error rate,
    # unhandled-exception spikes, ingestion lag, notification/error-tracker
    # delivery failing). ~11 alert rules use this severity; without a route they
    # matched nothing and fell through to the general catch-all receiver instead
    # of the alerts channel. Route to the same #opsgrid-alerts as high.
    - match:
        severity: warning
      receiver: 'slack-high'

    # Medium severity to Slack #opsgrid-info
    - match:
        severity: medium
      receiver: 'slack-medium'

    # Low severity - log only (no noise)
    - match:
        severity: low
      receiver: 'null'

    # FS-784. The dead-man's switch. `DeadMansSwitch` fires permanently and on purpose;
    # it must NOT reach a human channel, and it must not fall through to the catch-all,
    # which would post to #opsgrid-general every repeat_interval forever.
    #
    # Its value is entirely in the negative: an external watchdog (a cron on different
    # infrastructure, or a hosted heartbeat service) watches for this notification to
    # STOP. Every other rule in alerts.yml goes quiet when Prometheus dies, which is
    # indistinguishable from a healthy system — this is the one signal whose silence
    # means something.
    #
    # `repeat_interval` is short because the watchdog's own dead-time is bounded by it.
    - match:
        severity: none
      receiver: 'watchdog'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m

receivers:
  - name: 'default'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#opsgrid-general'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  - name: 'null'

  # FS-784. Point this at the external heartbeat URL for the environment (Dead Man's
  # Snitch, Healthchecks.io, or a self-hosted watchdog). Left as a webhook with no URL
  # in the repository because the endpoint is per-environment and secret-bearing; the
  # deploy-time templating that resolves ${SLACK_WEBHOOK_URL} resolves this too.
  - name: 'watchdog'
    webhook_configs:
      - url: '${WATCHDOG_HEARTBEAT_URL}'
        send_resolved: false

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .CommonAnnotations.summary }}'
        severity: critical

  - name: 'slack-high'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#opsgrid-alerts'
        title: '⚠️ HIGH: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        send_resolved: true

  - name: 'slack-medium'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#opsgrid-info'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: false

inhibit_rules:
  # If critical alert fires, suppress lower severity for same issue
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'high'
    equal: ['alertname', 'cluster', 'service']

  - source_match:
      severity: 'high'
    target_match:
      severity: 'medium'
    equal: ['alertname', 'cluster', 'service']
