# promtool unit tests for the edge-agent alert group. Run from infra/prometheus/:
#   promtool test rules tests/edge_alerts_test.yml
#
# WHY THIS FILE EXISTS (FS-498). `EdgeAgentBufferHigh` (alerts.yml:241) watches
# `edge_agent_buffer_pending`, which `backend/app/services/edge_fleet.py:69` sets from the
# agent's heartbeat. The agent's `_health_snapshot()` returned key names the heartbeat did not
# read, so that field was **0 in every heartbeat ever sent** and the alert could not fire. A
# fleet backing up on disk looked idle.
#
# `promtool check rules` passes on an alert that can never fire — it only parses the
# expression. So the rule was syntactically fine for as long as it was useless, and the thing
# nobody had was a test that drives the series past the threshold and asserts the alert
# appears. That is the only instrument that distinguishes "this rule is well-formed" from
# "this rule works".
#
# FS-497 fixed the producing side. This is the assertion that the consuming side responds.
rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------------
  # A buffer climbing past 5000 fires after the 10m window, and not before it.
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'edge_agent_buffer_pending{agent_id="agent-1",organization_id="org-1"}'
        values: '7321x15'
    alert_rule_test:
      # Held for `for: 10m`, so nothing at 9 minutes.
      - eval_time: 9m
        alertname: EdgeAgentBufferHigh
        exp_alerts: []
      - eval_time: 11m
        alertname: EdgeAgentBufferHigh
        exp_alerts:
          - exp_labels:
              severity: medium
              team: edge
              agent_id: agent-1
              organization_id: org-1
            exp_annotations:
              summary: "Edge agent buffer backing up"
              description: "Agent agent-1 has 7321 messages pending — uplink may be degraded"

  # ---------------------------------------------------------------------------
  # The other direction. A healthy buffer must not fire, or the alert is noise and
  # gets silenced — which is the same outcome as never firing, reached differently.
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'edge_agent_buffer_pending{agent_id="agent-2",organization_id="org-1"}'
        values: '12x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: EdgeAgentBufferHigh
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # Exactly at the threshold. `> 5000` must not fire on 5000 — an off-by-one here
  # would make the alert fire on a buffer that is merely full, not backing up.
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'edge_agent_buffer_pending{agent_id="agent-3",organization_id="org-1"}'
        values: '5000x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: EdgeAgentBufferHigh
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # A buffer that drains before the window closes must not fire. This is what a
  # brief uplink blip looks like, and paging on it teaches people to ignore the alert.
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'edge_agent_buffer_pending{agent_id="agent-4",organization_id="org-1"}'
        values: '9000+0x5 20x10'
    alert_rule_test:
      - eval_time: 11m
        alertname: EdgeAgentBufferHigh
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # EdgeAgentDroppingTelemetry (FS-591). Data that NO LONGER EXISTS — distinct from
  # EdgeAgentBufferHigh, which watches data waiting to send.
  #
  # The counter is cumulative, so the rule uses `increase` over an hour: a fleet that
  # dropped rows last month must not page forever, and a fleet dropping them now must page
  # whatever its historical total. Both directions are asserted below.
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'edge_agent_dropped{agent_id="edge-agent-0"}'
        values: '0+5x70'          # +5 discarded every minute
    alert_rule_test:
      - eval_time: 30m
        alertname: EdgeAgentDroppingTelemetry
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              agent_id: edge-agent-0
            exp_annotations:
              summary: "Agent edge-agent-0 is discarding telemetry"
              description: "150 readings were permanently discarded by edge-agent-0 in the last hour. Unlike buffer_pending (waiting) and dead_lettered (replayable), this data no longer exists anywhere. The buffer sheds its oldest rows when the disk is full — check disk space and uplink health on the device."

  # MUST STAY QUIET: a historical total that is not growing. The case a threshold on the
  # raw gauge gets wrong — an agent that dropped 4,000 readings during an outage last
  # quarter is not an incident today, and an alert that pages about it forever is muted
  # within a day, which is the same as not having one.
  - interval: 1m
    input_series:
      - series: 'edge_agent_dropped{agent_id="edge-agent-1"}'
        values: '4000x70'
    alert_rule_test:
      - eval_time: 30m
        alertname: EdgeAgentDroppingTelemetry
        exp_alerts: []

  # MUST STAY QUIET: a healthy agent that has never dropped anything.
  - interval: 1m
    input_series:
      - series: 'edge_agent_dropped{agent_id="edge-agent-2"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 30m
        alertname: EdgeAgentDroppingTelemetry
        exp_alerts: []
