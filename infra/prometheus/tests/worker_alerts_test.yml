# promtool unit tests for the opsgrid_workers alert group. Run from infra/prometheus/:
#   promtool test rules tests/worker_alerts_test.yml
#
# The rule worth testing here is WorkerStalled's LABEL SCOPING, not its threshold.
# Only the ingestion worker has a bounded idle gap; export/compliance/OTA are
# event-driven and run with staleness disabled, so they publish a heartbeat age that
# grows without limit while nothing is wrong. If the scoping regressed to
# `opsgrid_worker_heartbeat_age_seconds > 600` the rule would page constantly for
# three healthy workers — a broken alert looks identical to a working one until it
# fires, so the negative case is asserted explicitly below.
rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------------
  # Ingestion heartbeat sits at 700s (> 600s) -> fires after the 5m window.
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'opsgrid_worker_heartbeat_age_seconds{worker="ingestion"}'
        values: '700x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: WorkerStalled
        exp_alerts: []          # still inside `for: 5m`
      - eval_time: 6m
        alertname: WorkerStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              worker: ingestion
            exp_annotations:
              summary: "Ingestion worker has not processed a message in over 10 minutes"
              description: "The ingestion worker's last completed unit of work is more than 10 minutes old and its liveness probe has not recovered it. Telemetry is not being persisted and the topic is backing up. Check the pod's restart count, the Redpanda connection, and consumer-group state."
              runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/kafka-consumer-lag.md"

  # ---------------------------------------------------------------------------
  # The negative case that protects the scoping: the three staleness-disabled
  # workers idle far past 600s and must NOT page.
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'opsgrid_worker_heartbeat_age_seconds{worker="export_delivery"}'
        values: '9000x20'
      - series: 'opsgrid_worker_heartbeat_age_seconds{worker="compliance_reports"}'
        values: '9000x20'
      - series: 'opsgrid_worker_heartbeat_age_seconds{worker="ota_rollouts"}'
        values: '9000x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: WorkerStalled
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # A worker's metrics endpoint goes unreachable -> WorkerDown after 5m. An idle
  # worker that is merely quiet stays reachable, so this is distinct from stalled.
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'up{job="opsgrid-workers",worker="export_delivery",instance="export-worker:9109"}'
        values: '1x5 0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: WorkerDown
        exp_alerts: []          # down at 5m, `for: 5m` not yet elapsed
      - eval_time: 12m
        alertname: WorkerDown
        exp_alerts:
          - exp_labels:
              severity: high
              team: platform
              job: opsgrid-workers
              worker: export_delivery
              instance: "export-worker:9109"
            exp_annotations:
              summary: "Worker export_delivery is not reachable"
              description: "Prometheus cannot scrape export-worker:9109 (export_delivery) — the worker process or its health server is down. Whatever queue it drains is not being drained."
              runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/kafka-consumer-lag.md"

  # ---------------------------------------------------------------------------
  # Liveness keeps killing a wedging worker: 6 restarts inside 30m -> fires. This
  # signal only exists because the workers now have probes; before, a wedged
  # worker sat at zero restarts forever.
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{container="ingestion-worker",pod="ingestion-worker-7d9f-x4k2",namespace="omniusgrid"}'
        values: '0+0x5 0+1x35'
    alert_rule_test:
      - eval_time: 40m
        alertname: WorkerCrashLooping
        exp_alerts:
          - exp_labels:
              severity: high
              team: platform
              container: ingestion-worker
              pod: ingestion-worker-7d9f-x4k2
              namespace: omniusgrid
            exp_annotations:
              summary: "Worker ingestion-worker restarting repeatedly"
              description: "ingestion-worker-7d9f-x4k2 has restarted more than twice in 30 minutes. Its liveness probe keeps failing — the worker starts, wedges, and gets killed. Check the container logs from the previous run."
              runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/kafka-consumer-lag.md"

  # ---------------------------------------------------------------------------
  # A single restart (a normal rolling update or one transient failure) must not
  # page — the threshold is >2 in 30m for exactly this reason. The restart has to
  # land INSIDE the 30m lookback that ends at eval_time or increase() sees nothing
  # and the assertion passes without ever exercising the threshold: with the rise
  # at 20m and eval at 40m the window [10m,40m] contains it, so this genuinely
  # discriminates >2 from >0 (verified by mutating the rule).
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{container="export-worker",pod="export-worker-5c8b-q7m1",namespace="omniusgrid"}'
        values: '0x20 1x20'
    alert_rule_test:
      - eval_time: 40m
        alertname: WorkerCrashLooping
        exp_alerts: []
