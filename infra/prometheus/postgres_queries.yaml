# Custom queries for postgres_exporter (FS-779).
#
# WHY THESE ARE DECLARED HERE rather than relying on the exporter's built-in
# collectors. `SlowDatabaseQueries` watched `postgresql_stat_activity_max_tx_duration`
# — a name no exporter has ever produced. The nearest real one is
# `pg_stat_activity_max_tx_duration`, and even that moved between postgres_exporter
# major versions. An alert whose correctness depends on a third party's default
# collector set is one upgrade away from going silently inert, which is the whole
# failure class this sprint is closing.
#
# Defining the query in-repo makes the metric name a fact about this repository:
# the alert and the series that feeds it are now edited in the same change, and
# `test_every_alert_watches_a_series_something_exports` can hold the exporter register
# to something auditable.

pg_stat_activity:
  query: |
    SELECT
      datname,
      COALESCE(EXTRACT(EPOCH FROM MAX(now() - xact_start)), 0) AS max_tx_duration,
      COUNT(*) FILTER (WHERE state = 'active')                 AS active_count,
      COUNT(*) FILTER (WHERE state = 'idle in transaction')    AS idle_in_transaction_count,
      COUNT(*)                                                 AS total_count
    FROM pg_stat_activity
    WHERE datname IS NOT NULL
    GROUP BY datname
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - max_tx_duration:
        usage: "GAUGE"
        description: "Seconds the longest currently-open transaction has been running"
    - active_count:
        usage: "GAUGE"
        description: "Backends in state 'active'"
    - idle_in_transaction_count:
        usage: "GAUGE"
        description: "Backends holding a transaction open while idle"
    - total_count:
        usage: "GAUGE"
        description: "Total backends connected"

# Connection headroom. FS-839 sizes the application pool against this ceiling; without
# the number exported, "how close are we" is unanswerable until it is already an outage.
pg_connections:
  query: |
    SELECT
      (SELECT COUNT(*) FROM pg_stat_activity)                                AS used,
      (SELECT setting::int FROM pg_settings WHERE name = 'max_connections')  AS limit_total
  metrics:
    - used:
        usage: "GAUGE"
        description: "Connections currently established"
    - limit_total:
        usage: "GAUGE"
        description: "Configured max_connections"

# Table growth (FS-817). `audit_logs` has NO retention policy at all — only
# `user_audit_logs` does (`005_data_retention.sql:177`, 7 years for GDPR) — and it is a
# plain table, not a hypertable, so `add_retention_policy` does not apply to it either.
#
# It therefore grows without bound, and until FS-781 nothing anywhere alerted on storage
# exhaustion. The loop closes on itself: unbounded audit growth fills the volume, the audit
# write then fails, and `AuditWriteFailing` is severity CRITICAL. The control that proves
# what happened is the one that ends the system.
#
# Whether to PRUNE it is a live decision rather than an oversight, and it is not ours to
# take silently: migration 069 makes each tenant's rows a hash chain whose verification
# would have to learn that a pruned prefix is a root and not a violation, and OG-AU-004's
# remediation plans `REVOKE UPDATE, DELETE ON audit_logs` — which a retention job
# contradicts. Archive-then-delete reconciles them; that is FS-817's real shape and it needs
# the WORM export first.
#
# What is NOT a decision is being able to see it coming. These series make the growth
# visible while the question is open.
pg_table_growth:
  query: |
    SELECT
      relname AS table_name,
      pg_total_relation_size(c.oid)              AS total_bytes,
      COALESCE(n_live_tup, 0)                    AS live_rows
    FROM pg_class c
    JOIN pg_namespace ns ON ns.oid = c.relnamespace
    LEFT JOIN pg_stat_user_tables s ON s.relid = c.oid
    WHERE ns.nspname = 'public'
      AND c.relkind = 'r'
      AND relname IN (
        'audit_logs', 'user_audit_logs', 'telemetry', 'packml_states',
        'error_events', 'session_messages'
      )
  metrics:
    - table_name:
        usage: "LABEL"
        description: "Table whose growth is tracked"
    - total_bytes:
        usage: "GAUGE"
        description: "Total on-disk size including indexes and TOAST"
    - live_rows:
        usage: "GAUGE"
        description: "Estimated live tuples"
