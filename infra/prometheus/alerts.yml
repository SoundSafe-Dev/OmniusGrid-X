groups:
  - name: opsgrid_critical
    rules:
      # CRITICAL: Database down
      #
      # FS-778. This was `up{job="timescaledb"} == 0`, and there is no scrape job named
      # `timescaledb` in infra/prometheus/prometheus.yml OR in
      # infrastructure/k8s/monitoring/prometheus-config.yml. `up` is synthesised PER
      # TARGET, so with no target the series does not exist and `== 0` matches nothing:
      # the database-down alert was inert in both environments, for the whole life of
      # the file. The comment at prometheus.yml:69-72 records deleting the raw
      # `timescaledb:5432` target — correctly, since it speaks the Postgres wire
      # protocol and not HTTP — without noticing that this alert depended on it.
      #
      # `pg_up` is postgres_exporter's own verdict on whether it could open a
      # connection, which is the question the alert is actually asking.
      - alert: TimescaleDBDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "TimescaleDB is down"
          description: "TimescaleDB has been down for more than 1 minute. All data ingestion is halted."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/deployment/dr-timescaledb-failure.md"

      # CRITICAL: Message broker down
      - alert: RedpandaDown
        expr: up{job="redpanda"} == 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Redpanda message broker is down"
          description: "Redpanda has been down for more than 1 minute. Edge agents are buffering locally."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/deployment/dr-redpanda-failure.md"

      # CRITICAL: Disk space
      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.05
        for: 2m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Disk space critically low"
          description: "{{ $labels.instance }} has less than 5% disk space remaining."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/storage-exhaustion.md"

      # HIGH: Backend API down
      - alert: BackendAPIDown
        expr: up{job="opsgrid-backend"} == 0
        for: 2m
        labels:
          severity: high
          team: backend
        annotations:
          summary: "OpsGrid Backend API is down"
          description: "Backend API has been down for more than 2 minutes. Dashboard inaccessible."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/deployment/dr-backend-crash.md"

      # HIGH: Memory pressure
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.85
        for: 5m
        labels:
          severity: high
          team: infrastructure
        annotations:
          summary: "High memory usage detected"
          description: "{{ $labels.instance }} memory usage is above 85%"
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/storage-exhaustion.md"

  - name: opsgrid_data_quality
    rules:
      # MEDIUM: Data ingestion lag
      - alert: IngestionLagHigh
        expr: redpanda_kafka_consumer_group_lag > 10000
        for: 5m
        labels:
          severity: medium
          team: data
        annotations:
          summary: "High message lag in Redpanda"
          description: "Consumer group lag is over 10,000 messages. Data backfill may be needed."

      # MEDIUM: Asset offline
      - alert: AssetOffline
        expr: |
          (
            time() - opsgrid_asset_last_seen_timestamp_seconds > 300
          )
        for: 5m
        labels:
          severity: medium
          team: operations
        annotations:
          summary: "Asset offline"
          description: "Asset {{ $labels.asset_name }} hasn't been seen for 5 minutes"

      # LOW: Slow queries
      #
      # FS-779. This watched `postgresql_stat_activity_max_tx_duration` — a series no
      # exporter has ever produced, in a stack with no postgres exporter deployed. It
      # was ALSO `rate()` over a gauge, which is meaningless even given the series.
      # Three independent reasons it could not fire, and a passing promtool test the
      # whole time, because promtool hand-writes its inputs.
      #
      # The metric is now defined by this repository in
      # infra/prometheus/postgres_queries.yaml and scraped from postgres-exporter.
      - alert: SlowDatabaseQueries
        expr: max by (datname) (pg_stat_activity_max_tx_duration) > 30
        for: 10m
        labels:
          severity: low
          team: data
        annotations:
          summary: "Slow database queries detected"
          description: "The longest open transaction on {{ $labels.datname }} has been running over 30 seconds."

      # A transaction left open by an idle client holds locks and pins the vacuum
      # horizon. This is the shape that turns a slow endpoint into a table-wide stall.
      - alert: IdleInTransactionBackends
        expr: max by (datname) (pg_stat_activity_idle_in_transaction_count) > 5
        for: 10m
        labels:
          severity: medium
          team: data
        annotations:
          summary: "Backends idle in transaction"
          description: "{{ $value }} backends on {{ $labels.datname }} are holding a transaction open while idle."

      # Connection headroom (FS-839). The HPA scales the backend to 20 replicas against
      # a Postgres default of 100 connections; this is the series that says how close
      # that arithmetic is to the ceiling, before it is an outage.
      - alert: DatabaseConnectionsNearLimit
        expr: pg_connections_used / clamp_min(pg_connections_limit_total, 1) > 0.8
        for: 5m
        labels:
          severity: high
          team: data
        annotations:
          summary: "Postgres connection usage above 80%"
          description: "{{ $value | humanizePercentage }} of max_connections is in use. New backends will be refused at 100%."

  - name: opsgrid_edge_agents
    rules:
      # MEDIUM: Edge agent buffering (network issue)
      - alert: EdgeAgentBuffering
        expr: opsgrid_edge_buffer_messages > 5000
        for: 3m
        labels:
          severity: medium
          team: edge
        annotations:
          summary: "Edge agent buffering high volume"
          description: "Edge agent {{ $labels.agent_id }} has over 5000 buffered messages"

      # LOW: OCR accuracy drop
      - alert: OcrAccuracyLow
        expr: opsgrid_ocr_accuracy < 0.80
        for: 10m
        labels:
          severity: low
          team: edge
        annotations:
          summary: "OCR accuracy below threshold"
          description: "Screen scraper accuracy dropped below 80% on {{ $labels.asset_id }}"

  # Rules on metrics the edge agent actually emits on its /metrics endpoint
  # (edge_collector_* / edge_buffer_*), distinct from the backend-side
  # opsgrid_edge_buffer_messages gauge referenced above.
  - name: opsgrid_edge_collectors
    rules:
      # HIGH: agent unreachable — scrape target down is the fleet-side
      # heartbeat-staleness signal (the agent stopped serving /metrics).
      - alert: EdgeAgentUnreachable
        expr: up{job=~"edge-agent.*|opsgrid-edge-agent"} == 0
        for: 3m
        labels:
          severity: high
          team: edge
        annotations:
          summary: "Edge agent unreachable"
          description: "Agent target {{ $labels.instance }} has not answered scrapes for 3m (crashed, network-partitioned, or metrics disabled)"

      # HIGH: a collector's task is down
      - alert: EdgeCollectorDown
        expr: edge_collector_connection_state == 0
        for: 5m
        labels:
          severity: high
          team: edge
        annotations:
          summary: "Edge collector down"
          description: "Collector for asset {{ $labels.asset_id }} ({{ $labels.collector_type }}) has been down for 5m"

      # HIGH: the collector is alive and the device is not (FS-691).
      #
      # EdgeCollectorDown above cannot catch this. `connection_state` is derived from
      # whether the poll TASK is alive, and a collector polling a device that answers 500
      # forever has a perfectly healthy task — so that gauge reads 1 while the asset has
      # produced nothing for a month. EdgeAgentUnreachable is quiet too (the agent serves
      # /metrics fine), and EdgeBufferGrowing is quiet *because* nothing was collected.
      #
      # `unless` rather than `and`: a collector that has NEVER delivered has no
      # edge_collector_messages_total series at all, so `and` would find nothing to match
      # against and silently never fire — which is exactly the worst case, a device that
      # was broken before anyone looked.
      - alert: EdgeCollectorFailingEveryPoll
        expr: >-
          rate(edge_collector_errors_total[15m]) > 0
          unless rate(edge_collector_messages_total[15m]) > 0
        for: 15m
        labels:
          severity: high
          team: edge
        annotations:
          summary: "Edge collector failing every poll"
          description: "Collector for asset {{ $labels.asset_id }} ({{ $labels.collector_type }}) has been erroring with zero successful readings for 15m — the agent is healthy, the device is not"

      # MEDIUM: store-and-forward buffer growing (upstream/Kafka issue)
      - alert: EdgeBufferGrowing
        expr: edge_buffer_messages > 5000
        for: 3m
        labels:
          severity: medium
          team: edge
        annotations:
          summary: "Edge store-and-forward buffer growing"
          description: "Edge buffer holds {{ $value }} pending messages (upstream likely unavailable)"

      # HIGH: the buffer gauges have stopped being refreshed (FS-694).
      #
      # `edge_buffer_messages` is written by the agent's stats loop, and a gauge is only
      # as honest as its last write: if that loop fails every cycle, the gauge FREEZES at
      # its final value and EdgeBufferGrowing reasons about a number that stopped meaning
      # anything — silenced precisely when the buffer may be growing. Same for the
      # heartbeat's buffer snapshot, so EdgeAgentBufferHigh goes quiet in the same
      # breath. One failing loop mutes both buffer alerts; this is the alert on the loop.
      #
      # The agent stamps the timestamp once at startup, so the series exists even if the
      # loop never succeeds — the absent-series trap EdgeCollectorFailingEveryPoll's
      # `unless` guards against, closed at the source this time. 20m is four report
      # cycles (the loop reports every 5m).
      - alert: EdgeBufferStatsStale
        expr: time() - edge_buffer_stats_last_success_timestamp_seconds > 1200
        for: 5m
        labels:
          severity: high
          team: edge
        annotations:
          summary: "Edge buffer gauges are stale"
          description: "The agent's stats loop has not refreshed the buffer gauges for over 20m — EdgeBufferGrowing and EdgeAgentBufferHigh are reasoning about frozen numbers"

      # MEDIUM: backfill lag high (oldest buffered message getting old)
      - alert: EdgeBackfillLagHigh
        expr: edge_buffer_backfill_lag_seconds > 3600
        for: 10m
        labels:
          severity: medium
          team: edge
        annotations:
          summary: "Edge backfill lag high"
          description: "Oldest pending edge message is over 1h old ({{ $value }}s)"

      # HIGH: messages being dead-lettered (delivery failing permanently)
      - alert: EdgeDeadLettering
        expr: increase(edge_buffer_dead_lettered_total[15m]) > 0
        for: 0m
        labels:
          severity: high
          team: edge
        annotations:
          summary: "Edge messages dead-lettered"
          description: "{{ $value }} edge messages exhausted retries and were dead-lettered in the last 15m"

      # MEDIUM: buffer dropping oldest messages to stay under the size cap
      - alert: EdgeBufferDropping
        expr: increase(edge_buffer_dropped_total[15m]) > 0
        for: 0m
        labels:
          severity: medium
          team: edge
        annotations:
          summary: "Edge buffer dropping messages (size cap)"
          description: "{{ $value }} oldest edge messages pruned to stay under the buffer size cap"

      # HIGH: buffer deleting undelivered telemetry for age (FS-458).
      #
      # Higher severity than the size-cap drop above, despite being the same
      # kind of loss, because of what causes it: expiry means the agent has
      # been unable to reach the cloud for longer than its retention window.
      # The size cap trips on a busy device; this one trips on a device that
      # has been cut off long enough to start losing what it buffered.
      - alert: EdgeBufferExpiring
        expr: increase(edge_buffer_expired_total[15m]) > 0
        for: 0m
        labels:
          severity: high
          team: edge
        annotations:
          summary: "Edge buffer deleting undelivered messages (retention)"
          description: "{{ $value }} edge messages passed the retention window without ever being delivered — the agent has been disconnected longer than it can buffer for"

      # MEDIUM: sustained collector error rate
      - alert: EdgeCollectorErrors
        expr: sum by (asset_id, collector_type) (rate(edge_collector_errors_total[5m])) > 0.1
        for: 10m
        labels:
          severity: medium
          team: edge
        annotations:
          summary: "Edge collector error rate elevated"
          description: "Collector {{ $labels.asset_id }} ({{ $labels.collector_type }}) erroring at {{ $value }}/s"

  - name: opsgrid_edge_fleet
    rules:
      # HIGH: an agent has stopped heartbeating (FS-695).
      #
      # This watched `edge_agent_up == 0` — and NOTHING WRITES 0. The gauge is set only
      # when a heartbeat arrives (`edge_fleet.update_fleet_metrics`, whose single caller
      # hardcodes "online", correctly: a heartbeat arriving means online). An agent that
      # stops heartbeating freezes at 1, so this HIGH alert could never fire in
      # production; its unit test passed by hand-writing a series production cannot
      # produce. Same class as EdgeBufferStatsStale: alert on the timestamp's age,
      # which grows the moment the agent goes quiet.
      #
      # The restart gap is CLOSED (FS-704): edge_fleet_sweep re-derives both gauges
      # from edge_agent_status.last_seen — which survives restarts — every 60s, arriving
      # with its own failure counter and health check per FS-693. An agent that died
      # before a backend restart alerts within one sweep interval of startup.
      - alert: EdgeAgentOffline
        expr: time() - edge_agent_last_heartbeat_timestamp_seconds > 300
        for: 5m
        labels:
          severity: high
          team: edge
        annotations:
          summary: "Edge agent offline"
          description: "Agent {{ $labels.agent_id }} has not sent a healthy heartbeat for 5m"

      # MEDIUM: store-and-forward buffer backing up (uplink struggling)
      - alert: EdgeAgentBufferHigh
        expr: edge_agent_buffer_pending > 5000
        for: 10m
        labels:
          severity: medium
          team: edge
        annotations:
          summary: "Edge agent buffer backing up"
          description: "Agent {{ $labels.agent_id }} has {{ $value }} messages pending — uplink may be degraded"

      # HIGH: agent certificate close to expiry (rotation not keeping up)
      - alert: EdgeAgentCertExpiringSoon
        expr: edge_agent_cert_expiry_seconds < 172800
        for: 15m
        labels:
          severity: high
          team: edge
        annotations:
          summary: "Edge agent certificate expiring"
          description: "Agent {{ $labels.agent_id }} cert expires in < 2 days; rotation may be failing"
  - name: opsgrid_api
    rules:
      # CRITICAL: 5xx error ratio over 5% sustained — likely a broken deploy or
      # downstream outage. Powered by the profiling middleware request counter.
      # FS-774. These three read `opsgrid_http_requests_total`, whose ONLY write site is
      # app/middleware/profiling.py:239 — five lines below `if not PROFILING_ENABLED:
      # return`. That flag defaults to False (profiling.py:60) and is set in no
      # environment: not compose, not any kustomize overlay, not CI. The counter has
      # therefore never been incremented anywhere, prometheus_client omits a metric
      # with no children from /metrics entirely, and APIHighErrorRate — severity
      # CRITICAL — has never been able to fire.
      #
      # The existing exporter sweep passed all three because it collects metric names
      # from `Counter(...)` constructor calls: it answers "is this DECLARED", which a
      # disabled feature flag leaves perfectly true. backend/tests/
      # test_no_alert_rides_on_a_disabled_feature_flag.py now asks the other half.
      #
      # Repointed at `http_requests_total`, written unconditionally by
      # RequestContextMiddleware — which also collapses the two parallel HTTP metric
      # families onto the one the SLO rules already use, so an API alert and the SLO
      # can no longer disagree about what a 5xx is.
      - alert: APIHighErrorRate
        expr: |
          sum(rate(http_requests_total{status_class="5xx"}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API 5xx error rate above 5%"
          description: "More than 5% of API requests are returning 5xx over the last 5 minutes. Check Error Triage (/admin/errors) for the dominant exception."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/error-triage.md"

      # WARNING: elevated-but-not-critical error ratio over a longer window.
      - alert: APIErrorRateElevated
        expr: |
          sum(rate(http_requests_total{status_class="5xx"}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.01
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "API 5xx error rate above 1%"
          description: "API 5xx error rate has exceeded 1% for 15 minutes. Investigate via Error Triage before it escalates."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/error-triage.md"

      # WARNING: a spike in unhandled exceptions specifically (tracker counter).
      - alert: APIUnhandledExceptionSpike
        expr: sum(rate(opsgrid_unhandled_exceptions_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Unhandled exception spike"
          description: "More than 1 unhandled exception per second over 5 minutes. Open Error Triage to identify the fingerprint."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/error-triage.md"

      # WARNING: p95 latency regression.
      - alert: APILatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "API p95 latency above 2s"
          description: "95th-percentile API latency has exceeded 2 seconds for 10 minutes."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/error-triage.md"

  # FS-107: the subsystems FS-105 instrumented (notifications, predictive RUL,
  # digital-twin optimizer, historian, error-tracker, ingestion lag) all emit
  # opsgrid_* metrics but had ZERO alert coverage — a metric no one alerts on is
  # a dashboard nobody watches. These close that gap. Ratios/increase() naturally
  # produce no series when a subsystem is idle, so none of these fire at rest.
  - name: opsgrid_subsystems
    rules:
      # WARNING: notification delivery is failing for a sustained share of
      # attempts — subscribers (webhooks/email) are silently not getting alerts.
      - alert: NotificationDeliveryFailing
        expr: |
          sum(rate(opsgrid_notification_dispatches_total{status="failure"}[10m]))
            / sum(rate(opsgrid_notification_dispatches_total[10m])) > 0.2
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Notification delivery failure rate above 20%"
          description: "More than 20% of notification dispatches have failed over 10 minutes. Downstream alerts (webhook/email/SMS) may not be reaching operators. Check the notification channel config and target reachability."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/subsystems.md#notifications"

      # WARNING: delivery latency regression per channel (p95).
      - alert: NotificationDeliverySlow
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, channel) (rate(opsgrid_notification_delivery_duration_seconds_bucket[10m]))
          ) > 10
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Notification p95 delivery latency above 10s"
          description: "95th-percentile delivery latency for channel {{ $labels.channel }} has exceeded 10s for 10 minutes. A slow channel backs up the dispatcher and delays every subsequent alert."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/subsystems.md#notifications"

      # WARNING: a surge in high/critical low-RUL alerts means many assets are
      # predicted to fail soon — could be a real fleet event OR a degradation in
      # the health-index feed. Either way an operator should look.
      - alert: PredictiveMaintenanceLowRULSurge
        expr: sum(increase(opsgrid_rul_low_rul_alerts_total{risk_level=~"high|critical"}[1h])) > 5
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Surge in high/critical low-RUL predictions"
          description: "More than 5 high/critical low-RUL alerts were raised in the last hour. Review the Predictive Maintenance board — this is either a genuine cluster of aging assets or a bad health-index/telemetry feed skewing the estimator."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/subsystems.md#predictive-maintenance"

      # WARNING: digital-twin optimization runs are slow (p95), starving the
      # recommendation queue.
      # NB: the histogram's largest finite bucket is 10s (next is 30s);
      # histogram_quantile never returns above the largest FINITE le, so the
      # threshold must sit below it (>10 lands in the 30s bucket) to be firable.
      - alert: DigitalTwinOptimizeSlow
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(opsgrid_twin_optimize_run_duration_seconds_bucket[15m]))
          ) > 10
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Digital-twin optimize p95 runtime above 10s"
          description: "95th-percentile twin optimization runtime has exceeded 10s for 15 minutes. The candidate sweep is likely too wide or the baseline pull is slow; recommendations will lag."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/subsystems.md#digital-twin"

      # WARNING: historian queries are slow (p95, per granularity) — the
      # dashboards and exports that read from them will feel it.
      # NB: the histogram's largest finite bucket is 5s; histogram_quantile
      # caps at the largest finite le, so >2.5 (lands in the 5s bucket) is the
      # firable threshold — a p95 sitting in the top bucket is the signal.
      - alert: HistorianQueriesSlow
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, granularity) (rate(opsgrid_historian_query_duration_seconds_bucket[10m]))
          ) > 2.5
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Historian p95 query latency above 2.5s"
          description: "95th-percentile historian query latency at granularity {{ $labels.granularity }} has exceeded 2.5s for 10 minutes. Check continuous-aggregate freshness and chunk pruning on TimescaleDB."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/subsystems.md#historian"

      # CRITICAL: the error tracker itself is dropping occurrences at capacity —
      # this is an observability blind spot (we stop seeing the errors we exist
      # to surface), so it's treated more urgently than the subsystem warnings.
      - alert: ErrorTrackerDropping
        expr: increase(opsgrid_error_tracker_dropped_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Error tracker is dropping occurrences"
          description: "The error-tracking aggregator has dropped events at capacity in the last 15 minutes — Error Triage is now under-counting. Investigate the flush pipeline before trusting error dashboards."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/subsystems.md#error-tracker"

      # WARNING: flush cycles are failing (batches re-queued) — precursor to
      # ErrorTrackerDropping if the backlog keeps growing.
      - alert: ErrorTrackerFlushFailing
        expr: increase(opsgrid_error_tracker_flush_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Error tracker flush cycles are failing"
          description: "One or more error-tracker flush cycles failed in the last 15 minutes (batch re-queued). Usually the errors sink (DB) is unreachable or slow; fix before the pending buffer hits capacity and drops."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/subsystems.md#error-tracker"

      # WARNING: the pending-fingerprint buffer isn't draining.
      - alert: ErrorTrackerBacklog
        expr: opsgrid_error_tracker_pending_fingerprints > 500
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Error tracker backlog above 500 fingerprints"
          description: "The error-tracker has held more than 500 distinct pending fingerprints for 10 minutes — flush is not keeping up with intake. Check ErrorTrackerFlushFailing and the errors sink."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/subsystems.md#error-tracker"

      # WARNING: application-measured ingestion lag per topic. Complements the
      # broker-side IngestionLagHigh (consumer-group lag) with the wall-clock lag
      # the ingestion worker actually observes between event time and write time.
      - alert: IngestionLagHighApp
        expr: max by (topic) (opsgrid_ingestion_lag_seconds) > 120
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Ingestion lag above 2 minutes"
          description: "Topic {{ $labels.topic }} has an event-to-write lag above 120s for 10 minutes. Telemetry is landing late; check the ingestion worker throughput and TimescaleDB write path."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/subsystems.md#ingestion"

  # Platform/infra alerts for the enterprise stacks (HA database, worker
  # autoscaling, backups). Metrics come from the CloudNativePG exporter and from
  # kube-state-metrics — both are only present once those stacks are deployed, so
  # these rules simply stay silent until then (no series -> no firing).
  - name: opsgrid_platform
    rules:
      # CRITICAL: a CloudNativePG standby has fallen far behind the primary. Above
      # 30s of replication lag a failover would lose that much data — the whole
      # point of synchronous replication is defeated.
      - alert: CNPGReplicationLagHigh
        expr: max by (cnpg_cluster) (cnpg_pg_replication_lag) > 30
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Postgres replication lag above 30s"
          description: "CloudNativePG cluster {{ $labels.cnpg_cluster }} has a standby lagging the primary by more than 30s for 5 minutes. A failover now would lose data; check standby health, network, and write volume."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/infrastructure/k8s/database-ha/README.md#failover--recovery"

      # HIGH: the CNPG metrics exporter for an instance is down — we are blind to
      # that instance's replication/health.
      - alert: CNPGInstanceExporterDown
        expr: cnpg_collector_up == 0
        for: 10m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "CloudNativePG exporter down on {{ $labels.pod }}"
          description: "The CloudNativePG metrics collector on {{ $labels.pod }} has been down for 10 minutes — replication and health metrics for this instance are missing. Check the instance pod."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/infrastructure/k8s/database-ha/README.md"

      # CRITICAL: no successful nightly database backup within the expected window
      # (daily schedule -> allow 26h before alerting). WITHOUT backups a data-loss
      # event is unrecoverable, so this is the highest-signal infra alert.
      - alert: DatabaseBackupStale
        expr: time() - max(kube_cronjob_status_last_successful_time{cronjob=~".*db-backup"}) > 93600
        for: 15m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "No successful database backup in over 26h"
          description: "The db-backup CronJob has not completed successfully in more than 26 hours. Restores would fall back to an older backup (higher RPO). Check the CronJob and the backup bucket credentials."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/database-backup-restore.md"

      # HIGH: the most recent backup Job actually failed (distinct from "stale" —
      # this catches an active, repeating failure sooner).
      - alert: DatabaseBackupJobFailed
        expr: max(kube_job_status_failed{job_name=~".*db-backup.*"}) > 0
        for: 5m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "Database backup Job failed"
          description: "A db-backup Job reported a failed pod. The nightly logical backup did not complete; check the Job logs and DatabaseBackupStale."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/database-backup-restore.md"

      # WARNING: a KEDA-autoscaled worker has been pinned at its max replica count
      # for a sustained period — it can't keep up and the queue is likely growing.
      - alert: WorkerAutoscalerAtMax
        expr: |
          kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler=~"keda-hpa-.*"}
            >= on (horizontalpodautoscaler, namespace)
          kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler=~"keda-hpa-.*"}
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Worker {{ $labels.horizontalpodautoscaler }} pinned at max replicas"
          description: "{{ $labels.horizontalpodautoscaler }} has sat at its maximum replica count for 15 minutes — sustained backlog it cannot drain. Raise maxReplicaCount (and the topic's partition count) or investigate the slowdown."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/infrastructure/k8s/autoscaling/README.md#tuning"

  # Background workers. Every rule here was unwritable before the workers grew a
  # health/metrics endpoint (app/workers/health_server.py): they served no metrics,
  # so there was no `up` target to be down and no heartbeat to go stale, and their
  # Deployments carried no probes, so a pod was trivially "Ready" forever and never
  # restarted. These alerts are the monitoring half of that change.
  # Security + realtime signals. Every rule here needed a METRIC added first
  # (app/core/http_metrics.py): auth failures and WebSocket lifecycle events were
  # only structlog lines, which Prometheus never sees. Writing these rules against
  # the old code would have produced alerts that lint green and can never fire.
  - name: opsgrid_security
    rules:
      # HIGH: a sustained burst of failed logins. Rate-based, not a raw count, so
      # it scales with fleet size instead of firing on a busy morning.
      - alert: AuthBruteForceSuspected
        expr: sum(rate(opsgrid_auth_attempts_total{outcome="failure"}[5m])) > 5
        for: 5m
        labels:
          severity: high
          team: security
        annotations:
          summary: "Sustained authentication failures"
          description: "More than 5 failed logins per second over 5 minutes. The metric is deliberately not labelled by user or IP (that would let an enumeration attack create unbounded series), so identify the source from the access logs or the audit trail."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/error-triage.md"

      # WARNING: most login attempts are failing. Catches a broken auth dependency
      # — an expired SSO signing key, an unreachable Redis behind the limiter —
      # which AuthBruteForceSuspected would miss on a low-traffic deployment
      # because the absolute rate stays small.
      - alert: AuthFailureRatioHigh
        expr: |
          sum(rate(opsgrid_auth_attempts_total{outcome="failure"}[10m]))
            /
          clamp_min(sum(rate(opsgrid_auth_attempts_total[10m])), 0.001)
            > 0.5
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Over half of login attempts are failing"
          description: "The failure RATIO exceeds 50% for 10 minutes. On a quiet deployment a broken auth path produces a low absolute failure rate, so the ratio is what surfaces it. Check the SSO signing keys, the auth limiter's Redis, and recent auth deploys."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/error-triage.md"

      # HIGH: a client certificate is close to expiry. `edge_agent_cert_expiring`
      # already covers the 2-day emergency; this is the 14-day window where
      # rotation can still be scheduled rather than scrambled.
      - alert: EdgeAgentCertExpiryApproaching
        expr: min by (agent_id) (edge_agent_cert_expiry_seconds) < 1209600
        for: 1h
        labels:
          severity: warning
          team: edge
        annotations:
          summary: "Edge agent certificate expires within 14 days"
          description: "Agent {{ $labels.agent_id }} has under 14 days of certificate validity. Rotate now; at under 2 days EdgeAgentCertExpiringSoon escalates this to high."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/scripts/certificate-rotation.sh"

  # Realtime delivery. The dashboard and alarm views are WebSocket-driven, so a
  # silent collapse here looks like "nothing is happening in the factory".
  - name: opsgrid_realtime
    rules:
      # HIGH: connections are being torn down abnormally rather than closed by the
      # client. A ratio, because a busy system produces clean closes constantly and
      # an absolute count of disconnects is meaningless.
      - alert: WebSocketDropRateHigh
        expr: |
          sum(rate(opsgrid_websocket_events_total{event="disconnect_error"}[10m]))
            /
          clamp_min(
            sum(rate(opsgrid_websocket_events_total{event=~"disconnect_.*"}[10m])),
            0.001
          ) > 0.25
        for: 10m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "Over a quarter of WebSocket closes are abnormal"
          description: "More than 25% of WebSocket disconnects over 10 minutes ended in an error rather than a clean client close. Live telemetry, alarm and PackML updates are degrading. Check backend logs for websocket_closed_with_error and the ingress idle timeout."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/subsystems.md"

  - name: opsgrid_workers
    rules:
      # CRITICAL: the ingestion worker has stopped consuming. Its liveness probe
      # already restarts the pod at 300s of heartbeat age, so reaching 600s means
      # restarting is NOT curing it — a crash loop, an unreachable broker, or a
      # consumer-group problem. The probe handles the transient case; this alert is
      # for when the probe's remedy has failed, which is the case that needs a human.
      #
      # Scoped to `worker="ingestion"` on purpose. It is the only worker with a
      # bounded idle gap (continuous telemetry); export/compliance/OTA are
      # event-driven, run with staleness disabled, and can legitimately idle for
      # hours — alerting on their heartbeat age would page for nothing.
      - alert: WorkerStalled
        expr: opsgrid_worker_heartbeat_age_seconds{worker="ingestion"} > 600
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Ingestion worker has not processed a message in over 10 minutes"
          description: "The ingestion worker's last completed unit of work is more than 10 minutes old and its liveness probe has not recovered it. Telemetry is not being persisted and the topic is backing up. Check the pod's restart count, the Redpanda connection, and consumer-group state."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/kafka-consumer-lag.md"

      # HIGH: the ingestion worker is dead-lettering telemetry (FS-464).
      #
      # A dead-lettered message was ACCEPTED from a device and acknowledged, so the
      # agent's buffer has already dropped its copy. The DLQ makes it replayable, but
      # nothing about it is visible until someone reads the topic — and the equivalent
      # on the agent side has had a counter and an alert since FS-458. The platform
      # was watching the edge's data loss and not its own.
      #
      # HIGH rather than critical: the data is preserved and replayable. Distinct from
      # the alert below, where it is not.
      - alert: IngestionDeadLettering
        expr: increase(opsgrid_ingestion_dead_lettered_total[15m]) > 0
        for: 0m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "Ingestion worker is dead-lettering telemetry"
          description: "{{ $value }} messages from {{ $labels.source_topic }} could not be processed in the last 15m and were published to the DLQ. The data is replayable but is not in the database. Check the DLQ topic for the failure reason."

      # CRITICAL: the dead-letter publish itself failed, so the message is neither
      # processed nor preserved and its offset advances regardless. This is telemetry
      # leaving the system: the device has been told the data was received, its buffer
      # has dropped it, and nothing in the cloud holds it.
      # A side effect on the ingest path is failing and being swallowed (FS-537).
      #
      # Swallowing is correct: ingestion must not stop because a WebSocket publish failed
      # or an OEE counter could not be updated. What was missing is that nothing counted
      # them, so a rule failing on every message wrote one log line per message and
      # aggregated nowhere.
      #
      # `alarm_rule_evaluation` is the label that matters most. Its failure means
      # server-side alarm rules are not firing — telemetry still flows, dashboards still
      # update, and the alerting is off, which is a condition an operator otherwise
      # discovers by noticing an alarm that never arrived.
      # CRITICAL: an audit row could not be written (FS-536).
      #
      # The middleware continues, correctly — an audit write must not fail a user's
      # request. But this repository has already shipped a period where EVERY audit
      # insert failed on an INET/VARCHAR mismatch and the handler swallowed it, so "the
      # audit trail has been silently empty on real deployments while every write appeared
      # to succeed" (`db/models.py:1561-1567`). The mismatch was fixed; the invisibility
      # was not, until this counter and this rule.
      #
      # Critical rather than high: an audit gap is a compliance finding, it cannot be
      # reconstructed after the fact, and every minute it continues is unrecoverable.
      # Telemetry the edge agent permanently discarded (FS-591).
      #
      # DISTINCT FROM EdgeAgentBufferHigh, which watches data WAITING to send. This watches
      # data that no longer exists: the store-and-forward buffer sheds its oldest rows on a
      # full disk, those readings are gone from the device, and they never reached the
      # cloud. FS-504 made the agent count them; nothing consumed the count.
      #
      # `increase` over an hour rather than a threshold on the gauge, because the value is
      # cumulative — a fleet that dropped rows last month should not page forever, and a
      # fleet dropping them now should page whatever the historical total.
      - alert: EdgeAgentDroppingTelemetry
        expr: increase(edge_agent_dropped[1h]) > 0
        for: 0m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Agent {{ $labels.agent_id }} is discarding telemetry"
          description: "{{ $value }} readings were permanently discarded by {{ $labels.agent_id }} in the last hour. Unlike buffer_pending (waiting) and dead_lettered (replayable), this data no longer exists anywhere. The buffer sheds its oldest rows when the disk is full — check disk space and uplink health on the device."

      - alert: AuditWriteFailing
        expr: increase(opsgrid_audit_write_failed_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Audit rows are not being written ({{ $labels.action }})"
          description: "{{ $value }} audit writes for action {{ $labels.action }} failed in the last 10m. Requests are still succeeding — this is deliberate — so the only symptom is a gap in the audit trail, which cannot be reconstructed later. Check the audit_logs schema and the middleware log for audit_log_failed."

      - alert: IngestionSideEffectFailing
        expr: increase(opsgrid_ingestion_side_effect_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "Ingest side effect {{ $labels.side_effect }} is failing"
          description: "{{ $value }} failures of {{ $labels.side_effect }} in the last 15m. Telemetry is still being stored — this path is deliberately non-fatal — but the side effect is not happening. If this is alarm_rule_evaluation, server-side alarm rules are NOT firing."

      - alert: IngestionDataLost
        expr: increase(opsgrid_ingestion_dead_letter_failed_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Ingestion worker LOST telemetry — the dead-letter publish also failed"
          description: "{{ $value }} messages from {{ $labels.source_topic }} were dropped entirely: unprocessable, and the DLQ publish failed too. The sending device has already been acknowledged and has discarded its copy. Check broker reachability and the DLQ topic's existence."

      # HIGH: a worker's metrics endpoint is unreachable — either the process is
      # gone or its health server never came up. Distinct from WorkerStalled, which
      # requires a REACHABLE worker reporting a stale heartbeat.
      - alert: WorkerDown
        expr: up{job="opsgrid-workers"} == 0
        for: 5m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "Worker {{ $labels.worker }} is not reachable"
          description: "Prometheus cannot scrape {{ $labels.instance }} ({{ $labels.worker }}) — the worker process or its health server is down. Whatever queue it drains is not being drained."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/kafka-consumer-lag.md"

      # HIGH: a worker pod is restarting repeatedly. Only observable now that the
      # workers have liveness probes — before, a wedged worker sat at 0 restarts
      # forever, so a flat restart count meant nothing.
      - alert: WorkerCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{container=~".*worker"}[30m]) > 2
        for: 5m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "Worker {{ $labels.container }} restarting repeatedly"
          description: "{{ $labels.pod }} has restarted more than twice in 30 minutes. Its liveness probe keeps failing — the worker starts, wedges, and gets killed. Check the container logs from the previous run."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/kafka-consumer-lag.md"

  # ── The instrument itself (FS-771/781/782/783/784) ────────────────────────────────
  #
  # Every rule above answers "is the system unwell". None of them answered "am I still
  # able to tell", and the two are indistinguishable from the outside: a Prometheus
  # that has stopped scraping, an exporter that has died, and a perfectly healthy
  # system all produce exactly the same thing — no firing alerts.
  #
  # That is not hypothetical here. This sprint found NINE rules that could never fire,
  # three of them severity `critical`, and every one of them had been "passing" for
  # months. `absent()` is the only construct that distinguishes silence from health.
  - name: opsgrid_instrument_health
    rules:
      # The availability SLI's own input. If this goes, the SLO is uncomputable and
      # every burn-rate rule below it goes quiet rather than red.
      - alert: ProbeSignalMissing
        expr: absent(probe_success{job="blackbox-http", probe_target="backend_ready"})
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "The availability probe is not reporting"
          description: >-
            No probe_success series for backend_ready. Availability cannot be computed,
            so the SLO burn-rate alerts are silent — which is NOT the same as healthy.
            Check the blackbox-exporter target before trusting any SLO number.
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/README.md"

      - alert: BackendMetricsMissing
        expr: absent(http_requests_total)
        for: 10m
        labels:
          severity: high
          team: backend
        annotations:
          summary: "The backend is exporting no request metrics"
          description: >-
            http_requests_total is absent. Either the backend is down (check
            BackendAPIDown / ProbeSignalMissing) or /metrics has stopped being scraped.
            The error-ratio half of the SLI is blind until this returns.

      - alert: HostMetricsMissing
        expr: absent(node_filesystem_avail_bytes)
        for: 15m
        labels:
          severity: high
          team: infrastructure
        annotations:
          summary: "node-exporter is not reporting"
          description: >-
            DiskSpaceCritical and HighMemoryUsage depend on node_* and cannot fire
            while this is absent. Both spent their whole lives in exactly this state.

      - alert: DatabaseMetricsMissing
        expr: absent(pg_up)
        for: 15m
        labels:
          severity: high
          team: data
        annotations:
          summary: "postgres-exporter is not reporting"
          description: "TimescaleDBDown, SlowDatabaseQueries and DatabaseConnectionsNearLimit are all blind while this is absent."

      # FS-784. If Prometheus or Alertmanager stops, nothing above can page — including
      # the rules that would tell you. A dead-man's switch inverts that: this alert
      # fires CONSTANTLY by design, is routed to a null receiver, and its ABSENCE at
      # the far end is what an external watchdog checks.
      - alert: DeadMansSwitch
        expr: vector(1)
        labels:
          severity: none
          team: platform
        annotations:
          summary: "Alerting pipeline heartbeat"
          description: >-
            Always firing, on purpose. Routed to the `watchdog` receiver in
            alertmanager.yml. If this stops arriving, the monitoring stack itself is
            down and every other alert in this file is silent for the wrong reason.

      - alert: AlertmanagerUnreachable
        expr: |
          max_over_time(prometheus_notifications_alertmanagers_discovered[5m]) < 1
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Prometheus has no Alertmanager"
          description: "Rules still evaluate, but nothing can be delivered. Every page is being dropped."

      - alert: AlertNotificationsFailing
        expr: rate(prometheus_notifications_errors_total[5m]) > 0
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Alert notifications are failing to send"
          description: "Prometheus is producing alerts that Alertmanager is not accepting."

      - alert: PrometheusRuleEvaluationFailing
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "Prometheus rule evaluations are failing"
          description: "A recording or alerting rule is erroring; the series it produces are stale or absent."

      - alert: PrometheusTargetsDown
        expr: |
          count by (job) (up == 0) > 0
        for: 10m
        labels:
          severity: medium
          team: platform
        annotations:
          summary: "Scrape targets are down for job {{ $labels.job }}"
          description: "{{ $value }} target(s) in job {{ $labels.job }} have been unscrapable for 10 minutes."

      # FS-794. Cardinality is how a Prometheus dies, and it dies during the incident
      # that produced the labels.
      - alert: PrometheusCardinalityHigh
        expr: prometheus_tsdb_head_series > 1500000
        for: 30m
        labels:
          severity: medium
          team: platform
        annotations:
          summary: "Prometheus head series above 1.5M"
          description: "{{ $value | humanize }} active series. Investigate a new high-cardinality label before ingestion stalls."

  # ── Storage, certificates, and the degraded mode nothing watched ──────────────────
  - name: opsgrid_capacity_and_trust
    rules:
      # FS-781. kube-state-metrics IS scraped (prometheus-config.yml:33) and until now
      # NO rule used it, so nothing anywhere alerted on storage exhaustion. Combined
      # with FS-817 — audit_logs has no retention policy at all — the loop closes:
      # unbounded audit growth fills the volume, and the audit write failure that
      # follows is the `critical` AuditWriteFailing alert.
      - alert: PersistentVolumeFillingUp
        expr: |
          (
            kube_persistentvolumeclaim_resource_requests_storage_bytes
            - on(namespace, persistentvolumeclaim) kubelet_volume_stats_available_bytes
          )
          / on(namespace, persistentvolumeclaim)
            kube_persistentvolumeclaim_resource_requests_storage_bytes
          > 0.85
        for: 15m
        labels:
          severity: high
          team: infrastructure
        annotations:
          summary: "PVC {{ $labels.persistentvolumeclaim }} is over 85% full"
          description: "Volume {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is above 85%. See the disk-full runbook."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/storage-exhaustion.md"

      - alert: PersistentVolumeCritical
        expr: |
          (
            kube_persistentvolumeclaim_resource_requests_storage_bytes
            - on(namespace, persistentvolumeclaim) kubelet_volume_stats_available_bytes
          )
          / on(namespace, persistentvolumeclaim)
            kube_persistentvolumeclaim_resource_requests_storage_bytes
          > 0.95
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "PVC {{ $labels.persistentvolumeclaim }} is over 95% full"
          description: "Writes will begin failing shortly. This is the documented path from unbounded audit_logs growth to a critical AuditWriteFailing."
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/storage-exhaustion.md"

      # FS-782. Edge mTLS certificate expiry has had an alert since FS-229; the
      # PUBLIC ingress certificate — the one whose expiry takes the product offline
      # for every customer at once — had none.
      - alert: IngressCertificateExpiringSoon
        expr: |
          probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: high
          team: infrastructure
        annotations:
          summary: "Public TLS certificate expires in under 14 days"
          description: "{{ $labels.instance }} certificate expires in {{ $value | humanizeDuration }}."

      - alert: IngressCertificateExpiringCritical
        expr: |
          probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time() < 3 * 24 * 3600
        for: 15m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Public TLS certificate expires in under 3 days"
          description: "{{ $labels.instance }} certificate expires in {{ $value | humanizeDuration }}. Renewal is now an incident."

      # FS-811. The backup bucket is not immutable, so a compromised backup credential can
      # erase every backup you have — including the old versions.
      #
      # DISTINCT FROM `DatabaseBackupJobFailed` on purpose, and the distinction is the whole
      # reason this is its own CronJob. That alert means "the backup did not happen". This one
      # means "the backups exist and can be deleted by anyone holding the key". Folding the
      # check into db-backup would have conflated them, stopped
      # kube_cronjob_status_last_successful_time advancing, and fired DatabaseBackupStale —
      # telling an operator there are no backups when there are.
      - alert: BackupBucketNotImmutable
        expr: max(kube_job_status_failed{job_name=~".*backup-immutability-check.*"}) > 0
        for: 15m
        labels:
          severity: high
          team: infrastructure
        annotations:
          summary: "The backup bucket is not versioned and object-locked"
          description: >-
            backup-immutability-check failed. Versioning, Object Lock in COMPLIANCE mode,
            public-access block or default encryption is missing, so a holder of the backup
            credentials can delete history. Read the job's logs for which one, then
            base/scripts/bucket-immutability.sh bootstrap against a new bucket.
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/database-backup-restore.md"

      # The check itself going missing is the same silence as the control being off. If the
      # weekly job stops being scheduled, nothing reports the bucket's state at all.
      - alert: BackupImmutabilityCheckNotRunning
        expr: |
          absent(kube_cronjob_status_last_successful_time{cronjob=~".*backup-immutability-check"})
          or (time() - max(kube_cronjob_status_last_successful_time{cronjob=~".*backup-immutability-check"})) > 1209600
        for: 1h
        labels:
          severity: medium
          team: infrastructure
        annotations:
          summary: "The backup immutability check has not run in two weeks"
          description: >-
            It runs weekly. Two weeks of silence means the CronJob is gone, suspended or
            failing to schedule — and nothing is checking whether a compromised credential
            could erase the backups.
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/database-backup-restore.md"

      # FS-817. `audit_logs` has NO retention policy — only `user_audit_logs` does — and it
      # is a plain table, so `add_retention_policy` does not apply either. It grows without
      # bound, and the loop closes on itself: unbounded audit growth fills the volume, the
      # audit write then fails, and `AuditWriteFailing` below is severity CRITICAL. The
      # control that records what happened is the one that ends the system.
      #
      # Whether to PRUNE it is a live decision — migration 069 makes each tenant's rows a
      # hash chain, and OG-AU-004 plans `REVOKE UPDATE, DELETE` on this very table, which a
      # retention job contradicts. Being able to SEE it coming is not a decision, and that
      # is what these two rules are: a size ceiling, and a growth rate that says how long
      # the current trajectory has left.
      - alert: AuditLogTableGrowingUnbounded
        expr: pg_table_growth_total_bytes{table_name="audit_logs"} > 21474836480
        for: 1h
        labels:
          severity: high
          team: data
        annotations:
          summary: "audit_logs has passed 20 GB with no retention policy"
          description: >-
            {{ $value | humanize1024 }}B of audit rows and nothing prunes them. See
            FS-817: pruning needs the WORM export and a decision about OG-AU-004's planned
            REVOKE DELETE, so this is a real deadline rather than a threshold to raise.
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/storage-exhaustion.md"

      # 24h of history, not 7d: the window has to be one a promtool unit test can
      # actually drive, and a rule nobody can drive true is the class this whole sprint
      # has been closing. The capacity dashboard carries the longer-baseline forecast.
      - alert: AuditLogGrowthAccelerating
        expr: |
          predict_linear(pg_table_growth_total_bytes{table_name="audit_logs"}[24h], 30 * 24 * 3600)
          > 107374182400
        for: 2h
        labels:
          severity: medium
          team: data
        annotations:
          summary: "audit_logs is on track to exceed 100 GB within 30 days"
          description: >-
            Projected from the last 24 hours. Size tells you where you are; this tells
            you how long you have.
          runbook_url: "https://github.com/SoundSafe-Dev/OmniusGrid-X/blob/main/docs/runbooks/storage-exhaustion.md"

      # FS-783. The counter exists precisely to expose a silent degraded mode — a
      # correlation job store that fell back to per-process memory because Redis did
      # not answer, so a job created on one worker is invisible to the next request —
      # and nothing consumed it. A metric added to make a failure visible, left unwatched.
      - alert: CorrelationJobStoreDegraded
        expr: increase(opsgrid_correlation_job_store_degraded_total[15m]) > 0
        for: 5m
        labels:
          severity: high
          team: backend
        annotations:
          summary: "Correlation job store has fallen back to process memory"
          description: >-
            Redis did not answer, so job state is per-process. With more than one API
            worker, a client polling its job id will intermittently be told the job
            does not exist.
