"""
pgBackRest configuration for Disaster Recovery
Continuous WAL archiving to S3 with point-in-time recovery capability
"""

# pgBackRest Configuration
# Place in /etc/pgbackrest/pgbackrest.conf

[global]
repo1-type=s3
repo1-s3-bucket=opsgrid-backups
repo1-s3-region=us-east-1
repo1-s3-endpoint=s3.us-east-1.amazonaws.com
repo1-s3-key=<AWS_ACCESS_KEY_ID>
repo1-s3-key-secret=<AWS_SECRET_ACCESS_KEY>

# Repository paths
repo1-path=/pgbackrest/opsgrid

# Retention - keep backups for 30 days
repo1-retention-full=30
repo1-retention-full-type=time

# Compression
compress-type=zst
compress-level=6

# Encryption
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=<ENCRYPTION_PASSPHRASE>

# Performance
process-max=4

# Logging
log-level-console=info
log-level-file=debug
log-path=/var/log/pgbackrest

# S3 Object Lock for immutability
repo1-s3-uri-style=path

[opsgrid-db]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-host=timescaledb-master
pg1-port=5432
pg1-user=postgres

# Database specific settings
pg1-database=opsgrid

# Continuous archiving
archive-async=y
archive-push-queue-max=1GB

# Point-in-time recovery settings
recovery-option=recovery_target_action=promote
