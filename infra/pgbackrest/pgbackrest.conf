# pgBackRest configuration for disaster recovery: continuous WAL archiving to
# S3 with point-in-time recovery.
#
# Place in /etc/pgbackrest/pgbackrest.conf.
#
# This file opened with a Python triple-quoted docstring, which pgBackRest — an
# INI parser — cannot read: it failed on line 1 before reaching any setting.
#
# Secrets below are placeholders. Do NOT fill them in here; this file is in git.
# Supply repo1-s3-key / repo1-s3-key-secret / repo1-cipher-pass via the
# environment (PGBACKREST_REPO1_S3_KEY etc.) or a mounted secret.

[global]
repo1-type=s3
repo1-s3-bucket=opsgrid-backups
repo1-s3-region=us-east-1
repo1-s3-endpoint=s3.us-east-1.amazonaws.com
repo1-s3-key=<AWS_ACCESS_KEY_ID>
repo1-s3-key-secret=<AWS_SECRET_ACCESS_KEY>

# Repository paths
repo1-path=/pgbackrest/opsgrid

# Retention - keep backups for 30 days
repo1-retention-full=30
repo1-retention-full-type=time

# Compression
compress-type=zst
compress-level=6

# Encryption
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=<ENCRYPTION_PASSPHRASE>

# Performance
process-max=4

# Logging
log-level-console=info
log-level-file=debug
log-path=/var/log/pgbackrest

# S3 Object Lock for immutability
repo1-s3-uri-style=path

# Stanza name. Referenced as `--stanza=opsgrid-db` by the backup CronJob and the
# DR runbooks. Note this is NOT the Patroni cluster name (`omniusgrid-db`, used
# by `patronictl` in the DR docs) — conflating the two is why
# infra/scripts/disaster_recovery.sh pointed at a stanza that does not exist.
[opsgrid-db]
pg1-path=/var/lib/postgresql/data/pgdata
# Service name in infrastructure/k8s/base. Was `timescaledb-master`, which only
# ever existed in the legacy Patroni overlay, so every command resolved to a
# hostname with no DNS record.
pg1-host=timescaledb
pg1-port=5432
pg1-user=postgres

# Must match POSTGRES_DB — the `database` key of the database-credentials
# secret in k8s, `omniusgrid` in docker-compose.
pg1-database=omniusgrid

# Continuous archiving
archive-async=y
archive-push-queue-max=1GB

# Point-in-time recovery settings
recovery-option=recovery_target_action=promote
