# Nightly real-mode e2e (FS-48): boots the real compose infrastructure
# (TimescaleDB + Redpanda + Redis), applies migrations with the real runner,
# serves the API over real HTTP, and drives authenticated real-mode flows —
# including the websocket subprotocol handshake. Complements the per-PR suites,
# which run against ASGI/sqlite.
name: Nightly real-mode e2e

on:
  schedule:
    - cron: '17 6 * * *'   # daily, off the peak hours
  workflow_dispatch: {}

jobs:
  real-mode-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Start infrastructure (compose)
        run: docker compose up -d --wait timescaledb redpanda redis

      - name: Install backend
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Apply migrations with the real runner
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://omniusgrid:omniusgrid_dev_password@localhost:5432/omniusgrid
        run: |
          # The compose volume was initdb-built from the same files: adopt it.
          python scripts/migrate.py --baseline
          python scripts/migrate.py

      - name: Start API over real HTTP
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://omniusgrid:omniusgrid_dev_password@localhost:5432/omniusgrid
          REDPANDA_URL: localhost:9092
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health/live && break; sleep 2;
          done
          curl -sf http://127.0.0.1:8000/health/live

      - name: Real-mode flows (auth, geotab, kpi, fleet, websocket)
        working-directory: ./backend
        run: |
          pip install websockets
          python - <<'EOF'
          import asyncio, json, urllib.request

          BASE = "http://127.0.0.1:8000"
          def get(path):
              req = urllib.request.Request(f"{BASE}{path}",
                  headers={"Authorization": "Bearer dev-token"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return r.status, json.loads(r.read() or b"null")

          for path in ["/api/v1/geotab/devices", "/api/v1/kpi/dashboard",
                       "/api/v1/fleet/health", "/api/v1/workcells/",
                       "/api/v1/organizations/"]:
              status, _ = get(path)
              assert status == 200, f"{path} -> {status}"
              print("ok", path)

          async def ws_check():
              import websockets
              async with websockets.connect(
                  "ws://127.0.0.1:8000/ws",
                  subprotocols=["bearer.v1", "dev-token"],
              ) as ws:
                  msg = json.loads(await asyncio.wait_for(ws.recv(), 15))
                  assert msg.get("type") == "connection_established", msg
                  print("ok websocket (subprotocol auth)")
          asyncio.run(ws_check())
          EOF

      - name: Deployment-free smoke battery
        working-directory: ./backend
        run: python scripts/smoke_e2e.py

      - name: API logs on failure
        if: failure()
        run: tail -50 /tmp/api.log

  # DDIL fault-injection scenarios (FS-753). Nightly rather than per-PR because they are
  # the SLOW-but-cheap kind: each represents hours of link outage in compressed time, and
  # the whole set runs in seconds — the reason they are not on the PR path is that their
  # value is regression detection over time, not gating a diff.
  #
  # Every scenario ends by asserting the conservation law
  #   produced == sent + still_buffered + dead_lettered + dropped + expired
  # so a message that is neither delivered, held, nor deliberately discarded AND counted
  # fails the build. Silent buffer loss is the failure DDIL exists to prevent.
  ddil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install edge-agent deps
        working-directory: ./edge-agent
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run DDIL scenarios
        working-directory: ./edge-agent
        run: pytest -m ddil -v

  # --- FS-821: are the pinned base images still current? ---------------------
  #
  # Every `FROM` in this repository is pinned to a digest, which fixes
  # reproducibility and creates the opposite problem: a pin never moves, so the
  # base image ages out of security support silently. Nothing breaks, the build
  # stays green, and the CVE count climbs.
  #
  # NIGHTLY, NOT PER-PR, and deliberately so. A base image moving is news about
  # the world, not a defect in the pull request that happens to be open — failing
  # an unrelated merge on it is how a check gets routed around. This reports it
  # once a day, which is the cadence at which somebody can act on it.
  #
  # Measured when the pins were set: the backend base carried 6,139
  # vulnerabilities — 0 CRITICAL, 193 HIGH of which 102 had a published fix.
  # Those 102 are precisely what a stale pin accumulates.
  base-image-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - name: Compare each pinned digest against its tag
        # Not --strict: a registry outage is not a finding about this repository,
        # and a nightly job that cries wolf on someone else's downtime stops
        # being read. Unreachable registries are printed and tolerated; only a
        # digest that has genuinely moved fails.
        run: python3 tests/k8s/check_base_images_are_current.py
