name: OmniusGrid CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs/media-only pushes skip the pipeline (no image builds / deploys for a
    # README or demo-video change).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'frontend/video/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'frontend/video/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # LINT AND TEST
  # ============================================================================
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: omniusgrid_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redpanda:
        image: redpandadata/redpanda:latest
        ports:
          - 9092:9092
          - 9644:9644
        options: >-
          --health-cmd "rpk cluster health"
          --health-interval 10s
          --health-timeout 5s

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # See the note on the other checkout steps: backend/dataset is a
          # 1.5 GB corpus no job reads.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          # requirements-dev pins the VALIDATED pytest/pytest-asyncio (the
          # runtime file no longer carries test pins); lint/coverage extras
          # aren't in either pin file.
          pip install -r requirements-dev.txt
          pip install pytest-cov flake8 black isort

      - name: Lint Python code
        working-directory: ./backend
        run: |
          # Blocking: syntax errors / undefined names.
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Advisory: 159 of 184 files pre-date black; flipping this to
          # blocking requires a coordinated tree-wide reformat (touches every
          # dev's lane), tracked as follow-up. New errors stay VISIBLE in logs.
          black --check app || true
          isort --check-only app || true

      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/omniusgrid_test
          REDPANDA_URL: localhost:9092
          JWT_SECRET_KEY: test-secret-key
        # Every exclusion below is registered in tests/test_quarantine.py with an
        # owner, a real diagnosis and an EXPIRY date. That suite fails when a window
        # lapses, when a quarantined test starts passing, and when this list and the
        # register drift apart — so a temporary exclusion can no longer become
        # permanent by nobody noticing (FS-237).
        #
        # test_shared_key_detector.py::test_normalize_key was on this list and PASSES
        # now, so CI was skipping working coverage. Removed.
        run: |
          # --cov-fail-under=54 set from the MEASURED baseline (55% at the time of
          # writing) with a 1-point margin, so this is a ratchet: it cannot be met
          # by deleting tests, and it fails if new untested code dilutes the total.
          # Raise it as coverage improves; do NOT lower it to make a build pass.
          pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=54 \
            --ignore=tests/test_document_scenario_builder.py \
            --ignore=tests/test_image_scenario_builder.py \
            --ignore=tests/test_cross_file_scenario_builder.py \
            --deselect tests/test_document_domain_mapper.py::test_map_section_to_domain_table_content \
            --deselect tests/test_image_domain_mapper.py::test_map_image_domains

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

      - name: Run edge-agent tests
        working-directory: ./edge-agent
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        # Blocking since FS-54 (.eslintrc.cjs; tree lints clean at 0/0).
        run: npm run lint

      - name: Type check frontend
        working-directory: ./frontend
        # Blocking since FS-53: the tree is at 0 tsc errors.
        run: npx tsc --noEmit

      - name: Run frontend tests
        working-directory: ./frontend
        run: npx vitest run

      - name: Build frontend
        working-directory: ./frontend
        # vite only — the dedicated tsc step above already typechecks
        # (better failure attribution); `npm run build` would run tsc twice.
        run: npx vite build

  # ============================================================================
  # BUILD AND PUSH IMAGES
  # ============================================================================
  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name != 'pull_request'
    
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component: [backend, frontend, edge-agent]
        include:
          - component: backend
            dockerfile: ./backend/Dockerfile
            # Repo-root context: the backend image bakes in repo-root
            # database/migrations for the k8s migration Job (see the
            # backend/Dockerfile header).
            context: .
          - component: frontend
            # Production image: vite build + nginx (the plain Dockerfile is the
            # dev hot-reload server and must not ship).
            dockerfile: ./frontend/Dockerfile.prod
            context: ./frontend
          - component: edge-agent
            dockerfile: ./edge-agent/Dockerfile
            context: ./edge-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # See the note on the other checkout steps: backend/dataset is a
          # 1.5 GB corpus no job reads.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix={{branch}}-   # full sha: deploy jobs pin ...:<branch>-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # Branch pushes: amd64 only. Building the torch-laden backend image
          # for arm64 under QEMU emulation OOMs/times out, which is what kept
          # this job red on main. Full multi-arch is reserved for v* release
          # tags, where the extra build time is acceptable.
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

      # FS-118: supply-chain SBOM per image (CycloneDX). Advisory artifact —
      # consumers (audits, license review, VEX tooling) download it from the run;
      # generation failure must not block a deploy.
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ github.ref_name }}-${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.component }}.cyclonedx.json

  # ============================================================================
  # SECURITY SCAN
  # ============================================================================
  security-scan:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name != 'pull_request'

    steps:
      - name: Resolve image tag
        id: tag
        # metadata-action never publishes a bare-SHA tag; scan the branch tag
        # (main) or the semver tag for releases.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ steps.tag.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # DEPLOY TO STAGING
  # ============================================================================
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-images, security-scan]
    # Was gated on `develop`, which has never existed — so staging has never
    # been deployed by CI. Staging now tracks main, but behind an explicit
    # opt-in repo variable so enabling it is a deliberate act (the job needs
    # KUBE_CONFIG_STAGING and a reachable cluster; without those it just fails).
    # Set STAGING_DEPLOY_ENABLED=true in repo variables to turn it on.
    if: github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    environment:
      name: staging
      url: https://staging.omniusgrid.local

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # See the note on the other checkout steps: backend/dataset is a
          # 1.5 GB corpus no job reads.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin kustomize

      - name: Deploy to staging
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

          # Pin image tags in the overlay's kustomization (the previous sed
          # targeted *-deployment.yaml files that don't exist in the overlay).
          cd infrastructure/k8s/overlays/staging
          kustomize edit set image \
            omniusgrid/backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.ref_name }}-${{ github.sha }} \
            omniusgrid/frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.ref_name }}-${{ github.sha }}
          cd -

          # Migrations must COMPLETE before the Deployments are updated. A single
          # `apply -k` creates the Job and rolls the Deployments simultaneously,
          # so new pods would serve traffic against the old schema for as long
          # as the migration runs. Build once, apply the Job alone, wait, then
          # apply the rest.
          kustomize build infrastructure/k8s/overlays/staging/ > /tmp/staging-manifests.yaml
          python3 scripts/split_manifests.py /tmp/staging-manifests.yaml \
            --kind Job --name staging-db-migrate --out /tmp/staging-migrate.yaml

          # Jobs are immutable once created: delete last deploy's migration
          # Job so the freshly image-pinned one can be applied.
          kubectl delete job staging-db-migrate -n omniusgrid-staging --ignore-not-found
          kubectl apply -f /tmp/staging-migrate.yaml
          kubectl wait --for=condition=complete job/staging-db-migrate -n omniusgrid-staging --timeout=300s

          kubectl apply -f /tmp/staging-manifests.yaml

          kubectl rollout status deployment/staging-backend -n omniusgrid-staging --timeout=300s
          kubectl rollout status deployment/staging-frontend -n omniusgrid-staging --timeout=300s

      - name: Deploy platform stacks (monitoring / autoscaling / HA db)
        run: |
          export KUBECONFIG=kubeconfig
          set -euo pipefail

          # These live OUTSIDE the overlays on purpose and could not simply be
          # referenced from them: autoscaling/ and database-ha/ emit operator
          # custom resources (KEDA, CloudNativePG) that fail to apply when the
          # operator is absent, and monitoring/ pulls the canonical alert rules
          # from infra/prometheus, which needs --load-restrictor
          # LoadRestrictionsNone. Referencing either from an overlay would break
          # the overlay build that pins images above. So they are applied here,
          # explicitly, and each operator-dependent stack is gated on its CRD
          # actually being installed rather than failing the deploy.

          echo "::group::monitoring (no operator required)"
          kustomize build --load-restrictor LoadRestrictionsNone \
            infrastructure/k8s/monitoring \
            | python3 tests/k8s/strip_placeholder_secrets.py | kubectl apply -n omniusgrid-staging -f -
          echo "::endgroup::"

          if kubectl get crd scaledobjects.keda.sh >/dev/null 2>&1; then
            echo "::group::autoscaling (KEDA present)"
            kustomize build --load-restrictor LoadRestrictionsNone \
              infrastructure/k8s/autoscaling | kubectl apply -n omniusgrid-staging -f -
            echo "::endgroup::"
          else
            echo "SKIP autoscaling: KEDA CRDs not installed in this cluster."
            echo "  install: see infrastructure/k8s/autoscaling/README.md"
          fi

          if kubectl get crd clusters.postgresql.cnpg.io >/dev/null 2>&1; then
            echo "::group::database-ha (CloudNativePG present)"
            kustomize build --load-restrictor LoadRestrictionsNone \
              infrastructure/k8s/database-ha \
              | python3 tests/k8s/strip_placeholder_secrets.py | kubectl apply -n omniusgrid-staging -f -
            echo "::endgroup::"
          else
            echo "SKIP database-ha: CloudNativePG CRDs not installed in this cluster."
            echo "  install + cutover: see infrastructure/k8s/database-ha/README.md"
          fi

      - name: Run smoke tests
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.omniusgrid.local' }}
        run: |
          sleep 30
          curl -sf "$STAGING_BASE_URL/health" || exit 1

  # ============================================================================
  # DEPLOY TO PRODUCTION
  # ============================================================================
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-images, security-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://omniusgrid.local

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # See the note on the other checkout steps: backend/dataset is a
          # 1.5 GB corpus no job reads.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin kustomize

      - name: Deploy to production
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

          # Extract version from tag
          VERSION=${GITHUB_REF#refs/tags/v}

          # Pin image tags via kustomize (sed previously targeted files that
          # don't exist in the overlay).
          cd infrastructure/k8s/overlays/production
          kustomize edit set image \
            omniusgrid/backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${VERSION} \
            omniusgrid/frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${VERSION}
          cd -

          # Migrations must COMPLETE before the Deployments are updated — see the
          # staging job for the rationale (apply -k would roll pods onto the new
          # image while the migration is still running).
          kustomize build infrastructure/k8s/overlays/production/ > /tmp/prod-manifests.yaml
          python3 scripts/split_manifests.py /tmp/prod-manifests.yaml \
            --kind Job --name prod-db-migrate --out /tmp/prod-migrate.yaml

          kubectl delete job prod-db-migrate -n omniusgrid --ignore-not-found
          kubectl apply -f /tmp/prod-migrate.yaml
          kubectl wait --for=condition=complete job/prod-db-migrate -n omniusgrid --timeout=300s

          kubectl apply -f /tmp/prod-manifests.yaml

          kubectl rollout status deployment/prod-backend -n omniusgrid --timeout=600s
          kubectl rollout status deployment/prod-frontend -n omniusgrid --timeout=600s

      - name: Deploy platform stacks (monitoring / autoscaling / HA db)
        run: |
          export KUBECONFIG=kubeconfig
          set -euo pipefail

          # See the staging job for why these are applied here rather than being
          # referenced from the overlay: operator CRs and a cross-tree rule
          # reference make them incompatible with the image-pinned overlay build.

          echo "::group::monitoring (no operator required)"
          kustomize build --load-restrictor LoadRestrictionsNone \
            infrastructure/k8s/monitoring \
            | python3 tests/k8s/strip_placeholder_secrets.py | kubectl apply -n omniusgrid -f -
          echo "::endgroup::"

          if kubectl get crd scaledobjects.keda.sh >/dev/null 2>&1; then
            echo "::group::autoscaling (KEDA present)"
            kustomize build --load-restrictor LoadRestrictionsNone \
              infrastructure/k8s/autoscaling | kubectl apply -n omniusgrid -f -
            echo "::endgroup::"
          else
            echo "SKIP autoscaling: KEDA CRDs not installed in this cluster."
            echo "  install: see infrastructure/k8s/autoscaling/README.md"
          fi

          if kubectl get crd clusters.postgresql.cnpg.io >/dev/null 2>&1; then
            echo "::group::database-ha (CloudNativePG present)"
            kustomize build --load-restrictor LoadRestrictionsNone \
              infrastructure/k8s/database-ha \
              | python3 tests/k8s/strip_placeholder_secrets.py | kubectl apply -n omniusgrid -f -
            echo "::endgroup::"
          else
            echo "SKIP database-ha: CloudNativePG CRDs not installed in this cluster."
            echo "  install + cutover: see infrastructure/k8s/database-ha/README.md"
          fi

      - name: Verify deployment
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://omniusgrid.local' }}
        run: |
          curl -sf "$PRODUCTION_BASE_URL/health" || exit 1
          curl -sf "$PRODUCTION_BASE_URL/api/v1/health/db" || exit 1

      - name: Notify deployment
        uses: slackapi/slack-github-action@v1.24.0
        if: always()
        with:
          payload: |
            {
              "text": "OmniusGrid ${{ github.ref }} deployed to production: ${{ job.status }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # NOTE: there is deliberately no separate `database-migrations` job. Both
  # deploy jobs apply the image-pinned db-migrate Job from the overlay and wait
  # for it to complete before rolling the Deployments, so migrations run in the
  # cluster with the same image as the code that will read the schema. The old
  # job here ran migrate.py from the runner against STAGING_DATABASE_URL, was
  # gated on a `develop` branch that never existed, and so never executed.

  # ============================================================================
  # RELEASE
  # ============================================================================
  create-release:
    runs-on: ubuntu-latest
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # See the note on the other checkout steps: backend/dataset is a
          # 1.5 GB corpus no job reads.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false

      - name: Generate release notes
        run: |
          echo "## Changes in ${{ github.ref_name }}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          git log --oneline $(git describe --tags --abbrev=0 HEAD^)..HEAD >> RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: RELEASE_NOTES.md
          files: |
            infrastructure/k8s/base/*.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
