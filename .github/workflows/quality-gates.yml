# Additive quality gates (kept separate from ci-cd.yml to avoid convergence
# conflicts). Adds: API contract tests (task 12), frontend tests (tasks 1-2),
# and supply-chain scanning (task 20). Jobs are appended here as those tasks land.
name: Quality Gates

on:
  push:
    # Every namespace that actually exists on the remotes. `develop` was listed
    # here for a long time but has never existed, so it gated nothing; the dev
    # branches below ran zero CI as a result.
    branches:
      - main
      - 'hamad/**'
      - 'hridyansh/**'
      - 'feature/**'
      - htreinen
      - HARSH-CONTRIBUTION
    # Docs/media-only pushes don't need the gates — skip them so a README or
    # demo-video commit doesn't run (and fail-email) the whole pipeline.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'frontend/video/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'frontend/video/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'

jobs:
  # --- task 12: property-based API contract tests ---------------------------
  api-contract:
    runs-on: ubuntu-latest
    # Advisory (ready to flip pending one green CI run). The two known blockers
    # are now fixed: (1) FS-80 documents 401/403/404/422/429/500 on every router
    # mount (app/core/responses.py), and (2) migrations 039/040 repaired the
    # ORM<->schema drift that 500'd reads on a real postgres. Kept advisory only
    # because schemathesis (a CI-only dev dep) can't be run locally to prove the
    # full ~400-op property suite is clean; flip to blocking once this job is
    # observed green in CI.
    continue-on-error: true
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: omniusgrid_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dev deps
        working-directory: ./backend
        run: pip install -r requirements-dev.txt
      - name: Run schemathesis contract tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/omniusgrid_test
          RUN_CONTRACT_TESTS: "1"
        run: pytest tests/test_api_contract.py -q

  # --- FS-114: real-DB guard suite (schema parity + endpoint/write smoke) ---
  backend-realdb:
    runs-on: ubuntu-latest
    # BLOCKING. This is the only workflow that runs on hamad/** pushes, and
    # until now NO job here executed the backend suite — so the FS-91/92/93
    # real-DB guards (which spin an ephemeral TimescaleDB via testcontainers)
    # never ran on the convergence branch. They also SILENTLY SKIPPED in
    # ci-cd.yml because testcontainers wasn't a pinned dev dep. FS-114 fixes
    # both: the pin lands in requirements-dev.txt and this job runs the guards
    # against a real Postgres so ORM<->migration drift and naive-datetime bugs
    # (which SQLite create_all masks) fail the merge instead of prod.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dev deps (incl. testcontainers)
        working-directory: ./backend
        run: pip install -r requirements-dev.txt
      - name: Verify testcontainers is importable (guards must not skip)
        working-directory: ./backend
        # Fail loudly if the pin ever regresses: a skipped guard is a silent
        # loss of the exact coverage this job exists to provide.
        run: python -c "import testcontainers.postgres; print('testcontainers OK')"
      - name: Real-DB guard suite
        working-directory: ./backend
        # testcontainers talks to the host Docker daemon (present on
        # ubuntu-latest); each spun container migrates the schema via
        # scripts/migrate.py, so this is a true fresh-chain parity check.
        run: |
          pytest -q \
            tests/test_schema_parity.py \
            tests/test_realdb_endpoint_smoke.py \
            tests/test_realdb_write_smoke.py \
            tests/test_no_naive_utcnow.py \
            tests/test_demo_seeder_smoke.py \
            tests/test_backup_restore_drill.py \
            tests/test_dashboard_tenancy.py \
            tests/test_dashboard_analytics.py

  # --- FS-107: Prometheus alert rules — lint + unit test -------------------
  prometheus-rules:
    runs-on: ubuntu-latest
    # BLOCKING. Alert rules are code: a typo'd expr or an unfirable threshold
    # (e.g. a histogram_quantile compared above its largest finite bucket) is a
    # silent gap — the alert simply never pages. Until now nothing validated
    # infra/prometheus/alerts.yml at all. This lints every rule and runs the
    # promtool unit tests that assert the deterministic alerts actually fire.
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          PROM_VERSION=2.53.1
          curl -sSL -o /tmp/prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tar.gz -C /tmp
          sudo mv "/tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version
      - name: Lint alert rules
        working-directory: ./infra/prometheus
        run: promtool check rules alerts.yml
      - name: Run alert unit tests
        working-directory: ./infra/prometheus
        run: promtool test rules tests/error_alerts_test.yml tests/subsystems_alerts_test.yml tests/platform_alerts_test.yml

  # --- k8s manifest validation (blocking) ----------------------------------
  k8s-manifests:
    runs-on: ubuntu-latest
    # BLOCKING. Deploy jobs in ci-cd.yml only build the staging/production
    # overlays — nothing validated base/ or the operator-managed stacks
    # (monitoring, database-ha, autoscaling), so a broken kustomization or an
    # invalid manifest in any of them would only surface at apply time (or never,
    # for the opt-in stacks). This builds EVERY kustomization and schema-validates
    # the output, so a typo'd field or an unbuildable overlay fails the merge.
    steps:
      - uses: actions/checkout@v4
      - name: Setup kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize
          kustomize version
      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kc.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          sudo tar xz -C /usr/local/bin -f /tmp/kc.tar.gz kubeconform
          kubeconform -v
      - name: Build + validate app manifests (base + overlays)
        run: |
          set -euo pipefail
          for t in base overlays/staging overlays/production; do
            echo "::group::$t"
            kustomize build "infrastructure/k8s/$t" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -kubernetes-version 1.29.0
            echo "::endgroup::"
          done
      - name: Build + validate operator stacks (monitoring, database-ha, autoscaling)
        # These reference operator CRDs (Prometheus rules from outside the tree,
        # CloudNativePG Cluster/Pooler, KEDA ScaledObject) — build with the None
        # load-restrictor and let kubeconform skip the CRD schemas it can't know.
        run: |
          set -euo pipefail
          for t in monitoring database-ha autoscaling; do
            echo "::group::$t"
            kustomize build --load-restrictor LoadRestrictionsNone "infrastructure/k8s/$t" \
              | kubeconform -summary -ignore-missing-schemas \
                  -kubernetes-version 1.29.0
            echo "::endgroup::"
          done

  # --- k8s live smoke test on kind (blocking) ------------------------------
  k8s-smoke:
    runs-on: ubuntu-latest
    # BLOCKING. k8s-manifests above proves the manifests BUILD and are
    # schema-valid; this proves the operator stacks actually RUN and that the
    # custom resources pass the REAL admission webhooks — which kubeconform
    # can't check because it skips CRD schemas. Promoted to blocking after
    # observing it green end-to-end (monitoring applies + goes Ready; the CNPG
    # Cluster and KEDA ScaledObjects pass their operators' validating webhooks).
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: omniusgrid-smoke
      - name: Setup kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize

      # --- Monitoring: full apply + wait Ready (public images, no CRDs) ------
      - name: Smoke-test the monitoring stack (real apply)
        run: |
          set -euo pipefail
          kubectl create namespace omniusgrid
          kustomize build --load-restrictor LoadRestrictionsNone infrastructure/k8s/monitoring \
            | kubectl apply -f -
          # Prove each component actually schedules and becomes Ready.
          kubectl -n omniusgrid rollout status statefulset/prometheus --timeout=180s
          kubectl -n omniusgrid rollout status statefulset/alertmanager --timeout=180s
          kubectl -n omniusgrid rollout status deployment/kube-state-metrics --timeout=180s
          kubectl -n omniusgrid rollout status deployment/grafana --timeout=180s

      # --- CloudNativePG: install operator, validate the Cluster CR ----------
      - name: Install CloudNativePG operator
        run: |
          kubectl apply --server-side -f \
            https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.24/releases/cnpg-1.24.0.yaml
          kubectl -n cnpg-system rollout status deployment/cnpg-controller-manager --timeout=180s
      - name: Validate the HA database CR against the real CNPG webhook
        run: |
          set -euo pipefail
          # Server dry-run runs the operator's validating webhook — catches CR
          # field errors kubeconform skipped. No pods are pulled/started.
          kustomize build --load-restrictor LoadRestrictionsNone infrastructure/k8s/database-ha \
            | kubectl apply --dry-run=server -f -

      # --- KEDA: install operator, validate the ScaledObjects ----------------
      - name: Install KEDA operator
        run: |
          kubectl apply --server-side -f \
            https://github.com/kedacore/keda/releases/download/v2.15.1/keda-2.15.1.yaml
          kubectl -n keda rollout status deployment/keda-operator --timeout=180s
      - name: Validate the worker ScaledObjects against the real KEDA webhook
        run: |
          set -euo pipefail
          # The ScaledObjects reference worker Deployments via scaleTargetRef, so
          # create those objects first (they ImagePullBackOff — we never wait on
          # them; only their existence is needed for the target check).
          kustomize build infrastructure/k8s/base | kubectl apply -f - || true
          kustomize build infrastructure/k8s/autoscaling \
            | kubectl apply --dry-run=server -f -

  # --- NetworkPolicy enforcement on Calico (blocking) ----------------------
  k8s-netpol:
    runs-on: ubuntu-latest
    # BLOCKING. k8s-smoke runs on kind's default CNI (kindnet), which IGNORES
    # NetworkPolicies — so it proves the policies parse and apply, never that they
    # work. This runs the same base manifests on Calico, where policy is enforced,
    # and asserts real connectivity both ways:
    #   ALLOW export-worker -> seaweedfs:8333  (the S3 export path; this exact rule
    #         was missing when the object store shipped, silently breaking every
    #         export upload/download under an enforcing CNI)
    #   DENY  ingestion-worker -> seaweedfs:8333  (proves policy is really enforced;
    #         without this the ALLOW assertion would pass even with no CNI at all)
    # Promoted to blocking after observing both assertions execute and pass under
    # Calico ("OK (reachable)" / "OK (blocked)").
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster (no default CNI)
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: omniusgrid-netpol
          config: tests/k8s/kind-calico.yaml
      - name: Install Calico
        run: |
          set -euo pipefail
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.1/manifests/calico.yaml
          # Nodes stay NotReady until the CNI is up.
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
      - name: Setup kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize
      - name: Apply NetworkPolicies (base + monitoring + database-ha)
        run: |
          set -euo pipefail
          kubectl create namespace omniusgrid
          kubectl create namespace keda              # cross-namespace: KEDA scalers
          kubectl create namespace netpol-outsider   # negative control
          # Apply ONLY the policies (not the whole app) — the probe pods stand in
          # for the real workloads, so no application images need to pull.
          {
            kustomize build infrastructure/k8s/base
            kustomize build --load-restrictor LoadRestrictionsNone infrastructure/k8s/monitoring
            kustomize build --load-restrictor LoadRestrictionsNone infrastructure/k8s/database-ha
          } | ./tests/k8s/extract-netpols.py | kubectl apply -f -
          kubectl -n omniusgrid get networkpolicy
      - name: Deploy probe pods
        run: kubectl apply -f tests/k8s/netpol-probe.yaml
      - name: Assert NetworkPolicy enforcement
        run: ./tests/k8s/netpol-test.sh
      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n omniusgrid get pods -o wide || true
          kubectl -n keda get pods -o wide || true
          kubectl -n netpol-outsider get pods -o wide || true
          kubectl -n omniusgrid describe networkpolicy || true

  # --- NetworkPolicy matrix simulation (blocking, no cluster) --------------
  netpol-simulate:
    runs-on: ubuntu-latest
    # BLOCKING and cheap (seconds, no cluster). Evaluates the SAME client->server
    # matrix that k8s-netpol asserts, but directly against the policy YAML — so a
    # policy change that breaks an expected path fails in ~20s instead of after a
    # 5-minute kind+Calico spin-up. k8s-netpol remains the source of truth (it
    # proves a real CNI agrees with this model); this is the fast feedback loop.
    steps:
      - uses: actions/checkout@v4
      - name: Setup kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize
      - name: Simulate the enforcement matrix
        run: |
          set -euo pipefail
          pip install pyyaml
          {
            kustomize build infrastructure/k8s/base
            kustomize build --load-restrictor LoadRestrictionsNone infrastructure/k8s/monitoring
            kustomize build --load-restrictor LoadRestrictionsNone infrastructure/k8s/database-ha
          } | ./tests/k8s/extract-netpols.py > /tmp/netpols.yaml
          # Derive the matrix from the shell script so the two can't drift.
          grep -oE '^  "[^"]+"' tests/k8s/netpol-test.sh | tr -d ' "' \
            | awk -F'|' 'NF>=6{print $1"\t"$3"\t"$4"\t"$5"\t"$6}' > /tmp/matrix.tsv
          ./tests/k8s/simulate-netpols.py /tmp/netpols.yaml tests/k8s/netpol-probe.yaml /tmp/matrix.tsv

  # --- task 1: frontend unit tests (Vitest) --------------------------------
  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: ./frontend
        run: npm ci
      - name: Vitest
        working-directory: ./frontend
        run: npm run test

  # --- task 2: frontend E2E smoke (Playwright) -----------------------------
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: ./frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        working-directory: ./frontend
        run: npm run e2e

  # --- task 19: pre-commit hooks as a CI gate ------------------------------
  pre-commit:
    runs-on: ubuntu-latest
    # Advisory while the existing tree is brought into compliance.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pre-commit/action@v3.0.1

  # --- task 20: supply-chain scanning --------------------------------------
  supply-chain:
    runs-on: ubuntu-latest
    # BLOCKING since FS-70: backend/edge pins are pip-audit clean and the npm
    # lockfile is at 0 vulnerabilities. One documented ignore below.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-audit (backend)
        # No ignores: FS-76 swapped python-jose -> PyJWT, dropping ecdsa (and its
        # Minerva advisory PYSEC-2026-1325) from the dependency tree entirely.
        run: pip install pip-audit==2.7.3 && pip-audit -r backend/requirements.txt
      - name: pip-audit (edge-agent)
        run: pip-audit -r edge-agent/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit (frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=high
      - name: Trivy filesystem scan (frontend + edge)
        # BLOCKING since FS-79: the misconfig backlog it was waiting on is
        # remediated — backend/frontend/rag images run non-root (FS-77), k8s has
        # egress NetworkPolicies (FS-78), and a curated .trivyignore documents
        # any residual accepted findings. exit-code 1 now gates the merge.
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  # --- FS-144/145: repo hygiene (blocking) ----------------------------------
  # Both of these were real regressions, not hypotheticals:
  #   * the root .dockerignore existed only in Hamad's working tree, so every CI
  #     backend build (context: .) shipped frontend/, backend/venv, .git and
  #     *.pem into the build context.
  #   * frontend/node_modules was committed before .gitignore listed it, so the
  #     ignore rule was inert and 19k darwin-built files were tracked.
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Root .dockerignore must be tracked
        run: |
          if ! git ls-files --error-unmatch .dockerignore >/dev/null 2>&1; then
            echo "::error::.dockerignore is not tracked — CI image builds will" \
                 "include frontend/, venv, .git and *.pem in the build context."
            exit 1
          fi

      - name: No dependency or build output may be tracked
        run: |
          offenders=$(git ls-files | grep -E '(^|/)(node_modules|venv|\.venv)/' || true)
          if [ -n "$offenders" ]; then
            echo "::error::$(echo "$offenders" | wc -l) dependency files are tracked in git."
            echo "$offenders" | head -20
            exit 1
          fi

      - name: No private key material may be tracked
        run: |
          offenders=$(git ls-files | grep -E '\.(pem|key|p12|pfx)$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::private key material is tracked in git:"
            echo "$offenders"
            exit 1
          fi

  # --- task 20: k6 load test (non-blocking) --------------------------------
  load-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 smoke load test
        uses: grafana/setup-k6-action@v1
      - name: Execute
        uses: grafana/run-k6-action@v1
        with:
          path: tests/load/k6-load-test.js
          flags: --vus 5 --duration 30s
        env:
          # Points at whatever the CI stands up; harmless smoke run otherwise.
          BASE_URL: http://localhost:8000
