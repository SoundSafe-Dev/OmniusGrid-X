# Additive quality gates (kept separate from ci-cd.yml to avoid convergence
# conflicts). Adds: API contract tests (task 12), frontend tests (tasks 1-2),
# and supply-chain scanning (task 20). Jobs are appended here as those tasks land.
name: Quality Gates

on:
  push:
    branches: [main, develop, 'hamad/**']
  pull_request:
    branches: [main, develop]

jobs:
  # --- task 12: property-based API contract tests ---------------------------
  api-contract:
    runs-on: ubuntu-latest
    # Blocking (FS-43): schema/response drift fails the pipeline.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: omniusgrid_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dev deps
        working-directory: ./backend
        run: pip install -r requirements-dev.txt
      - name: Run schemathesis contract tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/omniusgrid_test
        run: pytest tests/test_api_contract.py -q

  # --- task 1: frontend unit tests (Vitest) --------------------------------
  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: ./frontend
        run: npm ci
      - name: Vitest
        working-directory: ./frontend
        run: npm run test

  # --- task 2: frontend E2E smoke (Playwright) -----------------------------
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: ./frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        working-directory: ./frontend
        run: npm run e2e

  # --- task 19: pre-commit hooks as a CI gate ------------------------------
  pre-commit:
    runs-on: ubuntu-latest
    # Advisory while the existing tree is brought into compliance.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pre-commit/action@v3.0.1

  # --- task 20: supply-chain scanning --------------------------------------
  supply-chain:
    runs-on: ubuntu-latest
    # Blocking (FS-43): known-vulnerable pins fail the pipeline.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-audit (backend)
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: pip-audit (edge-agent)
        run: pip-audit -r edge-agent/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit (frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=high
      - name: Trivy filesystem scan (frontend + edge)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL

  # --- task 20: k6 load test (non-blocking) --------------------------------
  load-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 smoke load test
        uses: grafana/setup-k6-action@v1
      - name: Execute
        uses: grafana/run-k6-action@v1
        with:
          path: tests/load/k6-load-test.js
          flags: --vus 5 --duration 30s
        env:
          # Points at whatever the CI stands up; harmless smoke run otherwise.
          BASE_URL: http://localhost:8000
