  # --- ERP end to end: live vendor -> real sync -> RLS-protected Postgres -----
  erp-sync-e2e:
    runs-on: ubuntu-latest
    # The only test that proves the WHOLE path rather than one link: data fetched
    # from a live ERP landing in this database, scoped to the right tenant and
