# Additive quality gates (kept separate from ci-cd.yml to avoid convergence
# conflicts). Adds: API contract tests (task 12), frontend tests (tasks 1-2),
# and supply-chain scanning (task 20). Jobs are appended here as those tasks land.
name: Quality Gates

on:
  push:
    branches: [main, develop, 'hamad/**']
    # Docs/media-only pushes don't need the gates — skip them so a README or
    # demo-video commit doesn't run (and fail-email) the whole pipeline.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'frontend/video/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'frontend/video/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'

jobs:
  # --- task 12: property-based API contract tests ---------------------------
  api-contract:
    runs-on: ubuntu-latest
    # Advisory: handlers still return undocumented 400/404s (FastAPI only
    # auto-documents 200/422) and schemathesis-generated ids hit real 500s on
    # postgres (e.g. non-UUID path params). Gate it AFTER responses are
    # documented; flipping it blocking today is a permanently red pipeline.
    continue-on-error: true
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: omniusgrid_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dev deps
        working-directory: ./backend
        run: pip install -r requirements-dev.txt
      - name: Run schemathesis contract tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/omniusgrid_test
          RUN_CONTRACT_TESTS: "1"
        run: pytest tests/test_api_contract.py -q

  # --- task 1: frontend unit tests (Vitest) --------------------------------
  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: ./frontend
        run: npm ci
      - name: Vitest
        working-directory: ./frontend
        run: npm run test

  # --- task 2: frontend E2E smoke (Playwright) -----------------------------
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: ./frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        working-directory: ./frontend
        run: npm run e2e

  # --- task 19: pre-commit hooks as a CI gate ------------------------------
  pre-commit:
    runs-on: ubuntu-latest
    # Advisory while the existing tree is brought into compliance.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pre-commit/action@v3.0.1

  # --- task 20: supply-chain scanning --------------------------------------
  supply-chain:
    runs-on: ubuntu-latest
    # BLOCKING since FS-70: backend/edge pins are pip-audit clean and the npm
    # lockfile is at 0 vulnerabilities. One documented ignore below.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-audit (backend)
        # --ignore-vuln PYSEC-2026-1325: ecdsa Minerva timing side-channel via
        # python-jose; NO fixed release exists. Follow-up filed: swap
        # python-jose -> PyJWT (~10 call sites), which drops ecdsa entirely.
        run: pip install pip-audit==2.7.3 && pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325
      - name: pip-audit (edge-agent)
        run: pip-audit -r edge-agent/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit (frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=high
      - name: Trivy filesystem scan (frontend + edge)
        # ADVISORY: this whole-repo misconfig/secret scan surfaces findings
        # (exit-code 1 makes them visible) but does NOT gate merges yet — the
        # repo has a HIGH-severity misconfig backlog (e.g. Dockerfiles run as
        # root, k8s hardening) that needs its own remediation pass before this
        # can block. The dependency gates above (pip-audit + npm audit) stay
        # blocking. Re-flip to blocking after the hardening follow-up lands.
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  # --- task 20: k6 load test (non-blocking) --------------------------------
  load-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 smoke load test
        uses: grafana/setup-k6-action@v1
      - name: Execute
        uses: grafana/run-k6-action@v1
        with:
          path: tests/load/k6-load-test.js
          flags: --vus 5 --duration 30s
        env:
          # Points at whatever the CI stands up; harmless smoke run otherwise.
          BASE_URL: http://localhost:8000
