          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: ./frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        working-directory: ./frontend
        run: npm run e2e

  # --- ERP Tier 4: the SAP connector against SAP's public sandbox -----------
  erp-sap-sandbox:
    runs-on: ubuntu-latest
    # Runs only when the repository has a SAP_SANDBOX_API_KEY secret. The key is
    # free but is issued to a person at api.sap.com, so it cannot be provisioned
    # from CI. Without it the job is a no-op rather than a red build.
    #
    # Worth having because the sandbox is a LIVE SAP OData service: it exercises
    # the $batch multipart parser against genuine SAP bytes rather than the
    # fixture we wrote, which is the one thing our own fixture cannot do.
    # NO EVENT GATE (FS-374). This was `if: github.event_name == 'push'`, which skipped
    # the vendor-facing suites on every pull_request. That mattered less than it looks —
    # `on.push.branches` covers hamad/**, hridyansh/**, feature/**, htreinen and
    # HARSH-CONTRIBUTION, so most work is already checked on the branch push — but it left
    # a real hole: a branch matching NONE of those patterns (`alex` on origin today) runs
    # zero push CI, so its PR is the only gate, and this was the gate that skipped.
    #
    # Removing it is close to free. Every one of these suites is `pytest.mark.skipif` on
    # its credentials, so with no secrets — the fork-PR case — the whole set is 55 skipped
    # in 0.18s and green. Verified locally rather than assumed. With secrets present on a
    # same-repo PR they do the real vendor call, which is the point.
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install backend deps
        working-directory: ./backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: SAP sandbox tests
        working-directory: ./backend
        env:
          SAP_SANDBOX_API_KEY: ${{ secrets.SAP_SANDBOX_API_KEY }}
        # Skips cleanly when the secret is absent; fails loudly on a STALE key,
        # so an expired credential is distinguishable from an unconfigured one.
        run: pytest tests/test_erp_sap_sandbox.py -q -rs

  # --- ERP Tier 4: the Intuit connector against a REAL QuickBooks company ------
  erp-intuit-sandbox:
    runs-on: ubuntu-latest
    # Runs only when the repository has the four Intuit secrets. They cannot be
    # provisioned from CI: QuickBooks advertises no client-credentials grant, so the
    # refresh token comes from a ONE-TIME interactive authorization by a human
    # (backend/scripts/intuit_authorize.py). Without them the job is a no-op rather
    # than a red build.
    #
    # Worth having for one assertion above all: Intuit decides when to ROTATE the
    # refresh token, retiring the previous one. No fixture can prove we handle that,
    # because a fixture's rotation behaviour is whatever we wrote. Mishandle it and
    # the integration works exactly once, then fails forever with invalid_grant.
    #
    # NOTE ON THE ROTATING CREDENTIAL. If Intuit rotates during a run, the stored
    # INTUIT_REFRESH_TOKEN secret becomes STALE and later runs fail with
    # invalid_grant -- correctly, since that is exactly the failure being guarded
    # against. Re-run scripts/intuit_authorize.py and update the secret when it
    # happens; a red build here is real information, not flakiness.
    # NO EVENT GATE (FS-374). This was `if: github.event_name == 'push'`, which skipped
    # the vendor-facing suites on every pull_request. That mattered less than it looks —
    # `on.push.branches` covers hamad/**, hridyansh/**, feature/**, htreinen and
    # HARSH-CONTRIBUTION, so most work is already checked on the branch push — but it left
    # a real hole: a branch matching NONE of those patterns (`alex` on origin today) runs
    # zero push CI, so its PR is the only gate, and this was the gate that skipped.
    #
    # Removing it is close to free. Every one of these suites is `pytest.mark.skipif` on
    # its credentials, so with no secrets — the fork-PR case — the whole set is 55 skipped
    # in 0.18s and green. Verified locally rather than assumed. With secrets present on a
    # same-repo PR they do the real vendor call, which is the point.
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install backend deps
        working-directory: ./backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Intuit sandbox tests
        working-directory: ./backend
        env:
          INTUIT_CLIENT_ID: ${{ secrets.INTUIT_CLIENT_ID }}
          INTUIT_CLIENT_SECRET: ${{ secrets.INTUIT_CLIENT_SECRET }}
          INTUIT_REFRESH_TOKEN: ${{ secrets.INTUIT_REFRESH_TOKEN }}
          INTUIT_REALM_ID: ${{ secrets.INTUIT_REALM_ID }}
          INTUIT_ENVIRONMENT: sandbox
        # Skips cleanly when the secrets are absent; fails loudly on a stale
        # credential, so an expired token is distinguishable from an unconfigured one.
        run: pytest tests/test_erp_intuit_sandbox.py -q -rs

  # --- ERP Tier 4: the Dynamics connector against a REAL Dataverse ------------
  erp-dynamics-sandbox:
