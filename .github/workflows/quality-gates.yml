# Additive quality gates (kept separate from ci-cd.yml to avoid convergence
# conflicts). Adds: API contract tests (task 12), frontend tests (tasks 1-2),
# and supply-chain scanning (task 20). Jobs are appended here as those tasks land.
name: Quality Gates

on:
  push:
    # Every namespace that actually exists on the remotes. `develop` was listed
    # here for a long time but has never existed, so it gated nothing; the dev
    # branches below ran zero CI as a result.
    branches:
      - main
      - 'hamad/**'
      - 'hridyansh/**'
      - 'feature/**'
      - htreinen
      - HARSH-CONTRIBUTION
      # `alex` matched none of the patterns above and was therefore running ZERO push CI —
      # the same failure `develop` had, one branch later. An allowlist of personal branch
      # names goes stale every time someone creates one, and it fails silently: nothing
      # reports "this branch has no gates". `test_ci_covers_every_branch.py` now compares
      # this list against the branches that actually exist on the remotes.
      - alex
    # Docs/media-only pushes don't need the gates — skip them so a README or
    # demo-video commit doesn't run (and fail-email) the whole pipeline.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'frontend/video/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'frontend/video/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'

jobs:
  # --- task 12: property-based API contract tests ---------------------------
  api-contract:
    runs-on: ubuntu-latest
    # BLOCKING, as a RATCHET rather than a pass/fail gate. Rebuilt 2026-07-30 after
    # measuring what this job actually did: nothing. Every stated reason it stayed
    # advisory was false, and it could not have gone green.
    #
    #   * It could not FINISH. ~2.5 min per operation x 451 = ~19 hours against
    #     GitHub's 6h limit, so it was killed every run and `continue-on-error: true`
    #     hid the kill. The cost was not the API: one request is ~45ms. It was that
    #     `from_asgi` drives the app in-process, so every generated example ran on a
    #     NEW event loop while the app's singletons stayed bound to the first — and
    #     the websocket queue processor, whose error path had no backoff, then span at
    #     full CPU forever. The suite now runs the app under uvicorn on a real port,
    #     one long-lived loop, exactly like production. Full run: ~8.5 minutes.
    #   * It had NO SCHEMA. This job never ran migrations, so every DB-backed
    #     operation 500'd against an empty database. It also used POSTGRES_USER=test
    #     while the migration chain grants to the `omniusgrid` role, so migrations
    #     could not have run even if the step had existed.
    #   * "schemathesis can't be run locally" was simply out of date — it is pinned in
    #     requirements-dev.txt.
    #
    # 299 of 451 operations now conform. The remaining 152 are mostly one behaviour —
    # generated input reaching Postgres unvalidated and surfacing as a 500 where the
    # contract promises a 4xx — which is per-endpoint work across every lane. So this
    # ratchets on the measured number instead of demanding green: a regression fails
    # the build today, and the 152 are burned down deliberately. Same instrument as
    # --cov-fail-under, and the same rule: raise it, never lower it.
    timeout-minutes: 30
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          # Must be `omniusgrid`: 004_query_optimization.sql and others GRANT to that
          # role by name, and the whole chain rolls back if it does not exist.
          POSTGRES_USER: omniusgrid
          POSTGRES_PASSWORD: omniusgrid_dev_password
          POSTGRES_DB: omniusgrid_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      # ADDED 2026-07-31. This job provisioned ONLY postgres, so every endpoint whose
      # dependency is Redis answered 503 — feature flags, bulk jobs, export jobs, the
      # query-performance surface. Those endpoints were reporting a missing dependency
      # CORRECTLY; schemathesis counts any 5xx as a server error, so they were charged
      # to the API. Measured against a throwaway database: 368-370 conforming without
      # Redis, 383 with it. ~14 operations that were never the API's fault.
      #
      # No `command:` needed, which is why Redis lands and the broker does not — see
      # the note on the run step below.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dev deps
        working-directory: ./backend
        run: pip install -r requirements-dev.txt
      # A BROKER THAT ADVERTISES AN ADDRESS THE RUNNER CAN REACH (FS-259b).
      #
      # Not a service container, because Redpanda needs `redpanda start
      # --advertise-kafka-addr` and a service block accepts image/env/ports/options and NO
      # command. Point the app at a broker that advertises its own container hostname and
      # the client connects to bootstrap, is redirected somewhere it cannot resolve, and
      # HANGS — the app then never serves /openapi.json inside the suite's 120s window and
      # the run collects 1 operation instead of 452. Observed on a workstation, not
      # predicted.
      #
      # THE STEP IS DELIBERATELY FAIL-SAFE, because an absent broker is harmless and a
      # half-working one is not. The app starts in ~2.6s with no broker at all (every
      # broker-backed endpoint answers 503, which is what this job did before today) and in
      # ~3.3s with a correctly-advertised one. The dangerous state is in between. So the
      # advertised address is verified from the runner, and if anything is wrong the
      # container is removed — leaving the job in its old, known-good shape rather than the
      # hanging one. `|| true` on the whole block for the same reason.
      - name: Start a broker the app can actually reach (best effort)
        continue-on-error: true
        run: |
          docker run -d --name contract-redpanda -p 39092:39092 \
            docker.redpanda.com/redpandadata/redpanda:v23.3.5 \
            redpanda start --overprovisioned --smp 1 --memory 512M \
              --reserve-memory 0M --node-id 0 --check=false \
              --kafka-addr PLAINTEXT://0.0.0.0:39092 \
              --advertise-kafka-addr PLAINTEXT://127.0.0.1:39092 || true

          # The advertised address is the whole point: verify it from the runner rather
          # than trusting the container started.
          for _ in $(seq 1 30); do
            if docker exec contract-redpanda \
                 rpk cluster info --brokers 127.0.0.1:39092 2>/dev/null \
                 | grep -q '127.0.0.1'; then
              echo "broker advertises 127.0.0.1 - usable"
              exit 0
            fi
            sleep 2
          done

          echo "broker did not advertise a reachable address; removing it so the app sees"
          echo "no broker at all rather than one it will hang on."
          docker rm -f contract-redpanda || true
      - name: Migrate the schema
        working-directory: ./backend
        # Without this the contract suite runs against an empty database and every
        # DB-backed operation 500s, which is what it did for weeks.
        env:
          DATABASE_URL: postgresql://omniusgrid:omniusgrid_dev_password@localhost:5432/omniusgrid_test
        run: python scripts/migrate.py
      - name: Run schemathesis contract tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://omniusgrid:omniusgrid_dev_password@localhost:5432/omniusgrid_test
          RUN_CONTRACT_TESTS: "1"
          JWT_SECRET_KEY: test-secret-key
          # Points at the service above. Without it the app falls back to the compose
          # hostname `redis:6379`, which resolves from neither a runner nor a laptop.
          REDIS_URL: redis://localhost:6379/0
          # Points at the docker-run broker above, which advertises 127.0.0.1 so the
          # client is not redirected somewhere it cannot resolve. If that step removed
          # the container (its own health check failed), this resolves to nothing and the
          # broker-backed endpoints answer 503 — the job's behaviour before FS-259b, and
          # a safe floor rather than a hang.
          REDPANDA_URL: 127.0.0.1:39092
        # STILL MISSING, and it is the six /admin/query-performance/* operations:
        # pg_stat_statements needs `shared_preload_libraries` on the server command line,
        # and postgres is a SERVICE container here, which takes no command for the same
        # reason the broker could not be one. Fixing it means replacing the service with a
        # `docker run` — a larger change to a blocking job than the broker was, because a
        # postgres that fails to start collapses the whole suite rather than degrading it
        # to 503s. Left until it can be watched on a real run.
        #
        # Individual failures do not fail the step; the ratchet below decides. The
        # junit report is the input, so a crashed or truncated run cannot be mistaken
        # for a clean one — contract_ratchet.py rejects a report whose operation count
        # collapsed.
        run: pytest tests/test_api_contract.py -q --junitxml=contract-report.xml || true
      # BEFORE the ratchet, so the numbers are in the run summary even when the next
      # step fails the build — the moment a reader most wants them. Never fails the
      # build itself; the ratchet below is the gate.
      - name: Summarise conformance
        if: always()
        working-directory: ./backend
        run: python scripts/contract_summary.py contract-report.xml
      - name: Conformance must not regress
        working-directory: ./backend
        run: python scripts/contract_ratchet.py contract-report.xml
      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-report
          path: backend/contract-report.xml

  # --- FS-114: real-DB guard suite (schema parity + endpoint/write smoke) ---
  backend-realdb:
    runs-on: ubuntu-latest
    # BLOCKING. This is the only workflow that runs on hamad/** pushes, and
    # until now NO job here executed the backend suite — so the FS-91/92/93
    # real-DB guards (which spin an ephemeral TimescaleDB via testcontainers)
    # never ran on the convergence branch. They also SILENTLY SKIPPED in
    # ci-cd.yml because testcontainers wasn't a pinned dev dep. FS-114 fixes
    # both: the pin lands in requirements-dev.txt and this job runs the guards
    # against a real Postgres so ORM<->migration drift and naive-datetime bugs
    # (which SQLite create_all masks) fail the merge instead of prod.
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dev deps (incl. testcontainers)
        working-directory: ./backend
        run: pip install -r requirements-dev.txt
      - name: Verify testcontainers is importable (guards must not skip)
        working-directory: ./backend
        # Fail loudly if the pin ever regresses: a skipped guard is a silent
        # loss of the exact coverage this job exists to provide.
        run: python -c "import testcontainers.postgres; print('testcontainers OK')"
      - name: Real-DB guard suite
        working-directory: ./backend
        # testcontainers talks to the host Docker daemon (present on
        # ubuntu-latest); each spun container migrates the schema via
        # scripts/migrate.py, so this is a true fresh-chain parity check.
        run: |
          pytest -q \
            tests/test_schema_parity.py \
            tests/test_realdb_endpoint_smoke.py \
            tests/test_realdb_write_smoke.py \
            tests/test_no_naive_utcnow.py \
            tests/test_demo_seeder_smoke.py \
            tests/test_backup_restore_drill.py \
            tests/test_dashboard_tenancy.py \
            tests/test_dashboard_analytics.py \
            tests/test_raw_insert_timestamps.py \
            tests/test_timestamp_backfill.py \
            tests/test_tenant_isolation_api.py \
            tests/test_alarm_tenant_isolation.py \
            tests/test_alarm_rules_api.py \
            tests/test_user_management_api.py \
            tests/test_reporting_honesty.py \
            tests/test_openapi_quality.py \
            tests/test_erp_connectors.py \
            tests/test_erp_netsuite_connector.py \
            tests/test_tenant_isolation_rls.py \
            tests/test_tenant_isolation_dependency.py \
            tests/test_compliance_tenant_isolation_api.py \
            tests/test_historian_retention_rls.py \
            tests/test_model_registry_rls.py \
            tests/test_kanban_tenant_scope.py

  # --- FS-203: migration chain hygiene (blocking) ---------------------------
  migration-hygiene:
    runs-on: ubuntu-latest
    # BLOCKING and cheap. check_migrations.py has existed for a while but ran in
    # NO workflow — only as a Makefile target — so a duplicate migration prefix
    # could land unnoticed. Two migrations sharing a prefix apply in an
    # order that depends on the full filename, which is not obvious to whoever
    # wrote them.
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No new duplicate migration prefixes
        working-directory: ./backend
        run: python scripts/check_migrations.py

  # --- FS-205: the rest of the backend suite (blocking) ---------------------
  backend-full:
    runs-on: ubuntu-latest
    # BLOCKING. ci-cd.yml runs the full backend suite but triggers only on `main`
    # and v* tags, while quality-gates.yml is the ONLY workflow that runs on
    # hamad/** — and it ran a 10-file list. So roughly 700 backend tests,
    # including the entire tenant-isolation suite, executed nowhere on the working
    # branch.
    #
    # This started advisory against 11 known failures. Five were real defects in
    # this lane and are fixed (str-vs-UUID comparisons, a Referrer-Policy that
    # middleware silently downgraded on signed downloads, and an always-on auth
    # rate limiter that 500'd every login when Redis was unreachable). What
    # remains is deselected BY NAME below, in two groups, so this can be blocking
    # without hiding anything:
    #
    #   other lanes  — the intake/parsing domain mappers (HARSH) and an OTA
    #                  rollout-creation 404 (Hridyansh). Real bugs, not mine.
    #   Kafka-dependent e2e — the three files that need a live Redpanda broker.
    #                  Each spins its own container and they cannot reliably
    #                  coexist inside one suite run; every one passes in ISOLATION.
    #                  These belong in `nightly-e2e.yml`, which already stands up
    #                  real infrastructure (`docker compose up timescaledb redpanda
    #                  redis`) instead of racing containers inside pytest. Moving
    #                  them there is the right split, not a dodge.
    #   one flake    — test_invalid_tokens_return_uniform_403 passes 15/15 in
    #                  isolation and was already flaking before this batch, so it
    #                  is pre-existing order-dependence, not a regression. Fixing
    #                  that isolation is its own task; a blocking gate that fails at
    #                  random is worse than one with named exclusions.
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dev deps
        working-directory: ./backend
        run: pip install -r requirements-dev.txt
      - name: Full backend suite
        working-directory: ./backend
        # The three excluded files fail at COLLECTION (the intake/parsing lane's
        # scenario builders don't import); they are excluded in ci-cd.yml for the
        # same reason.
        run: |
          pytest -q \
            --ignore=tests/test_document_scenario_builder.py \
            --ignore=tests/test_image_scenario_builder.py \
            --ignore=tests/test_cross_file_scenario_builder.py \
            --deselect tests/test_document_domain_mapper.py::test_map_section_to_domain_table_content \
            --deselect tests/test_image_domain_mapper.py::test_map_image_domains \
            --deselect tests/test_agent_ota_api.py::test_rollout_creation_resolves_only_tenant_targets \
            --ignore=tests/test_compliance_reports_e2e.py \
            --ignore=tests/test_ingestion_redpanda_e2e.py \
            --ignore=tests/test_compliance_report_scheduling_e2e.py \
            --deselect tests/test_signed_report_downloads.py::test_invalid_tokens_return_uniform_403

  # --- FS-205c: Kafka-dependent e2e, in their own process (blocking) --------
  backend-kafka-e2e:
    runs-on: ubuntu-latest
    # BLOCKING. These three files stand up a real Redpanda broker via
    # testcontainers. Interleaved with the other ~715 tests they were flaky; run
    # as their own pytest process they are reliable (6/6 across three runs).
    #
    # The root cause of the original flakiness IS fixed: _RedpandaContainer was
    # duplicated across two modules — one session-scoped, one module-scoped and
    # imported by a third — so a single run started several brokers that
    # interfered. conftest.py now owns ONE session-scoped broker. That took the
    # in-suite failures from 4 to 1, but the last one still churned run-to-run
    # (residual cross-module producer state), so the honest split is to give the
    # container-spinning tests their own process rather than pretend the fast
    # suite tolerates them. This keeps per-push coverage — they are NOT demoted
    # to nightly.
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dev deps
        working-directory: ./backend
        run: pip install -r requirements-dev.txt
      - name: Kafka e2e
        working-directory: ./backend
        run: |
          pytest -q \
            tests/test_compliance_reports_e2e.py \
            tests/test_ingestion_redpanda_e2e.py \
            tests/test_compliance_report_scheduling_e2e.py

  # --- FS-107: Prometheus alert rules — lint + unit test -------------------
  prometheus-rules:
    runs-on: ubuntu-latest
    # BLOCKING. Alert rules are code: a typo'd expr or an unfirable threshold
    # (e.g. a histogram_quantile compared above its largest finite bucket) is a
    # silent gap — the alert simply never pages. Until now nothing validated
    # infra/prometheus/alerts.yml at all. This lints every rule and runs the
    # promtool unit tests that assert the deterministic alerts actually fire.
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - name: Install promtool
        run: |
          PROM_VERSION=2.53.1
          curl -sSL -o /tmp/prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tar.gz -C /tmp
          sudo mv "/tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version
      - name: Lint alert rules
        working-directory: ./infra/prometheus
        run: promtool check rules alerts.yml slo_rules.yml
      # `check rules` validates rule files; it does NOT read prometheus.yml, so a
      # broken scrape_config or a rule_files path pointing at nothing stayed
      # invisible. Both configs reference their rule files by absolute in-container
      # path, so stage them where each expects: compose reads /etc/prometheus/*.yml,
      # the in-cluster ConfigMap reads /etc/prometheus/rules/*.yml.
      - name: Stage rule files at their runtime paths
        run: |
          sudo mkdir -p /etc/prometheus/rules
          sudo cp infra/prometheus/alerts.yml infra/prometheus/slo_rules.yml /etc/prometheus/
          sudo cp infra/prometheus/alerts.yml infra/prometheus/slo_rules.yml /etc/prometheus/rules/
      - name: Check Prometheus configs (compose + in-cluster)
        run: |
          promtool check config infra/prometheus/prometheus.yml
          promtool check config infrastructure/k8s/monitoring/prometheus-config.yml
      - name: Run alert unit tests
        working-directory: ./infra/prometheus
        run: |
          promtool test rules \
            tests/error_alerts_test.yml \
            tests/subsystems_alerts_test.yml \
            tests/platform_alerts_test.yml \
            tests/worker_alerts_test.yml \
            tests/security_alerts_test.yml

  # --- k8s manifest validation (blocking) ----------------------------------
  k8s-manifests:
    runs-on: ubuntu-latest
    # BLOCKING. Deploy jobs in ci-cd.yml only build the staging/production
    # overlays — nothing validated base/ or the operator-managed stacks
    # (monitoring, database-ha, autoscaling), so a broken kustomization or an
    # invalid manifest in any of them would only surface at apply time (or never,
    # for the opt-in stacks). This builds EVERY kustomization and schema-validates
    # the output, so a typo'd field or an unbuildable overlay fails the merge.
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - name: Setup kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize
          kustomize version
      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kc.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          sudo tar xz -C /usr/local/bin -f /tmp/kc.tar.gz kubeconform
          kubeconform -v
      - name: Build + validate app manifests (base + overlays)
        run: |
          set -euo pipefail
          for t in base overlays/staging overlays/production overlays/dr; do
            echo "::group::$t"
            kustomize build "infrastructure/k8s/$t" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -kubernetes-version 1.29.0
            echo "::endgroup::"
          done
      - name: Probes exist and address a real port
        run: |
          pip install pyyaml
          # kubeconform cannot catch this: a probe naming a port the container does not
          # declare is schema-valid YAML. The kubelet gets connection refused and
          # restart-loops the workload — so a wrong probe is worse than no probe, because
          # it reads like the fix.
          ./tests/k8s/check_probe_ports.py
      - name: No placeholder credentials reachable in staging or production
        run: |
          pip install pyyaml
          # The matcher first. It once reported OK for a `secretGenerator` placeholder,
          # because that emits base64 `data` and the markers were compared against the
          # encoded string — so the three OKs below meant nothing for the idiomatic way
          # of writing the very thing this guards. If the self-test fails, they mean
          # nothing again.
          ./tests/k8s/check_placeholder_secrets.py --self-test
          ./tests/k8s/check_placeholder_secrets.py
          ./tests/k8s/check_placeholder_secrets.py --staging
          ./tests/k8s/check_placeholder_secrets.py --dr
      - name: Security-critical backend settings reach the container
        run: |
          pip install pyyaml
          # The app defaults ALLOW_DEV_TOKEN and ALLOW_OPEN_REGISTRATION to TRUE so a
          # laptop demo works offline, and nothing here overrode them — so every overlay
          # deployed a backend accepting the string `dev-token` as an admin credential.
          # validate_settings() exists to stop that and hard-fails at import, but only
          # when ENVIRONMENT=production, and ENVIRONMENT appeared in no manifest at all.
          # A real guard that nothing had ever armed.
          #
          # Checks the BUILT manifests, and resolves envFrom the way the kubelet does
          # (explicit `env` beats it) — the sources each read correctly on their own and
          # the defect is only visible in the combination.
          ./tests/k8s/check_backend_security_config.py
      - name: Build + validate operator stacks (monitoring, database-ha, autoscaling)
        # These reference operator CRDs (Prometheus rules from outside the tree,
        # CloudNativePG Cluster/Pooler, KEDA ScaledObject) — build with the None
        # load-restrictor and let kubeconform skip the CRD schemas it can't know.
        run: |
          set -euo pipefail
          for t in monitoring database-ha autoscaling; do
            echo "::group::$t"
            kustomize build --load-restrictor LoadRestrictionsNone "infrastructure/k8s/$t" \
              | kubeconform -summary -ignore-missing-schemas \
                  -kubernetes-version 1.29.0
            echo "::endgroup::"
          done

  # --- k8s live smoke test on kind (blocking) ------------------------------
  k8s-smoke:
    runs-on: ubuntu-latest
    # BLOCKING. k8s-manifests above proves the manifests BUILD and are
    # schema-valid; this proves the operator stacks actually RUN and that the
    # custom resources pass the REAL admission webhooks — which kubeconform
    # can't check because it skips CRD schemas. Promoted to blocking after
    # observing it green end-to-end (monitoring applies + goes Ready; the CNPG
    # Cluster and KEDA ScaledObjects pass their operators' validating webhooks).
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: omniusgrid-smoke
      - name: Setup kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize

      # --- Monitoring: full apply + wait Ready (public images, no CRDs) ------
      - name: Smoke-test the monitoring stack (real apply)
        run: |
          set -euo pipefail
          kubectl create namespace omniusgrid
          kustomize build --load-restrictor LoadRestrictionsNone infrastructure/k8s/monitoring \
            | kubectl apply -f -
          # Prove each component actually schedules and becomes Ready.
          kubectl -n omniusgrid rollout status statefulset/prometheus --timeout=180s
          kubectl -n omniusgrid rollout status statefulset/alertmanager --timeout=180s
          kubectl -n omniusgrid rollout status deployment/kube-state-metrics --timeout=180s
          kubectl -n omniusgrid rollout status deployment/grafana --timeout=180s

      # --- CloudNativePG: install operator, validate the Cluster CR ----------
      - name: Install CloudNativePG operator
        run: |
          kubectl apply --server-side -f \
            https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.24/releases/cnpg-1.24.0.yaml
          kubectl -n cnpg-system rollout status deployment/cnpg-controller-manager --timeout=180s
      - name: Validate the HA database CR against the real CNPG webhook
        run: |
          set -euo pipefail
          # Server dry-run runs the operator's validating webhook — catches CR
          # field errors kubeconform skipped. No pods are pulled/started.
          kustomize build --load-restrictor LoadRestrictionsNone infrastructure/k8s/database-ha \
            | kubectl apply --dry-run=server -f -

      # --- KEDA: install operator, validate the ScaledObjects ----------------
      - name: Install KEDA operator
        run: |
          kubectl apply --server-side -f \
            https://github.com/kedacore/keda/releases/download/v2.15.1/keda-2.15.1.yaml
          kubectl -n keda rollout status deployment/keda-operator --timeout=180s
      - name: Validate the worker ScaledObjects against the real KEDA webhook
        run: |
          set -euo pipefail
          # The ScaledObjects reference worker Deployments via scaleTargetRef, so
          # create those objects first (they ImagePullBackOff — we never wait on
          # them; only their existence is needed for the target check).
          kustomize build infrastructure/k8s/base | kubectl apply -f - || true
          kustomize build infrastructure/k8s/autoscaling \
            | kubectl apply --dry-run=server -f -

  # --- NetworkPolicy enforcement on Calico (blocking) ----------------------
  k8s-netpol:
    runs-on: ubuntu-latest
    # BLOCKING. k8s-smoke runs on kind's default CNI (kindnet), which IGNORES
    # NetworkPolicies — so it proves the policies parse and apply, never that they
    # work. This runs the same base manifests on Calico, where policy is enforced,
    # and asserts real connectivity both ways:
    #   ALLOW export-worker -> seaweedfs:8333  (the S3 export path; this exact rule
    #         was missing when the object store shipped, silently breaking every
    #         export upload/download under an enforcing CNI)
    #   DENY  ingestion-worker -> seaweedfs:8333  (proves policy is really enforced;
    #         without this the ALLOW assertion would pass even with no CNI at all)
    # Promoted to blocking after observing both assertions execute and pass under
    # Calico ("OK (reachable)" / "OK (blocked)").
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - name: Create kind cluster (no default CNI)
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: omniusgrid-netpol
          config: tests/k8s/kind-calico.yaml
      - name: Install Calico
        run: |
          set -euo pipefail
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.1/manifests/calico.yaml
          # Nodes stay NotReady until the CNI is up.
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
      - name: Setup kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize
      - name: Apply NetworkPolicies (base + monitoring + database-ha)
        run: |
          set -euo pipefail
          kubectl create namespace omniusgrid
          kubectl create namespace keda              # cross-namespace: KEDA scalers
          kubectl create namespace netpol-outsider   # negative control
          # Apply ONLY the policies (not the whole app) — the probe pods stand in
          # for the real workloads, so no application images need to pull.
          {
            kustomize build infrastructure/k8s/base
            kustomize build --load-restrictor LoadRestrictionsNone infrastructure/k8s/monitoring
            kustomize build --load-restrictor LoadRestrictionsNone infrastructure/k8s/database-ha
          } | ./tests/k8s/extract-netpols.py | kubectl apply -f -
          kubectl -n omniusgrid get networkpolicy
      - name: Deploy probe pods
        run: kubectl apply -f tests/k8s/netpol-probe.yaml
      - name: Assert NetworkPolicy enforcement
        run: ./tests/k8s/netpol-test.sh
      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n omniusgrid get pods -o wide || true
          kubectl -n keda get pods -o wide || true
          kubectl -n netpol-outsider get pods -o wide || true
          kubectl -n omniusgrid describe networkpolicy || true

  # --- NetworkPolicy matrix simulation (blocking, no cluster) --------------
  netpol-simulate:
    runs-on: ubuntu-latest
    # BLOCKING and cheap (seconds, no cluster). Evaluates the SAME client->server
    # matrix that k8s-netpol asserts, but directly against the policy YAML — so a
    # policy change that breaks an expected path fails in ~20s instead of after a
    # 5-minute kind+Calico spin-up. k8s-netpol remains the source of truth (it
    # proves a real CNI agrees with this model); this is the fast feedback loop.
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - name: Setup kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize
      - name: Simulate the enforcement matrix
        run: |
          set -euo pipefail
          pip install pyyaml
          {
            kustomize build infrastructure/k8s/base
            kustomize build --load-restrictor LoadRestrictionsNone infrastructure/k8s/monitoring
            kustomize build --load-restrictor LoadRestrictionsNone infrastructure/k8s/database-ha
          } | ./tests/k8s/extract-netpols.py > /tmp/netpols.yaml
          # Derive the matrix from the shell script so the two can't drift.
          grep -oE '^  "[^"]+"' tests/k8s/netpol-test.sh | tr -d ' "' \
            | awk -F'|' 'NF>=6{print $1"\t"$3"\t"$4"\t"$5"\t"$6}' > /tmp/matrix.tsv
          ./tests/k8s/simulate-netpols.py /tmp/netpols.yaml tests/k8s/netpol-probe.yaml /tmp/matrix.tsv
      - name: Every workload in a default-deny namespace has a policy
        run: |
          set -euo pipefail
          # Complements the matrix above rather than duplicating it. The matrix
          # proves the paths someone wrote a case for; this proves no workload is
          # entirely cut off — the gap that killed otel/jaeger and, on the guard's
          # first run, edge-agent / redpanda / timescaledb / frontend too.
          for overlay in base overlays/staging overlays/production overlays/dr; do
            echo "--- $overlay ---"
            kustomize build "infrastructure/k8s/$overlay" \
              | ./tests/k8s/check_netpol_coverage.py
          done

  # --- task 1: frontend unit tests (Vitest) --------------------------------
  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: ./frontend
        run: npm ci
      - name: Vitest
        working-directory: ./frontend
        run: npm run test

  # --- task 2: frontend E2E smoke (Playwright) -----------------------------
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
