          DATAVERSE_TENANT_ID: ${{ secrets.DATAVERSE_TENANT_ID }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DATAVERSE_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DATAVERSE_CLIENT_SECRET }}
        run: pytest tests/test_erp_sync_e2e_realdb.py -q -rs

  # --- ERP Tier 3: the Odoo connector against a REAL Odoo -------------------
  erp-odoo-integration:
    runs-on: ubuntu-latest
    # Every other ERP test asserts the request we BUILD, against our reading of the
    # vendor docs — which cannot disconfirm a wrong assumption, because the fixture
    # encodes the same assumption as the code. Odoo is the one ERP in the matrix
    # that is self-hostable, so here the server gets a vote.
    #
    # It found a real defect on its first run: health_check probed `sale.order`,
    # which only exists when the Sales module is installed, so a working Odoo
    # without Sales reported permanently unhealthy.
    services:
      odoo-db:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
      odoo:
        image: odoo:17
        env:
          HOST: odoo-db
          USER: odoo
          PASSWORD: odoo
        ports: ['8169:8069']
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install backend deps
        working-directory: ./backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Provision the Odoo sandbox
        # Creates the database WITH DEMO DATA. An empty Odoo would let every fetch
        # test pass by returning nothing — the exact silent-empty-result failure
        # these tests exist to catch.
        run: python backend/scripts/setup_odoo_sandbox.py
      - name: Odoo connector integration tests
        working-directory: ./backend
        env:
          RUN_ODOO_INTEGRATION: "1"
          ODOO_URL: http://localhost:8169
        run: pytest tests/test_erp_odoo_integration.py -q

  # --- FS-239: authenticated E2E against a LIVE backend ---------------------
  frontend-e2e-authenticated:
    runs-on: ubuntu-latest
    # Separate from frontend-e2e on purpose. That job needs nothing but a browser
    # and stays fast; this one stands up Postgres, migrations, demo data and
    # uvicorn, so keeping them together would make every smoke run pay for
    # infrastructure it does not use.
    #
    # This is the test that would have caught FS-191, where the dashboard rendered
    # every tile as 0 because RLS filtered every row and nothing errored. It can
    # only catch that against real data, which is why the whole stack is here.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          # The role name matters: migration 004 does
          # `GRANT SELECT ON pg_stat_statements TO omniusgrid`, so any other
          # username fails the chain partway through.
          POSTGRES_USER: omniusgrid
          POSTGRES_PASSWORD: omniusgrid_dev_password
          POSTGRES_DB: omniusgrid_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgresql+asyncpg://omniusgrid:omniusgrid_dev_password@localhost:5432/omniusgrid_test
      JWT_SECRET_KEY: e2e-test-secret-key
      ALLOW_DEV_TOKEN: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Migrate
        working-directory: ./backend
        run: python scripts/migrate.py
      - name: Seed demo data
        working-directory: ./backend
        # The dashboard assertions are about NON-ZERO values, so the org this user
        # lands on has to contain assets, alarms and telemetry. Logging in to an
        # empty org would pass against a blank page.
        run: python scripts/seed_demo_data.py
      - name: Seed the e2e user
        working-directory: ./backend
        # seed_demo_data.py's admin carries a placeholder bcrypt hash matching no
        # known plaintext, so it cannot be logged in as — the demo relies on the
        # VITE_DEV_MODE bypass instead. This creates a user whose password is
        # hashed by the application itself.
        run: python scripts/seed_e2e_user.py
      - name: Start the backend
        working-directory: ./backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health || { echo "backend did not start"; exit 1; }
      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Live-backend e2e (authenticated journey + data reaches the screen)
        working-directory: ./frontend
        env:
          E2E_LIVE_BACKEND: "1"
          # Points the SPA at the backend started above; without it the dev build
          # guesses http://<hostname>:8000, which is right here but only by luck.
          VITE_API_URL: http://127.0.0.1:8000
        # NAMED FILES, not the whole directory, and both are named (FS-443). This ran
        # `authenticated.spec.ts` alone, so a new live-backend spec would have been
        # collected by Playwright, skipped on every laptop for want of a backend, and
        # never executed anywhere — a test that exists and never runs, which is the
        # failure `test_ci_quarantine_expires.py` exists to prevent one layer down.
        #
        # Still explicit rather than `npx playwright test`: the smoke suite runs in its own
        # job without a backend, and running it here too would double every smoke test.
        run: |
          npx playwright test \
            e2e/authenticated.spec.ts \
            e2e/data-reaches-the-screen.spec.ts

  # --- task 19: pre-commit hooks as a CI gate ------------------------------
  pre-commit:
    runs-on: ubuntu-latest
    # Advisory while the existing tree is brought into compliance.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pre-commit/action@v3.0.1

  # --- task 20: supply-chain scanning --------------------------------------
  supply-chain:
    runs-on: ubuntu-latest
    # BLOCKING since FS-70: backend/edge pins are pip-audit clean and the npm
    # lockfile is at 0 vulnerabilities. One documented ignore below.
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-audit (backend)
        # No ignores: FS-76 swapped python-jose -> PyJWT, dropping ecdsa (and its
        # Minerva advisory PYSEC-2026-1325) from the dependency tree entirely.
        run: pip install pip-audit==2.7.3 && pip-audit -r backend/requirements.txt
      - name: pip-audit (edge-agent)
        run: pip-audit -r edge-agent/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit (frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=high
      - name: Trivy filesystem scan (frontend + edge)
        # BLOCKING since FS-79: the misconfig backlog it was waiting on is
        # remediated — backend/frontend/rag images run non-root (FS-77), k8s has
        # egress NetworkPolicies (FS-78), and a curated .trivyignore documents
        # any residual accepted findings. exit-code 1 now gates the merge.
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  # --- FS-144/145: repo hygiene (blocking) ----------------------------------
  # Both of these were real regressions, not hypotheticals:
  #   * the root .dockerignore existed only in Hamad's working tree, so every CI
  #     backend build (context: .) shipped frontend/, backend/venv, .git and
  #     *.pem into the build context.
  #   * frontend/node_modules was committed before .gitignore listed it, so the
  #     ignore rule was inert and 19k darwin-built files were tracked.
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false

      - name: Root .dockerignore must be tracked
        run: |
          if ! git ls-files --error-unmatch .dockerignore >/dev/null 2>&1; then
            echo "::error::.dockerignore is not tracked — CI image builds will" \
                 "include frontend/, venv, .git and *.pem in the build context."
            exit 1
          fi

      - name: No dependency or build output may be tracked
        run: |
          offenders=$(git ls-files | grep -E '(^|/)(node_modules|venv|\.venv)/' || true)
          if [ -n "$offenders" ]; then
            echo "::error::$(echo "$offenders" | wc -l) dependency files are tracked in git."
            echo "$offenders" | head -20
            exit 1
          fi

      - name: No private key material may be tracked
        run: |
          offenders=$(git ls-files | grep -E '\.(pem|key|p12|pfx)$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::private key material is tracked in git:"
            echo "$offenders"
            exit 1
          fi

  # --- task 20: k6 smoke load test ------------------------------------------
  load-test:
    runs-on: ubuntu-latest
    # BLOCKING as of 2026-07-30, and it now has a target. It previously ran k6 against
    # BASE_URL=http://localhost:8000 with nothing in the job listening on it, under a
    # comment reading "harmless smoke run otherwise" — every request failed with a
    # connection error, the `http_req_failed: rate<0.01` threshold was breached every
    # time, and `continue-on-error: true` turned that into a green tick for no work.
    #
    # It was broken a second way that standing the app up would NOT have fixed: the
    # script hit '/api/v1/telemetry' and '/api/v1/dashboard', neither of which is a
    # route. Every telemetry endpoint is scoped to an asset, and 'dashboard' is a
    # router prefix. Both 404'd, and '/api/v1/assets' and '/api/v1/alarms' only
    # 307-redirected. Four of eight endpoints were wrong, so even against a healthy
    # app it would have reported ~50% errors. All eight now verified 200 against a
    # migrated database, including the two response-shape checks.
    #
    # WHAT IT ASSERTS, deliberately narrowly: that the app serves its main read paths
    # under concurrency without erroring. It does NOT assert the latency SLOs in the
    # script's own `thresholds` — p(95)<500ms on a shared GitHub runner measures the
    # runner's neighbours, and a gate that fails for reasons the author cannot act on
    # is one that gets disabled. The stage plan in the script is a 29-minute
    # 1000-user profile for running against real infrastructure; CI overrides it with
    # 5 VUs for 30s, which is a smoke test and is described as one.
    timeout-minutes: 15
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: omniusgrid
          POSTGRES_PASSWORD: omniusgrid_dev_password
          POSTGRES_DB: omniusgrid_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/dataset is a 1.5 GB LLM-generated training corpus that NO job
          # reads. Excluding it keeps the checkout at ~100 MB instead of 1.6 GB.
          sparse-checkout: |
            /*
            !/backend/dataset/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install backend deps
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Migrate the schema
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://omniusgrid:omniusgrid_dev_password@localhost:5432/omniusgrid_test
        run: python scripts/migrate.py
      - name: Start the app
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://omniusgrid:omniusgrid_dev_password@localhost:5432/omniusgrid_test
          JWT_SECRET_KEY: test-secret-key
          ALLOW_DEV_TOKEN: "true"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8002 \
            --log-level warning > uvicorn.log 2>&1 &
          # Wait for readiness rather than sleeping a guessed interval: a fixed sleep
          # either wastes time or starts k6 against a half-open socket.
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8002/health >/dev/null && echo "app ready" && exit 0
            sleep 2
          done
          echo "app did not become ready; last 50 log lines:" && tail -50 uvicorn.log && exit 1
      - name: Run k6 smoke load test
        uses: grafana/setup-k6-action@v1
      - name: Execute
        uses: grafana/run-k6-action@v1
        with:
          path: tests/load/k6-load-test.js
        env:
          BASE_URL: http://127.0.0.1:8002
          API_TOKEN: dev-token
          # Selects the smoke profile INSIDE the script: 5 VUs for 30s, and error-rate
          # thresholds without the latency SLOs. Doing it there rather than with
          # `--no-thresholds` here is the whole point — k6 exits non-zero on a breached
          # threshold and NOT on a failed check, so `--no-thresholds` would have made
          # this job incapable of failing, which is the state it is being rescued from.
          CI_SMOKE: "true"
      - name: App log on failure
        if: failure()
        working-directory: ./backend
        run: tail -100 uvicorn.log
